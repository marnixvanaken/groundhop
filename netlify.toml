[build]
  # De demodata staat niet in git (zie .gitignore); die wordt hier gebouwd.
  command = "python3 demo/build_app_data.py"
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/dashboard.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
