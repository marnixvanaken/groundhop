[build]
  # De appdata staat niet in git (zie .gitignore); die wordt hier gebouwd.
  command = "python3 app/build_app_data.py"
  publish = "."
  functions = "netlify/functions"

# Het nieuwe ontwerp staat in app/ en wordt op het hoofdadres geserveerd;
# het oude dashboard blijft op /dashboard.html.
[[redirects]]
  from = "/demo/*"
  to = "/:splat"
  status = 302

[[redirects]]
  from = "/"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/duels.html"
  to = "/app/duels.html"
  status = 200

[[redirects]]
  from = "/grounds.html"
  to = "/app/grounds.html"
  status = 200

[[redirects]]
  from = "/spelers.html"
  to = "/app/spelers.html"
  status = 200

[[redirects]]
  from = "/meer.html"
  to = "/app/meer.html"
  status = 200

[[redirects]]
  from = "/wedstrijddetail.html"
  to = "/app/wedstrijddetail.html"
  status = 200

[[redirects]]
