<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#edeff2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<title>Stadion — GroundHop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="groundhop.css">
<style>
/* Alleen wat dit scherm zelf nodig heeft; de rest staat in groundhop.css.

   Eén scherm voor twee soorten stadions: waar je 94 keer kwam en waar je één
   avond was. De tellerband houdt dezelfde vorm maar verandert van betekenis,
   en onderdelen die bij één bezoek niets zeggen (de seizoensreeks) vallen weg. */

.venue-head{padding:18px 16px 4px; text-align:center;}
.venue-head h2{font-family:var(--display); font-size:24px; font-weight:700;
  letter-spacing:-0.02em; line-height:1.15;}
.venue-head p{font-size:13px; color:var(--content-2); margin-top:3px;}
.span{text-align:center; padding:14px 16px; font-size:12px; color:var(--content-2);}

.drie{display:grid; grid-template-columns:repeat(3,1fr);}
.drie > div{padding:12px 16px; min-width:0;}

.solo{padding:16px; display:block; color:inherit; text-decoration:none;}
.solo-crests{display:flex; gap:10px; margin-bottom:10px;}
.solo .teams{font-size:19px; font-weight:600; line-height:1.25;}
.solo .uitslag{
  font-family:var(--display); font-variant-numeric:tabular-nums;
  font-size:34px; font-weight:700; letter-spacing:-0.02em; margin:6px 0 2px;
}
</style>
</head>
<body>

<div class="bar" id="bar"></div>

<main id="app"></main>

<nav class="tabbar" aria-label="Hoofdnavigatie"></nav>

<script src="app-data.js"></script>
<script src="speler-data.js"></script>
<script src="groundhop.js"></script>
<script>
const app = document.getElementById('app');
tabbalk('grounds');
document.getElementById('bar').innerHTML = terugknop('Grounds', 'grounds.html') + '<h1>Stadion</h1>';

/* Bijna alles wordt hier afgeleid: de bron geeft per stadion maar zeven
   velden. Goals, clubs, spelers, toernooien en scheidsrechters komen uit de
   wedstrijden op dat adres, de posities uit de vergelijking met de rest. */
function bereken(v){
  const ms = APP.matches.filter(m => m.venue === v.key);
  const ids = new Set(ms.map(m => m.id));
  const tel = lijst => {
    const t = {};
    lijst.forEach(k => t[k] = (t[k] || 0) + 1);
    return Object.entries(t).sort((a, b) => b[1] - a[1]);
  };
  const goals = ms.reduce((s, m) => s + m.goals.length, 0);
  const publiek = ms.map(m => m.att).filter(Boolean);
  const spelers = Object.values(SPELERS).filter(p => p.m.some(r => ids.has(r[0]))).length;
  const metPubliek = APP.venues.filter(x => x.max_att).sort((a, b) => b.max_att - a.max_att);
  return {
    ms, goals, spelers,
    eerst: v.first || ms[ms.length - 1]?.date,
    laatst: v.last || ms[0]?.date,
    perDuel: ms.length ? (goals / ms.length).toFixed(1).replace('.', ',') : '—',
    clubs: tel(ms.flatMap(m => [m.hid, m.aid])),
    comps: tel(ms.map(m => m.t)),
    refs: new Set(ms.map(m => m.ref).filter(Boolean)).size,
    publiekBekend: publiek.length,
    publiekMax: publiek.length ? Math.max(...publiek) : v.max_att,
    rangBezoek: APP.venues.indexOf(v) + 1,
    rangPubliek: v.max_att ? metPubliek.indexOf(v) + 1 : null,
    reeks: seizoensreeks(ms.map(m => m.date)),
  };
}

// De tellerband. Bij veel bezoeken telt hij op, bij één bezoek beschrijft hij
// die ene avond. Zelfde vorm, andere betekenis.
function tellers(v, b){
  const cellen = b.ms.length === 1
    ? [['1×', 'bezoek'], [getal(b.goals), 'goals gezien'], [getal(b.publiekMax), 'toeschouwers']]
    : [[getal(b.ms.length) + '×', 'bezoeken'], [getal(b.goals), 'goals gezien'], [b.perDuel, 'per duel']];
  return `<div class="tally">${cellen.map(([w, l]) => `
    <div><b class="num">${w}</b><span>${l}</span></div>`).join('')}</div>`;
}

function duels(b){
  if (b.ms.length === 1){
    const m = b.ms[0], h = club(m.hid), a = club(m.aid);
    return `
    <section class="card">
      <div class="card-head"><h2>Dat ene duel</h2></div>
      <a class="solo" href="${wedstrijdHref(m.id)}">
        <div class="solo-crests">${logo(h.crest, h.name)}${logo(a.crest, a.name)}</div>
        <div class="teams">${esc(h.name)}<br>${esc(a.name)}</div>
        <div class="uitslag num">${m.hs} – ${m.as}</div>
        <div class="duel-meta">${esc(comp(m.t))} · ${datum(m.date, true)}</div>
      </a>
      ${m.ref ? `<div class="row" style="border-top:0.5px solid var(--separator)">
        <div class="row-main"><div class="row-label">Scheidsrechter</div>
        <div class="row-value">${esc(m.ref)}</div></div></div>` : ''}
    </section>`;
  }
  const toon = b.ms.slice(0, 6);
  return `
  <section class="card" id="duels">
    <div class="card-head"><h2>Laatste duels</h2><h2>${b.ms.length} totaal</h2></div>
    <div style="height:8px"></div>
    ${toon.map(duelLink).join('')}
    ${b.ms.length > toon.length
      ? `<button class="meer-knop" type="button" id="alle">Alle ${b.ms.length} duels</button>` : ''}
  </section>`;
}

function render(){
  const v = stadion(param('v')) || APP.venues[0];
  const b = bereken(v);
  document.title = `${v.name} — GroundHop`;

  app.innerHTML = `
  <section class="card">
    <div class="venue-head">
      <h2>${esc(v.name)}</h2>
      <p>${[v.city, v.country].filter(Boolean).map(esc).join(' · ')}</p>
    </div>
    ${tellers(v, b)}
    <div class="span">
      ${b.ms.length === 1 ? datum(b.eerst, true) : `${datum(b.eerst)} &nbsp;—&nbsp; ${datum(b.laatst)}`}
    </div>
  </section>

  ${b.reeks ? `
  <section class="card">
    <div class="card-head"><h2>Duels per seizoen</h2><h2>${b.reeks.rijen.length} seizoenen</h2></div>
    ${b.reeks.html}
    ${b.reeks.leeg ? `<div class="note">${b.reeks.leeg === 1 ? '1 seizoen' : b.reeks.leeg + ' seizoenen'}
      zonder bezoek, als nul in de reeks.</div>` : '<div style="height:10px"></div>'}
  </section>` : ''}

  ${duels(b)}

  <section class="card">
    <div class="card-head"><h2>Wie je er zag</h2></div>
    <div class="drie">
      <div><div class="row-label">Clubs</div><div class="row-value">${b.clubs.length}</div></div>
      <div><div class="row-label">Spelers</div><div class="row-value">${getal(b.spelers)}</div></div>
      <div><div class="row-label">Scheidsrechters</div><div class="row-value">${b.refs}</div></div>
    </div>
    ${ranglijst(b.clubs.slice(0, 4).map(([id, n]) => {
      const c = club(Number(id));
      return {name: esc(c.name), count: n, beeld: logo(c.crest, c.name, true)};
    }))}
  </section>

  <section class="card">
    <div class="card-head"><h2>Competities</h2></div>
    ${ranglijst(b.comps.slice(0, 4).map(([n, k]) => ({name: esc(comp(n)), count: k})))}
  </section>

  <section class="card">
    <div class="card-head"><h2>In je verzameling</h2></div>
    <div style="height:6px"></div>
    <div class="row"><div class="row-main">
      <div class="row-label">Vaakst bezocht</div>
      <div class="row-value">nr. ${b.rangBezoek} van je ${APP.venues.length} grounds</div>
    </div></div>
    ${b.rangPubliek ? `<div class="row"><div class="row-main">
      <div class="row-label">Grootste publiek</div>
      <div class="row-value">nr. ${b.rangPubliek} · ${getal(v.max_att)}</div>
    </div></div>` : ''}
    ${b.publiekBekend < b.ms.length ? `<div class="note">Publiekscijfer bekend bij
      ${b.publiekBekend} van de ${b.ms.length} duels hier.</div>` : ''}
  </section>`;

  const alle = document.getElementById('alle');
  if (alle) alle.addEventListener('click', () => {
    alle.insertAdjacentHTML('beforebegin', b.ms.slice(6).map(duelLink).join(''));
    alle.remove();
  });
}

if (window.APP && window.SPELERS){
  render();
  window.addEventListener('hashchange', () => { render(); app.scrollTop = 0; });
} else {
  app.innerHTML = zonderData('stadiondetail.html');
}
</script>
</body>
</html>
