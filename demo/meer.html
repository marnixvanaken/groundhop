<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#edeff2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<title>Meer — GroundHop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="groundhop.css">
<style>
/* Alleen wat dit scherm zelf nodig heeft; de rest staat in groundhop.css.

   Meer is de plek voor wat geen eigen tab verdient: toevoegen, de lijsten
   van clubs, competities en scheidsrechters, en waar de data vandaan komt. */
.icoon{width:30px; height:30px; border-radius:8px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--accent); color:var(--card);}
.icoon svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.4;
  stroke-linecap:round;}
</style>
</head>
<body>

<div class="bar"><h1 style="padding-left:8px">Meer</h1></div>

<main id="app"></main>

<nav class="tabbar" aria-label="Hoofdnavigatie"></nav>

<script src="app-data.js"></script>
<script src="groundhop.js"></script>
<script>
const app = document.getElementById('app');
tabbalk('meer');

const BRON = {transfermarkt: 'Transfermarkt', sofascore: 'Sofascore'};

function scheidsrechters(){
  const t = {};
  APP.matches.forEach(m => { if (m.ref) t[m.ref] = (t[m.ref] || 0) + 1; });
  return Object.entries(t).sort((a, b) => b[1] - a[1]);
}

function render(alleClubs){
  const clubs = alleClubs ? APP.clubs : APP.clubs.slice(0, 10);
  const refs = scheidsrechters();
  app.innerHTML = `
  <section class="card">
    <a class="lijst-rij" href="toevoegen.html">
      <span class="icoon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></span>
      <span class="lijst-main"><span class="lijst-naam">Wedstrijd toevoegen</span>
        <span class="lijst-sub">Zoek een club, kies de duels die je zag</span></span>
      <span class="chev" aria-hidden="true">›</span>
    </a>
  </section>

  <section class="card">
    <div class="card-head"><h2>Competities</h2><h2>${APP.comps.length}</h2></div>
    ${ranglijst(APP.comps.map(c => ({name: esc(comp(c.name)), count: c.count})))}
  </section>

  <section class="card" id="clubs">
    <div class="card-head"><h2>Clubs</h2><h2>${APP.clubs.length}</h2></div>
    ${ranglijst(clubs.map(c => ({name: esc(c.name), count: c.count, beeld: logo(c.crest, c.name, true)})))}
    ${alleClubs ? '' : `<button class="meer-knop" type="button" id="alle">Alle ${APP.clubs.length} clubs</button>`}
  </section>

  ${refs.length ? `
  <section class="card">
    <div class="card-head"><h2>Scheidsrechters</h2><h2>${refs.length}</h2></div>
    ${ranglijst(refs.slice(0, 5).map(([naam, n]) => ({name: esc(naam), count: n})))}
  </section>` : ''}

  <section class="card">
    <div class="card-head"><h2>Over de data</h2></div>
    <div style="height:6px"></div>
    <div class="row"><div class="row-main"><div class="row-label">Bron</div>
      <div class="row-value">${BRON[APP.source] || esc(APP.source)}</div></div></div>
    ${APP.generated ? `<div class="row"><div class="row-main"><div class="row-label">Bijgewerkt</div>
      <div class="row-value">${datum(APP.generated.slice(0, 10), true)}</div></div></div>` : ''}
    <div class="row"><div class="row-main"><div class="row-label">Periode</div>
      <div class="row-value">${datum(APP.totals.first)} — ${datum(APP.totals.last)}</div></div></div>
    <div class="note">Ontwerpdemo, gebouwd uit je eigen export met
      <code>demo/build_app_data.py</code>. Er wordt niets opgeslagen.</div>
  </section>`;
  const alle = document.getElementById('alle');
  if (alle) alle.addEventListener('click', () => {
    const y = app.scrollTop; render(true); app.scrollTop = y;
  });
}

if (window.APP) render(false);
else app.innerHTML = zonderData('meer.html');
</script>
</body>
</html>
