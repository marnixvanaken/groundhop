<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#edeff2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<title>Wedstrijddetail — GroundHop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="groundhop.css">
<style>
/* Alleen wat dit scherm zelf nodig heeft; de rest staat in groundhop.css. */
.score > *, .goal > *, .player > *{min-width:0;}
.scorer,.pname,.side-name{overflow-wrap:break-word;}

/* ── Scorebord ─────────────────────────────────────────────────────────── */
.score-meta{padding:16px 16px 0; text-align:center;}
.comp-regel{display:flex; align-items:center; justify-content:center; gap:7px;}
.comp{font-size:12px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--content-2);}
.date{font-size:13px; color:var(--content-2); margin-top:2px;}
.score{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  gap:8px; padding:14px 16px 4px;
}
.side{display:flex; flex-direction:column; align-items:center; gap:8px;}
.side-name{font-size:13px; font-weight:600; text-align:center; line-height:1.25;}
.result{
  font-family:var(--display); font-variant-numeric:tabular-nums;
  font-size:40px; font-weight:700; letter-spacing:-0.02em; line-height:1;
  white-space:nowrap;
}
.half{text-align:center; font-size:12px; color:var(--content-2); padding-bottom:14px;}

/* ── Goals: één chronologische lijst, zoals je ze zag vallen ───────────── */
.goals{padding:10px 0 4px;}
.goal{
  display:grid; grid-template-columns:44px 1fr 22px;
  gap:10px; align-items:start;
  padding:9px 16px;
}
.goal + .goal{border-top:0.5px solid var(--separator);}
.minute{
  font-family:var(--display); font-variant-numeric:tabular-nums;
  font-size:15px; font-weight:600; color:var(--content-2);
  padding-top:1px; text-align:right;
}
.scorer{font-size:15px; font-weight:600;}
.assist{font-size:13px; color:var(--content-2); margin-top:1px;}
.kind{
  display:inline-block; margin-left:6px; padding:1px 6px; border-radius:6px;
  background:var(--card-sunken); color:var(--content-2);
  font-size:11px; font-weight:600; letter-spacing:0.02em;
  vertical-align:1px;
}
.goal .crest-mini{margin-top:1px;}

/* ── Opstelling ────────────────────────────────────────────────────────── */
.player{
  display:grid; grid-template-columns:16px 34px 1fr auto auto;
  gap:8px; align-items:center;
  padding:9px 16px; min-height:44px;
}
.player + .player{border-top:0.5px solid var(--separator);}
.pos{font-size:11px; font-weight:700; color:var(--content-2); font-family:var(--display);}
.pname{font-size:15px; font-weight:500;}
.pmeta{font-size:12px; color:var(--content-2); margin-top:1px;}
.seen{
  font-family:var(--display); font-variant-numeric:tabular-nums;
  font-size:13px; font-weight:600; color:var(--accent);
  background:var(--accent-soft); border-radius:7px; padding:3px 7px;
}
/* De rating gaat over de wedstrijd, niet over jou, dus geen groen. */
.rating{
  font-family:var(--display); font-variant-numeric:tabular-nums;
  font-size:13px; font-weight:700; color:var(--content);
  background:var(--card-sunken);
  border-radius:7px; padding:3px 7px; min-width:38px; text-align:center;
}
.rating.leeg{color:var(--content-2); font-weight:600;}
</style>
</head>
<body>

<div class="bar">
  <button class="back" aria-label="Terug naar Duels">
    <svg width="11" height="18" viewBox="0 0 11 18" fill="none" aria-hidden="true">
      <path d="M9.5 1.5 2 9l7.5 7.5" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Duels
  </button>
  <h1>Wedstrijd</h1>
</div>

<main id="app"></main>

<nav class="tabbar" aria-label="Hoofdnavigatie">
  <a href="#"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>Home</a>
  <a href="wedstrijddetail.html" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>Duels</a>
  <a href="stadiondetail.html"><svg viewBox="0 0 24 24"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Grounds</a>
  <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>Spelers</a>
  <a href="#"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Meer</a>
</nav>

<script src="groundhop.js"></script>
<script src="match-data.js"></script>
<script>
const M = window.MATCH;
const app = document.getElementById('app');


// De bron levert landnamen in het Engels; de rest van het scherm is Nederlands.
// Dit dekt alle 22 landen die in de scheidsrechterslijst voorkomen.
const LAND = {
  Netherlands:'Nederland', Spain:'Spanje', Germany:'Duitsland', England:'Engeland',
  Italy:'Italië', Belgium:'België', Russia:'Rusland', Sweden:'Zweden',
  Slovenia:'Slovenië', Romania:'Roemenië', Brazil:'Brazilië', Portugal:'Portugal',
  Switzerland:'Zwitserland', Serbia:'Servië', Poland:'Polen', 'Türkiye':'Turkije',
  Scotland:'Schotland', Bulgaria:'Bulgarije', France:'Frankrijk',
  Slovakia:'Slowakije', Belarus:'Belarus',
};
function land(naam){ return LAND[naam] || naam; }
function minuut(g){ return g.minute + (g.added_time ? '+' + g.added_time : '') + "'"; }

// De logo's staan naast deze pagina in crests/, gekopieerd uit img/team/.
const CREST = {};
const clublogo = (naam, mini) => logo(CREST[naam], naam, mini);

function render(){
  const c = M.context;
  CREST[M.home.name] = M.home.crest;
  CREST[M.away.name] = M.away.crest;
  const comp = M.tournament.replace('VriendenLoterij ','').replace('Eurojackpot ','');
  const rondeTekst = M.round ? ` · Ronde ${M.round}` : '';

  // ── Scorebord met de tellers eronder ───────────────────────────────────
  let html = `
  <section class="card">
    <div class="score-meta">
      <div class="comp-regel">${compLogo(M.tournament_logo)}<span class="comp">${comp}${rondeTekst}</span></div>
      <div class="date">${datum(M.date)}</div>
    </div>
    <div class="score">
      <div class="side">
        ${clublogo(M.home.name)}
        <div class="side-name">${M.home.name}</div>
      </div>
      <div class="result">${M.home.score} – ${M.away.score}</div>
      <div class="side">
        ${clublogo(M.away.name)}
        <div class="side-name">${M.away.name}</div>
      </div>
    </div>
    ${M.half_time ? `<div class="half">rust ${M.half_time.home}–${M.half_time.away}</div>` : ''}
    <div class="tally">
      <div>
        <b class="num">${c.venue_visit}<sup>e</sup></b>
        <span>bezoek<br>${M.venue.name}</span>
      </div>
      <div>
        <b class="num">${c.club_match}<sup>e</sup></b>
        <span>duel van<br>${M.home.name.replace(' Eindhoven','')}</span>
      </div>
      <div>
        <b class="num">${c.tournament_match}<sup>e</sup></b>
        <span>duel in<br>${comp}</span>
      </div>
    </div>
  </section>`;

  // ── Goals, chronologisch ───────────────────────────────────────────────
  html += `
  <section class="card">
    <div class="card-head"><h2>Goals</h2><h2>${M.goals.length}</h2></div>
    <div class="goals">
      ${M.goals.map(g => {
        const soort = g.type === 'penalty' ? '<span class="kind">pen</span>'
                    : g.type === 'ownGoal' ? '<span class="kind">eigen goal</span>' : '';
        return `<div class="goal">
          <div class="minute num">${minuut(g)}</div>
          <div>
            <div class="scorer">${g.player}${soort}</div>
            ${g.assist ? `<div class="assist">assist ${g.assist}</div>` : ''}
          </div>
          ${clublogo(g.team, true)}
        </div>`;
      }).join('')}
    </div>
  </section>`;

  // ── Opstelling ─────────────────────────────────────────────────────────
  const ploegen = Object.keys(M.lineup);
  html += `
  <section class="card">
    <div class="card-head"><h2>Opstelling</h2></div>
    <div class="seg" role="group" aria-label="Kies ploeg">
      ${ploegen.map((t,i) => `<button data-team="${t}" aria-pressed="${i===0}">${t}</button>`).join('')}
    </div>
    <div id="lineup"></div>
  </section>`;

  // ── Wedstrijdinfo ──────────────────────────────────────────────────────
  html += `
  <section class="card">
    <div class="card-head"><h2>Wedstrijd</h2></div>
    <div style="height:6px"></div>
    <a class="row" href="stadiondetail.html">
      <div class="row-main">
        <div class="row-label">Stadion</div>
        <div class="row-value">${M.venue.name}, ${M.venue.city}</div>
      </div>
      <div class="chev" aria-hidden="true">›</div>
    </a>
    <div class="row">
      <div class="row-main">
        <div class="row-label">Scheidsrechter</div>
        <div class="row-value">${M.referee.name}${M.referee.country ? ' · ' + land(M.referee.country) : ''}</div>
      </div>
    </div>
    <div class="row">
      <div class="row-main">
        <div class="row-label">Toeschouwers</div>
        <div class="row-value">${getal(M.attendance)}</div>
      </div>
    </div>
    <div class="note">
      Je ${c.match_nr}<sup>e</sup> wedstrijd van ${c.total_matches}.
      ${M.venue.name} bezocht je voor het eerst op ${datum(c.venue_first)}.
    </div>
  </section>`;

  app.innerHTML = html;

  document.querySelectorAll('.seg button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.seg button')
        .forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      toonPloeg(b.dataset.team);
    });
  });
  toonPloeg(ploegen[0]);
}

function toonPloeg(team){
  const spelers = M.lineup[team];
  const basis = spelers.filter(p => p.starter);
  const rest  = spelers.filter(p => !p.starter);
  const blok = (label, lijst) => !lijst.length ? '' :
    `<div class="group-label">${label}</div>` + lijst.map(p => `
      <div class="player">
        <div class="pos">${p.position || '·'}</div>
        ${portret(p.photo, p.name)}
        <div>
          <div class="pname">${p.name}</div>
          <div class="pmeta"><span class="vlag">${vlag(p.country)}</span> ${
            p.minutes != null ? p.minutes + ' min' : '—'}${
            p.goals ? ` · ${p.goals} goal${p.goals > 1 ? 's' : ''}` : ''}${
            p.assists ? ` · ${p.assists} assist${p.assists > 1 ? 's' : ''}` : ''}</div>
        </div>
        <div class="seen num" title="Zo vaak zag je deze speler">${p.seen}×</div>
        ${p.rating
          ? `<div class="rating num">${p.rating.toFixed(1)}</div>`
          : `<div class="rating num leeg">—</div>`}
      </div>`).join('');
  document.getElementById('lineup').innerHTML =
    blok('Basis', basis) + blok('Ingevallen en bank', rest);
}

if (M) {
  render();
} else {
  app.innerHTML = '<div class="card"><div class="note">Geen wedstrijddata gevonden. '
    + 'Draai <code>python3 demo/build_demo_data.py</code> en open deze pagina via '
    + '<code>python3 server.py</code> op localhost:4000/demo/wedstrijddetail.html</div></div>';
}
</script>
</body>
</html>
