<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#edeff2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="GroundHop">
<title>Wedstrijd — GroundHop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="groundhop.css">
<style>
/* Alleen wat dit scherm zelf nodig heeft; de rest staat in groundhop.css. */
.score > *, .goal > *, .player > *{min-width:0;}
.scorer,.pname,.side-name{overflow-wrap:break-word;}

/* ── Scorebord ─────────────────────────────────────────────────────────── */
.score-meta{padding:16px 16px 0; text-align:center;}
.comp-regel{display:flex; align-items:center; justify-content:center; gap:7px;}
.comp{font-size:12px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--content-2);}
.date{font-size:13px; color:var(--content-2); margin-top:2px;}
.score{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  gap:8px; padding:14px 16px 4px;
}
.side{display:flex; flex-direction:column; align-items:center; gap:8px;}
.side,.comp-regel{color:inherit; text-decoration:none;}
.side-name{font-size:13px; font-weight:600; text-align:center; line-height:1.25;}
.result{
  font-family:var(--display); font-variant-numeric:tabular-nums;
  font-size:40px; font-weight:700; letter-spacing:-0.02em; line-height:1;
  white-space:nowrap;
}
.half{text-align:center; font-size:12px; color:var(--content-2); padding-bottom:14px;}

/* ── Goals: één chronologische lijst, zoals je ze zag vallen ───────────── */
.goals{padding:10px 0 4px;}
.goal{
  display:grid; grid-template-columns:44px 1fr 22px;
  gap:10px; align-items:start;
  padding:9px 16px;
}
.goal + .goal{border-top:0.5px solid var(--separator);}
.minute{
  font-family:var(--display); font-variant-numeric:tabular-nums;
  font-size:15px; font-weight:600; color:var(--content-2);
  padding-top:1px; text-align:right;
}
.scorer{font-size:15px; font-weight:600;}
.assist{font-size:13px; color:var(--content-2); margin-top:1px;}
.kind{
  display:inline-block; margin-left:6px; padding:1px 6px; border-radius:6px;
  background:var(--card-sunken); color:var(--content-2);
  font-size:11px; font-weight:600; letter-spacing:0.02em;
  vertical-align:1px;
}
.goal .crest-mini{margin-top:1px;}

/* ── Opstelling ────────────────────────────────────────────────────────── */
.player{
  display:grid; grid-template-columns:16px 34px 1fr auto auto;
  gap:8px; align-items:center;
  padding:9px 16px; min-height:44px;
}
.player + .player{border-top:0.5px solid var(--separator);}
.pos{font-size:11px; font-weight:700; color:var(--content-2); font-family:var(--display);}
.pname{font-size:15px; font-weight:500;}
.pmeta{font-size:12px; color:var(--content-2); margin-top:1px;}
.seen{
  font-family:var(--display); font-variant-numeric:tabular-nums;
  font-size:13px; font-weight:600; color:var(--accent);
  background:var(--accent-soft); border-radius:7px; padding:3px 7px;
}
/* De rating gaat over de wedstrijd, niet over jou, dus geen groen. */
.rating{
  font-family:var(--display); font-variant-numeric:tabular-nums;
  font-size:13px; font-weight:700; color:var(--content);
  background:var(--card-sunken);
  border-radius:7px; padding:3px 7px; min-width:38px; text-align:center;
}
.rating.leeg{color:var(--content-2); font-weight:600;}
.zonder-rating .player{grid-template-columns:16px 34px 1fr auto;}
.player{color:inherit; text-decoration:none;}
.goal{color:inherit;}
.buren{display:grid; grid-template-columns:1fr 1fr;}
.buren a{display:block; padding:12px 16px; color:inherit; text-decoration:none; min-width:0;}
.buren a + a{border-left:0.5px solid var(--separator); text-align:right;}
.buren .row-label{margin-bottom:1px;}
.buren .row-value{font-size:14px;}

/* ── Verwijderen ───────────────────────────────────────────────────────────
   Alleen op de laptop, waar server.py de selectie beheert. Rood, en altijd
   met een tweede tik: het duel verdwijnt uit elke telling. Gaat het blok
   open, dan schuift het helemaal in beeld, boven de tabbalk uit. */
#beheer{scroll-margin-bottom:calc(var(--tab-h) + 16px);}
.weg-knop{width:100%; justify-content:center; border:0; background:none; cursor:pointer;
  font:inherit; font-size:15px; font-weight:500; color:var(--destructive);}
.weg{padding:14px 16px; font-size:13px; color:var(--content-2);}
.weg b{color:var(--content); font-weight:600;}
.weg a{color:var(--accent);}
.weg-rij{display:flex; gap:8px; margin-top:12px;}
.knop{flex:1; height:40px; padding:0 16px; border:0; border-radius:11px; cursor:pointer;
  background:var(--card-sunken); color:var(--content); font:inherit; font-size:15px; font-weight:600;}
.knop.rood{background:var(--destructive); color:var(--card);}
.knop:disabled{opacity:.5;}
</style>
</head>
<body>

<div class="bar" id="bar"></div>

<main id="app"></main>

<nav class="tabbar" aria-label="Hoofdnavigatie"></nav>

<script src="app-data.js"></script>
<script src="speler-data.js"></script>
<script src="groundhop.js"></script>
<script>
const app = document.getElementById('app');
tabbalk('duels');
document.getElementById('bar').innerHTML = terugknop('Duels', 'duels.html') + '<h1>Wedstrijd</h1>';

// De bron levert landnamen in het Engels; de rest van het scherm is Nederlands.
const LAND = {
  Netherlands:'Nederland', Spain:'Spanje', Germany:'Duitsland', England:'Engeland',
  Italy:'Italië', Belgium:'België', Russia:'Rusland', Sweden:'Zweden',
  Slovenia:'Slovenië', Romania:'Roemenië', Brazil:'Brazilië', Portugal:'Portugal',
  Switzerland:'Zwitserland', Serbia:'Servië', Poland:'Polen', 'Türkiye':'Turkije',
  Scotland:'Schotland', Bulgaria:'Bulgarije', France:'Frankrijk',
  Slovakia:'Slowakije', Belarus:'Belarus', Denmark:'Denemarken', Norway:'Noorwegen',
  Austria:'Oostenrijk', Croatia:'Kroatië', Greece:'Griekenland', Ukraine:'Oekraïne',
};
const land = naam => LAND[naam] || naam;
const minuut = g => g.min + (g.add ? '+' + g.add : '') + "'";

/* Hoeveelste keer iets voorkomt, chronologisch geteld tot en met deze
   wedstrijd. Dat is wat deze app kan en een uitslagensite niet. De sleutel
   geeft voor deze wedstrijd iets terug; elke eerdere met dezelfde waarde telt. */
function hoeveelste(m, sleutel){
  const k = sleutel(m);
  return APP.matches.filter(x => x.date <= m.date && sleutel(x) === k).length;
}

/* De opstelling komt vanaf de spelerskant: elke speler weet in welke
   wedstrijden hij stond, met minuten en goals. */
function opstelling(m){
  const teams = {};
  for (const [id, p] of Object.entries(SPELERS)){
    const r = p.m.find(x => x[0] === m.id);
    if (!r) continue;
    (teams[r[1]] ||= []).push({
      id, name: p.s, position: p.pos, country: p.c, photo: p.img, seen: p.seen,
      minutes: r[2], goals: r[3], assists: r[4], starter: !!r[5], rating: r[6],
    });
  }
  const orde = {G: 0, D: 1, M: 2, F: 3};
  Object.values(teams).forEach(t => t.sort((a, b) =>
    (b.starter - a.starter) || ((orde[a.position] ?? 4) - (orde[b.position] ?? 4))
    || ((b.minutes || 0) - (a.minutes || 0))));
  return teams;
}

let LINEUP = {};
const huidig = () => wedstrijd(Number(param('id'))) || APP.matches[0];

function render(){
  const m = huidig();
  const h = club(m.hid), a = club(m.aid);
  const v = m.venue ? stadion(m.venue) : null;
  const naamComp = comp(m.t);

  const ctx = {
    venue: m.venue ? hoeveelste(m, x => x.venue) : null,
    club: hoeveelste(m, x => x.hid === m.hid || x.aid === m.hid),
    comp: hoeveelste(m, x => x.t),
    nr: hoeveelste(m, () => true),
  };

  const tellers = [
    ctx.venue ? [ctx.venue, `bezoek<br>${esc(v ? v.name : m.venue)}`] : null,
    [ctx.club, `duel van<br>${esc(h.name)}`],
    [ctx.comp, `duel in<br>${esc(naamComp)}`],
  ].filter(Boolean);

  let html = `
  <section class="card">
    <div class="score-meta">
      <a class="comp-regel" href="${compHref(m.t)}"><span class="comp">${esc(naamComp)}${m.round ? ` · Ronde ${m.round}` : ''}</span></a>
      <div class="date">${datum(m.date, true)}</div>
    </div>
    <div class="score">
      <a class="side" href="${clubHref(h.id)}">${logo(h.crest, h.name)}<div class="side-name">${esc(h.name)}</div></a>
      <div class="result">${m.hs ?? '–'} – ${m.as ?? '–'}</div>
      <a class="side" href="${clubHref(a.id)}">${logo(a.crest, a.name)}<div class="side-name">${esc(a.name)}</div></a>
    </div>
    ${m.ht ? `<div class="half">rust ${m.ht[0]}–${m.ht[1]}</div>` : '<div style="height:14px"></div>'}
    <div class="tally" style="grid-template-columns:repeat(${tellers.length},1fr)">
      ${tellers.map(([n, t]) => `<div><b class="num">${n}<sup>e</sup></b><span>${t}</span></div>`).join('')}
    </div>
  </section>`;

  if (m.goals.length){
    html += `
    <section class="card">
      <div class="card-head"><h2>Goals</h2><h2>${m.goals.length}</h2></div>
      <div class="goals">
        ${m.goals.map(g => {
          const soort = g.type === 'penalty' ? '<span class="kind">pen</span>'
                      // Sofascore: 'ownGoal', Transfermarkt: 'own'.
                      : g.type === 'ownGoal' || g.type === 'own' ? '<span class="kind">eigen goal</span>' : '';
          const ploeg = g.team === h.name ? h : g.team === a.name ? a : {name: g.team || '?'};
          return `<div class="goal">
            <div class="minute num">${minuut(g)}</div>
            <div>
              <div class="scorer">${g.pid && SPELERS[g.pid]
                ? `<a href="${spelerHref(g.pid)}" style="color:inherit;text-decoration:none">${esc(g.p)}</a>`
                : esc(g.p)}${soort}</div>
              ${g.a ? `<div class="assist">assist ${esc(g.a)}</div>` : ''}
            </div>
            ${logo(ploeg.crest, ploeg.name, true)}
          </div>`;
        }).join('')}
      </div>
    </section>`;
  }

  LINEUP = opstelling(m);
  const ploegen = [h.name, a.name].filter(n => LINEUP[n])
    .concat(Object.keys(LINEUP).filter(n => n !== h.name && n !== a.name));
  if (ploegen.length){
    html += `
    <section class="card">
      <div class="card-head"><h2>Opstelling</h2></div>
      <div class="seg" role="group" aria-label="Kies ploeg">
        ${ploegen.map((t, i) => `<button type="button" data-team="${esc(t)}" aria-pressed="${i === 0}">${esc(t)}</button>`).join('')}
      </div>
      <div id="lineup"></div>
    </section>`;
  }

  html += `
  <section class="card">
    <div class="card-head"><h2>Wedstrijd</h2></div>
    <div style="height:6px"></div>
    ${m.venue ? `
    <a class="row" href="${stadionHref(m.venue)}">
      <div class="row-main">
        <div class="row-label">Stadion</div>
        <div class="row-value">${esc(v ? v.name : m.venue)}${v && v.city ? ', ' + esc(v.city) : ''}</div>
      </div>
      <div class="chev" aria-hidden="true">›</div>
    </a>` : ''}
    ${m.ref ? `
    <div class="row">
      <div class="row-main">
        <div class="row-label">Scheidsrechter</div>
        <div class="row-value">${esc(m.ref)}${m.refc ? ' · ' + land(m.refc) : ''}</div>
      </div>
    </div>` : ''}
    ${m.att ? `
    <div class="row">
      <div class="row-main">
        <div class="row-label">Toeschouwers</div>
        <div class="row-value">${getal(m.att)}</div>
      </div>
    </div>` : ''}
    <div class="note">
      Je ${ctx.nr}<sup>e</sup> wedstrijd van ${APP.totals.matches}.
      ${v && v.first ? `${esc(v.name)} bezocht je voor het eerst op ${datum(v.first, true)}.` : ''}
    </div>
  </section>`;

  // Vorige en volgende in je eigen reeks, zodat je door je duels kunt bladeren.
  const i = APP.matches.indexOf(m);
  const eerder = APP.matches[i + 1], later = APP.matches[i - 1];
  const buur = (x, label) => x ? `
    <a href="${wedstrijdHref(x.id)}">
      <div class="row-label">${label}</div>
      <div class="row-value">${esc(club(x.hid).name)} – ${esc(club(x.aid).name)}</div>
      <div class="row-label">${datum(x.date)}</div>
    </a>` : '<span></span>';
  if (eerder || later){
    html += `<section class="card buren">${buur(eerder, '‹ Eerder')}${buur(later, 'Later ›')}</section>`;
  }
  html += '<section class="card" id="beheer" hidden></section>';

  app.innerHTML = html;
  toonBeheer(m);
  app.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    app.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    toonPloeg(b.dataset.team);
  }));
  if (ploegen.length) toonPloeg(ploegen[0]);
}

function toonPloeg(team){
  const spelers = LINEUP[team] || [];
  // Transfermarkt kent geen cijfers per speler. Een kolom met alleen streepjes
  // is erger dan geen kolom, dus hij verschijnt alleen als er iets in staat.
  const metRating = spelers.some(p => p.rating != null);
  const doel = document.getElementById('lineup');
  doel.classList.toggle('zonder-rating', !metRating);
  const blok = (label, lijst) => !lijst.length ? '' :
    `<div class="group-label">${label}</div>` + lijst.map(p => `
      <a class="player" href="${spelerHref(p.id)}">
        <div class="pos">${p.position || '·'}</div>
        ${portret(p.photo, p.name)}
        <div>
          <div class="pname">${esc(p.name)}</div>
          <div class="pmeta"><span class="vlag">${vlag(p.country)}</span> ${
            p.minutes != null ? p.minutes + ' min' : '—'}${
            p.goals ? ` · ${p.goals} goal${p.goals > 1 ? 's' : ''}` : ''}${
            p.assists ? ` · ${p.assists} assist${p.assists > 1 ? 's' : ''}` : ''}</div>
        </div>
        <div class="seen num" title="Zo vaak zag je deze speler">${p.seen}×</div>
        ${!metRating ? '' : p.rating
          ? `<div class="rating num">${p.rating.toFixed(1)}</div>`
          : `<div class="rating num leeg">—</div>`}
      </a>`).join('');
  doel.innerHTML = blok('Basis', spelers.filter(p => p.starter))
                 + blok('Ingevallen en bank', spelers.filter(p => !p.starter));
}

/* ── Verwijderen ─────────────────────────────────────────────────────────
   Alleen met server.py en Transfermarkt als bron: die houdt de selectie bij.
   De live site heeft geen /api/bron, en dan blijft de kaart weg. Na het
   verwijderen haalt de server alles opnieuw door de keten en zet het live. */
let BEHEER = false;
let WEG = {id: null, fase: 'rust', tekst: ''};

async function api(pad, opties){
  try { const r = await fetch(pad, opties); return r.ok ? await r.json() : null; }
  catch { return null; }
}

const duelNaam = m => `${esc(club(m.hid).name)} – ${esc(club(m.aid).name)}`;

function toonBeheer(m){
  const kaart = document.getElementById('beheer');
  if (!kaart) return;
  kaart.hidden = !BEHEER;
  if (!BEHEER) return;
  if (WEG.id !== m.id) WEG = {id: m.id, fase: 'rust', tekst: ''};
  const bezig = WEG.fase === 'bezig' ? ' disabled' : '';
  kaart.innerHTML = WEG.fase === 'rust'
    ? '<button class="row weg-knop" type="button" data-weg="vraag">Verwijderen uit je verzameling</button>'
    : WEG.fase === 'klaar' ? `<div class="weg" role="status">${WEG.tekst}</div>`
    : `<div class="weg">
        Niet bij geweest? Dan verdwijnt <b>${duelNaam(m)}</b> uit je duels, spelers en grounds.
        Later toevoegen kan altijd weer.
        ${WEG.tekst ? `<div role="alert" style="margin-top:8px;color:var(--destructive)">${esc(WEG.tekst)}</div>` : ''}
        <div class="weg-rij">
          <button class="knop" type="button" data-weg="rust"${bezig}>Annuleer</button>
          <button class="knop rood" type="button" data-weg="ja"${bezig}>${bezig ? 'Verwijderen…' : 'Verwijder'}</button>
        </div>
      </div>`;
}

/* Wacht tot de server klaar is met ophalen en live zetten. */
async function naSync(){
  const s = await api('/api/sync-status');
  if (s?.running){ await new Promise(r => setTimeout(r, 3000)); return naSync(); }
  if (s?.error) return `Bijwerken stopte: ${esc(s.error)}`;
  if (s?.live?.ok) return 'Klaar, en live gezet. De site is over een minuut bijgewerkt.';
  if (s?.live?.gekoppeld) return `Klaar, maar live zetten lukte niet: ${esc(s.live.fout)}`;
  return 'Klaar. Koppel GitHub in Meer om het ook live te zetten.';
}

app.addEventListener('click', async e => {
  const knop = e.target.closest('[data-weg]');
  if (!knop) return;
  const m = wedstrijd(WEG.id), w = WEG;
  if (knop.dataset.weg !== 'ja'){
    w.fase = knop.dataset.weg; w.tekst = ''; toonBeheer(m);
    if (w.fase === 'vraag') document.getElementById('beheer').scrollIntoView({block: 'nearest', behavior: 'smooth'});
    return;
  }
  w.fase = 'bezig'; toonBeheer(m);
  const res = await api('/api/tm/verwijderen', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify([{match_id: m.id}]),
  });
  if (WEG !== w) return;          // intussen naar een ander duel gebladerd
  if (!res || res.error){
    w.fase = 'vraag';
    w.tekst = res?.error || 'Verwijderen is niet gelukt. Draait server.py nog?';
    toonBeheer(m);
    return;
  }
  const kop = `<b>${duelNaam(m)}</b> is uit je verzameling.`;
  w.fase = 'klaar';
  w.tekst = res.removed ? `${kop} Spelers, grounds en tellers worden nu bijgewerkt…`
                        : 'Dit duel stond al niet meer in je selectie.';
  toonBeheer(m);
  if (!res.fetching) return;
  const klaar = await naSync();
  if (WEG !== w) return;
  w.tekst = `${kop} ${klaar} <a href="duels.html">Naar je duels</a>`;
  toonBeheer(m);
});

if (window.APP && window.SPELERS){
  render();
  window.addEventListener('hashchange', () => { render(); app.scrollTop = 0; });
  api('/api/bron').then(b => {
    BEHEER = b?.bron === 'transfermarkt';
    if (BEHEER) toonBeheer(huidig());
  });
} else {
  app.innerHTML = zonderData('wedstrijddetail.html');
}
</script>
</body>
</html>
