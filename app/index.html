<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#edeff2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="GroundHop">
<title>GroundHop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="groundhop.css">
<style>
/* Alleen wat dit scherm zelf nodig heeft; de rest staat in groundhop.css.

   Home is een samenvatting van jouw verzameling, niet van het voetbal. Alle
   getallen hier gaan over wat jij zag, en zijn dus groen. */

.merk{font-family:var(--display); font-size:20px; font-weight:800; letter-spacing:-0.02em;
  padding-left:8px;}
.merk span{color:var(--accent);}

.sinds{font-size:12px; color:var(--content-2);}
.tally + .tally{border-top:0.5px solid var(--separator);}

/* Het laatste duel groot: dit is wat je het vaakst terug wilt zien. */
.laatste{display:block; padding:14px 16px 16px; color:inherit; text-decoration:none;}
.laatste-crests{display:flex; align-items:center; gap:10px; margin:8px 0 10px;}
.laatste-crests .result{font-family:var(--display); font-variant-numeric:tabular-nums;
  font-size:34px; font-weight:700; letter-spacing:-0.02em; margin-left:auto;}
.laatste .teams{font-size:17px; font-weight:600; line-height:1.25;}
.laatste .duel-meta{margin-top:3px;}
.context{padding:10px 16px 14px; border-top:0.5px solid var(--separator);
  font-size:13px; color:var(--content-2);}
.context b{color:var(--accent); font-family:var(--display); font-variant-numeric:tabular-nums;}

.record{display:flex; align-items:center; gap:12px; padding:10px 16px; min-height:52px;
  color:inherit; text-decoration:none;}
.record + .record{border-top:0.5px solid var(--separator);}
.record-waarde{font-family:var(--display); font-variant-numeric:tabular-nums;
  font-size:20px; font-weight:700; min-width:56px;}

/* ── Intro na een lange afwezigheid ──────────────────────────────────────
   Het veld tekent zich in het groen, een bal hopt in drie sprongen naar de
   middenstip, en het logo landt erbij: Ground komt op, Hop hopt. Het veld is
   240 × 150 en de bal rust op de middenstip (120, 75). */
.intro{position:fixed; inset:0; z-index:50; background:var(--surface);
  display:flex; align-items:center; justify-content:center; padding-bottom:8vh;
  transition:opacity .45s ease;}
.intro.weg{opacity:0; pointer-events:none;}
.intro-inhoud{display:flex; flex-direction:column; align-items:center; gap:24px;
  transition:transform .45s ease;}
.intro.weg .intro-inhoud{transform:scale(1.04);}
.veld{position:relative; width:240px; height:150px;}
.lijnen{display:block; width:100%; height:100%; overflow:visible;
  fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round;}
/* pathLength="1" op elke lijn: een streep van 1 met een gat van 2 erachter,
   0,05 voorbij het begin, dekt de hele lijn af zonder een rond puntje te
   laten staan. */
.lijnen path{stroke-dasharray:1 2; stroke-dashoffset:1.05;
  animation:teken .8s cubic-bezier(.45,0,.2,1) forwards;}
@keyframes teken{to{stroke-dashoffset:0;}}

.bal-x{position:absolute; left:111px; top:66px; width:18px; height:18px;
  animation:bal-x 1.2s linear .35s both, verschijn .15s ease .35s both;}
@keyframes bal-x{from{transform:translateX(-96px);} to{transform:none;}}
@keyframes verschijn{from{opacity:0;}}
/* Drie sprongen, elke lager en korter, zoals een bal die uitstuitert:
   omhoog vertraagt hij, omlaag versnelt hij. */
.bal-y{animation:bal-y 1.2s .35s both;}
@keyframes bal-y{
  0%   {transform:translateY(0);     animation-timing-function:cubic-bezier(.33,.66,.66,1);}
  22.5%{transform:translateY(-34px); animation-timing-function:cubic-bezier(.33,0,.66,.33);}
  45%  {transform:translateY(0);     animation-timing-function:cubic-bezier(.33,.66,.66,1);}
  61.5%{transform:translateY(-18px); animation-timing-function:cubic-bezier(.33,0,.66,.33);}
  78%  {transform:translateY(0);     animation-timing-function:cubic-bezier(.33,.66,.66,1);}
  89%  {transform:translateY(-8px);  animation-timing-function:cubic-bezier(.33,0,.66,.33);}
  100% {transform:translateY(0);}
}
.schaduw{position:absolute; left:2px; top:15px; width:14px; height:5px; border-radius:50%;
  background:var(--content); opacity:.2; animation:schaduw 1.2s .35s both;}
@keyframes schaduw{
  0%,45%,78%,100%{transform:scale(1);   opacity:.2;}
  22.5%          {transform:scale(.55); opacity:.08;}
  61.5%          {transform:scale(.7);  opacity:.12;}
  89%            {transform:scale(.85); opacity:.16;}
}
/* Een bal is een ding, geen interface: wit met zwart, in beide standen. */
.bal{display:block; width:18px; height:18px; transform-origin:50% 100%;
  animation:plof .35s ease-out 1.55s;}
.bal circle{fill:#fff; stroke:#14171a; stroke-width:1.4;}
.bal path{fill:none; stroke:#14171a; stroke-width:1.2; stroke-linejoin:round;}
.bal path:first-of-type{fill:#14171a;}
@keyframes plof{from{transform:scale(1.2,.8);}}
.golf{position:absolute; left:98px; top:53px; width:44px; height:44px; border-radius:50%;
  border:2.5px solid var(--accent); opacity:0; animation:golf .7s ease-out 1.55s;}
@keyframes golf{from{opacity:.7; transform:scale(1);} to{opacity:0; transform:scale(2.6);}}

.intro-merk{font-family:var(--display); font-size:36px; font-weight:800;
  letter-spacing:-0.02em; line-height:1;}
.intro-merk span,.intro-merk b{display:inline-block; font-weight:inherit;}
.intro-merk span{color:var(--accent); animation:opkomen .5s cubic-bezier(.2,.8,.2,1) 1.45s both;}
.intro-merk b{animation:hop .6s 1.7s both;}
@keyframes hop{
  0%  {opacity:0; transform:translateY(-22px); animation-timing-function:cubic-bezier(.33,0,.66,.33);}
  45% {opacity:1; transform:none;              animation-timing-function:cubic-bezier(.33,.66,.66,1);}
  70% {transform:translateY(-7px);             animation-timing-function:cubic-bezier(.33,0,.66,.33);}
  100%{transform:none;}
}
.intro-sub{margin-top:-10px; font-size:13px; color:var(--content-2);
  animation:opkomen .5s ease 2s both;}
@keyframes opkomen{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}

/* Daarna komen de kaarten een voor een op. */
main.binnen > *{animation:opkomen .55s cubic-bezier(.2,.8,.2,1) both;
  animation-delay:calc(var(--i) * 70ms);}
</style>
</head>
<body>

<div class="bar">
  <h1 class="merk"><span>Ground</span>Hop</h1>
  <a class="back bar-actie" href="toevoegen.html" aria-label="Wedstrijd toevoegen">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
  </a>
</div>

<main id="app"></main>

<nav class="tabbar" aria-label="Hoofdnavigatie"></nav>

<script src="app-data.js"></script>
<script src="speler-data.js"></script>
<script src="groundhop.js"></script>
<script>
const app = document.getElementById('app');
tabbalk('home');

function verzameling(){
  const t = APP.totals;
  const [j, m] = t.first.split('-');
  return `
  <section class="card">
    <div class="card-head"><h2>Jouw verzameling</h2>
      <span class="sinds">sinds ${KORT[+m - 1]} ${j}</span></div>
    <div style="height:10px"></div>
    <div class="tally">
      <div><b class="num" data-tel="${t.matches}">${getal(t.matches)}</b><span>duels</span></div>
      <div><b class="num" data-tel="${t.venues}">${getal(t.venues)}</b><span>grounds</span></div>
      <div><b class="num" data-tel="${t.goals}">${getal(t.goals)}</b><span>goals gezien</span></div>
    </div>
    <div class="tally">
      <div><b class="num" data-tel="${t.clubs}">${getal(t.clubs)}</b><span>clubs</span></div>
      <div><b class="num" data-tel="${t.countries}">${getal(t.countries)}</b><span>landen</span></div>
      <div><b class="num" data-tel="${Object.keys(SPELERS).length}">${getal(Object.keys(SPELERS).length)}</b><span>spelers</span></div>
    </div>
  </section>`;
}

function laatste(){
  const m = APP.matches[0], h = club(m.hid), a = club(m.aid);
  const v = m.venue ? stadion(m.venue) : null;
  const bezoek = m.venue ? APP.matches.filter(x => x.venue === m.venue).length : 0;
  return `
  <section class="card">
    <div class="card-head"><h2>Laatste duel</h2></div>
    <a class="laatste" href="${wedstrijdHref(m.id)}">
      <div class="laatste-crests">${logo(h.crest, h.name)}${logo(a.crest, a.name)}
        <span class="result">${m.hs}–${m.as}</span></div>
      <div class="teams">${esc(h.name)} – ${esc(a.name)}</div>
      <div class="duel-meta">${datum(m.date, true)} · ${esc(comp(m.t))}</div>
    </a>
    <div class="context">Je <b>${APP.totals.matches}e</b> duel${v
      ? ` en je <b>${bezoek}e</b> bezoek aan ${esc(v.name)}` : ''}.</div>
  </section>`;
}

function reeks(){
  const r = seizoensreeks(APP.matches.map(m => m.date));
  if (!r) return '';
  return `
  <section class="card">
    <div class="card-head"><h2>Duels per seizoen</h2><h2>${r.rijen.length} seizoenen</h2></div>
    ${r.html}
    ${r.leeg ? `<div class="note">${r.leeg} seizoenen zonder duel, als nul in de reeks.</div>`
             : '<div style="height:10px"></div>'}
  </section>`;
}

/* Collecties: de drie albums die het dichtst bij vol zijn, en nog niet vol.
   Dat zijn de albums waar een volgende wedstrijd iets verschil maakt. */
function collecties(){
  const open = albums().filter(a => a.gezien < a.totaal)
    .sort((x, y) => (y.gezien / y.totaal - x.gezien / x.totaal) || (x.totaal - x.gezien) - (y.totaal - y.gezien))
    .slice(0, 3);
  if (!open.length) return '';
  const kort = a => a.soort === 'landen' ? `Spelers uit ${a.titel}` : `${a.groep.replace(/ \d{4}\/\d{2}$/, '')} · ${a.titel}`;
  return `
  <section class="card">
    <div class="card-head"><h2>Collecties</h2></div>
    <div style="height:6px"></div>
    ${open.map(a => `
      <a class="album-rij" href="${albumHref(a.id)}">
        <div class="album-kop">
          <span class="album-titel">${esc(kort(a))}</span>
          <span class="album-tal">${a.gezien} <span>van ${a.totaal}</span></span>
        </div>
        ${meter(a.gezien, a.totaal)}
      </a>`).join('')}
    <a class="meer-knop" href="collecties.html">Alle collecties</a>
  </section>`;
}

/* Vaakst gezien: drie ranglijsten achter één keuzeschakelaar, zodat Home kort
   blijft. Elke rij leidt naar zijn eigen scherm. */
const TOP = {
  clubs: () => APP.clubs.slice(0, 5).map(c => ({
    name: esc(c.name), count: c.count, beeld: logo(c.crest, c.name, true), href: clubHref(c.id)})),
  grounds: () => APP.venues.slice(0, 5).map(v => ({
    name: esc(v.name), count: v.visits, href: stadionHref(v.key)})),
  spelers: () => Object.entries(SPELERS).sort((a, b) => b[1].seen - a[1].seen).slice(0, 5)
    .map(([id, p]) => ({name: esc(p.n), count: p.seen, href: spelerHref(id),
                        beeld: portret(p.img, p.n)})),
};

function vaakst(keuze){
  return `
  <section class="card" id="vaakst">
    <div class="card-head"><h2>Vaakst gezien</h2></div>
    <div class="seg" role="group" aria-label="Kies een lijst">
      ${[['clubs', 'Clubs'], ['grounds', 'Grounds'], ['spelers', 'Spelers']].map(([k, l]) =>
        `<button type="button" data-top="${k}" aria-pressed="${k === keuze}">${l}</button>`).join('')}
    </div>
    ${ranglijst(TOP[keuze]())}
  </section>`;
}

/* Records rekent het scherm zelf uit, zodat elke regel naar zijn wedstrijd
   kan wijzen. */
function records(){
  const rijen = [];
  const metStand = APP.matches.filter(m => m.hs != null && m.as != null);
  const goals = metStand.reduce((b, m) => m.hs + m.as > b.hs + b.as ? m : b, metStand[0]);
  const zege = metStand.reduce((b, m) => Math.abs(m.hs - m.as) > Math.abs(b.hs - b.as) ? m : b, metStand[0]);
  const publiek = APP.matches.filter(m => m.att).reduce((b, m) => !b || m.att > b.att ? m : b, null);
  const regel = (m, waarde, label) => `
    <a class="record" href="${wedstrijdHref(m.id)}">
      <span class="record-waarde">${waarde}</span>
      <span class="lijst-main">
        <span class="lijst-naam">${label}</span>
        <span class="lijst-sub">${esc(club(m.hid).name)} – ${esc(club(m.aid).name)} · ${datum(m.date)}</span>
      </span>
      <span class="chev" aria-hidden="true">›</span>
    </a>`;
  if (goals) rijen.push(regel(goals, goals.hs + goals.as, 'Meeste goals in één duel'));
  if (zege && zege !== goals) rijen.push(regel(zege, `${zege.hs}–${zege.as}`, 'Grootste zege'));
  if (publiek) rijen.push(regel(publiek, getal(publiek.att), 'Meeste publiek'));
  const jong = APP.records?.youngest_player;
  if (jong){
    const id = Object.keys(SPELERS).find(k => SPELERS[k].n === jong.name);
    rijen.push(`
    <a class="record" href="${id ? spelerHref(id) : '#'}">
      <span class="record-waarde">${jong.age_years}</span>
      <span class="lijst-main">
        <span class="lijst-naam">Jongste speler: ${esc(jong.name)}</span>
        <span class="lijst-sub">${jong.age_years} jaar en ${jong.age_days} dagen · ${datum(jong.match_date)}</span>
      </span>
      <span class="chev" aria-hidden="true">›</span>
    </a>`);
  }
  return rijen.length ? `
  <section class="card">
    <div class="card-head"><h2>Records</h2></div>
    <div style="height:6px"></div>
    ${rijen.join('')}
  </section>` : '';
}

function recent(){
  return `
  <section class="card">
    <div class="card-head"><h2>Recent</h2></div>
    <div style="height:8px"></div>
    ${APP.matches.slice(1, 6).map(duelLink).join('')}
    <a class="meer-knop" href="duels.html">Alle ${APP.totals.matches} duels</a>
  </section>`;
}

function render(){
  app.innerHTML = verzameling() + laatste() + collecties() + reeks() + vaakst('clubs') + records() + recent();
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-top]');
    if (b) document.getElementById('vaakst').outerHTML = vaakst(b.dataset.top);
  });
}

/* ── Intro na een lange afwezigheid ──────────────────────────────────────
   Ben je een dag weg geweest, of is dit je eerste bezoek op dit apparaat,
   dan opent Home met een korte intro. Daarna komen de kaarten op en tellen
   de tellers op vanaf nul. Tik om hem over te slaan, tik op het logo om hem
   nog eens te zien. Met 'Verminder beweging' aan blijft hij weg. */
const WEG_NA = 864e5;   // een dag
const rustig = matchMedia('(prefers-reduced-motion: reduce)').matches;

const BAL = `<svg class="bal" viewBox="0 0 20 20" aria-hidden="true">
  <circle cx="10" cy="10" r="9"/>
  <path d="M10 6.2 13.61 8.83 12.23 13.07H7.77L6.39 8.83z"/>
  <path d="M10 6.2V1M13.61 8.83l4.95-1.61M12.23 13.07l3.06 4.21M7.77 13.07l-3.06 4.21M6.39 8.83l-4.95-1.61"/>
</svg>`;

function hoeLang(ms){
  const d = Math.floor(ms / 864e5);
  if (d < 14) return d === 1 ? '1 dag' : `${d} dagen`;
  if (d < 60) return `${Math.floor(d / 7)} weken`;
  if (d < 730) return `${Math.round(d / 30.44)} maanden`;
  return `${Math.round(d / 365.25)} jaar`;
}

const samenvatting = () => `${getal(APP.totals.matches)} duels · ${getal(APP.totals.venues)} grounds`;

let introLoopt = false;
function intro(tekst){
  if (rustig || introLoopt) return;
  introLoopt = true;
  app.querySelectorAll('[data-tel]').forEach(b => b.textContent = '0');
  const el = document.createElement('div');
  el.className = 'intro';
  el.setAttribute('aria-hidden', 'true');
  el.innerHTML = `
    <div class="intro-inhoud">
      <div class="veld">
        <svg class="lijnen" viewBox="0 0 240 150">
          <path pathLength="1" d="M120 4H10a6 6 0 0 0-6 6v130a6 6 0 0 0 6 6h110"/>
          <path pathLength="1" d="M120 4h110a6 6 0 0 1 6 6v130a6 6 0 0 1-6 6H120"/>
          <path pathLength="1" d="M120 4v142" style="animation-delay:.15s; animation-duration:.6s"/>
          <path pathLength="1" d="M120 53a22 22 0 1 1 0 44a22 22 0 1 1 0-44" style="animation-delay:.3s; animation-duration:.6s"/>
          <path pathLength="1" d="M4 43h30v64H4" style="animation-delay:.45s; animation-duration:.5s"/>
          <path pathLength="1" d="M236 43h-30v64h30" style="animation-delay:.45s; animation-duration:.5s"/>
        </svg>
        <i class="golf"></i>
        <div class="bal-x"><i class="schaduw"></i><div class="bal-y">${BAL}</div></div>
      </div>
      <div class="intro-merk"><span>Ground</span><b>Hop</b></div>
      <div class="intro-sub">${esc(tekst)}</div>
    </div>`;
  document.body.append(el);
  const klaar = () => {
    if (el.classList.contains('weg')) return;
    el.classList.add('weg');
    binnenkomst();
    setTimeout(() => { el.remove(); introLoopt = false; }, 450);
  };
  el.addEventListener('click', klaar);
  setTimeout(klaar, 2750);
}

function binnenkomst(){
  [...app.children].forEach((kaart, i) => kaart.style.setProperty('--i', i));
  app.classList.add('binnen');
  setTimeout(() => app.classList.remove('binnen'), 1400);
  const tellers = app.querySelectorAll('[data-tel]'), start = performance.now();
  const stap = nu => {
    const p = Math.min(1, (nu - start) / 900), e = 1 - (1 - p) ** 3;
    tellers.forEach(b => b.textContent = getal(Math.round(b.dataset.tel * e)));
    if (p < 1) requestAnimationFrame(stap);
  };
  requestAnimationFrame(stap);
}

function welkom(vorig){
  if (!vorig) intro(samenvatting());
  else if (Date.now() - vorig > WEG_NA) intro(`Welkom terug · ${hoeLang(Date.now() - vorig)} weg`);
}

if (window.APP && window.SPELERS){
  render();
  welkom(VORIG_GEBRUIK);
  // Een app op het beginscherm blijft soms dagen in het geheugen staan en
  // laadt dan niet opnieuw; terugkomen telt dan ook.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) welkom(laatstGebruikt()); });
  document.querySelector('.merk').addEventListener('click', () => intro(samenvatting()));
}
else app.innerHTML = zonderData('index.html');
</script>
</body>
</html>
