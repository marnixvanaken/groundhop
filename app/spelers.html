<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#edeff2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<title>Spelers — GroundHop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="groundhop.css">
<style>
/* Alleen wat dit scherm zelf nodig heeft; de rest staat in groundhop.css.

   Van de 3016 spelers die je zag zijn er een paar honderd die je echt kent.
   De lijst begint daarom bij wie je het vaakst zag en toont er vijftig; het
   zoekveld vindt de rest. */
.speler .avatar,.speler .avatar-fallback{width:40px; height:40px;}
.leeg{padding:16px; font-size:13px; color:var(--content-2);}
/* Onder elke tab een tweede, kleinere keuze: wat er precies geteld wordt.
   Past het niet op één regel, dan loopt het door op de volgende, zodat je
   alles ziet zonder te schuiven. */
.seg.klein{margin:6px 16px 8px; flex-wrap:wrap;}
.seg.klein button{flex:1 0 auto; min-height:28px; padding:0 6px; font-size:12px;}
</style>
</head>
<body>

<div class="bar met-zoek">
  <div class="bar-titel"><h1 style="padding-left:8px">Spelers</h1></div>
  <div class="zoekveld">
    <svg class="loep" viewBox="0 0 18 18" aria-hidden="true">
      <circle cx="8" cy="8" r="5.5"/><path d="M12.2 12.2 16 16"/></svg>
    <input id="zoek" type="search" inputmode="search" autocomplete="off"
           enterkeyhint="search" placeholder="Zoek een speler" aria-label="Zoek een speler">
    <button class="wis" id="wis" type="button" aria-label="Zoekveld wissen" hidden>✕</button>
  </div>
</div>

<main id="app"></main>

<nav class="tabbar" aria-label="Hoofdnavigatie"></nav>

<script src="app-data.js"></script>
<script src="speler-data.js"></script>
<script src="groundhop.js"></script>
<script>
const app = document.getElementById('app');
tabbalk('spelers');

const TOON = 50;

/* Vier tabs met elk een paar lijsten eronder. Per lijst: waarop hij sorteert
   (w), wat de badge zegt, wat er onder de naam staat en een voetnoot. Groen
   telt wat jij zag; neutraal is wat Transfermarkt over de speler weet. Wie in
   een lijst niets heeft (geen goal, geen kaart, geen waarde), staat er niet in. */
const meer = (n, een, veel) => `${getal(n)} ${n === 1 ? een : veel}`;
const jaar = iso => iso ? ` (${iso.slice(0, 4)})` : '';
const leeftijdOp = a => a[0] * 366 + a[1];
const kort = iso => datum(iso).replace(/ /g, '&nbsp;');
const opLeeftijd = a => `${a[0]} jaar en ${meer(a[1], 'dag', 'dagen')} · ${kort(a[2])}`;
const duur = d => d >= 365 ? `${Math.floor(d / 365.25)} jaar`
                : d >= 31 ? `${Math.round(d / 30.44)} mnd` : meer(d, 'dag', 'dagen');

const TABS_SPELERS = [
  {id: 'wedstrijd', label: 'Wedstrijd', lijsten: [
    {id: 'seen', label: 'Gezien', w: p => p.seen, badge: p => `${p.seen}×`},
    {id: 'min', label: 'Minuten', w: p => p.min, badge: p => `${getal(p.min)} min`,
     noot: 'Minuten die jij hem zag spelen, opgeteld over je duels.'},
    {id: 'bas', label: 'Basis', w: p => p.bas, badge: p => `${p.bas}×`,
     noot: 'Duels waarin je hem in de basis zag beginnen.'},
    {id: 'inv', label: 'Invaller', w: p => p.inv, badge: p => `${p.inv}×`,
     noot: 'Duels waarin je hem zag invallen.'},
    {id: 'bank', label: 'Bank', w: p => p.bank, badge: p => `${p.bank}×`,
     noot: 'Duels waarin hij op de bank zat en niet inviel.'},
  ]},
  {id: 'prestaties', label: 'Prestaties', lijsten: [
    {id: 'g', label: 'Goals', w: p => p.g, badge: p => meer(p.g, 'goal', 'goals'),
     noot: 'Goals die jij zag, niet zijn carrièretotaal.'},
    {id: 'as', label: 'Assists', w: p => p.as, badge: p => meer(p.as, 'assist', 'assists'),
     noot: 'Assists die jij zag, niet zijn carrièretotaal.'},
    {id: 'pen', label: "Penalty's", w: p => p.pen, badge: p => meer(p.pen, 'penalty', "penalty's"),
     sub: p => `${meer(p.g, 'goal', 'goals')} in totaal`,
     noot: "Penalty's die jij hem zag benutten."},
    {id: 'sup', label: 'Supersub', w: p => p.sup, badge: p => meer(p.sup, 'goal', 'goals'),
     sub: p => `${meer(p.g, 'goal', 'goals')} in totaal`,
     noot: 'Goals die jij hem zag maken nadat hij was ingevallen.'},
    {id: 'laat', label: 'Laat raak', w: p => p.laat, badge: p => meer(p.laat, 'goal', 'goals'),
     sub: p => `${meer(p.g, 'goal', 'goals')} in totaal`,
     noot: 'Goals in de 90e minuut of later die jij zag, met blessuretijd en verlenging.'},
    {id: 'eg', label: 'Eigen goals', w: p => p.eg, badge: p => meer(p.eg, 'eigen goal', 'eigen goals'),
     noot: 'Eigen goals die jij hem zag maken.'},
    {id: 'ge', label: 'Geel', w: p => p.ge, badge: p => `${p.ge}× geel`,
     noot: 'Gele kaarten die jij zag.'},
    {id: 'ro', label: 'Rood', w: p => p.ro, badge: p => `${p.ro}× rood`,
     noot: 'Rode kaarten die jij zag, ook die na twee keer geel.'},
  ]},
  {id: 'waarde', label: 'Waarde', lijsten: [
    {id: 'mv', label: 'Nu', neutraal: true, w: p => p.mv, badge: p => euro(p.mv),
     sub: p => p.mx > p.mv ? `hoogste ${euro(p.mx)}${jaar(p.mxd)}` : '',
     noot: 'Huidige marktwaarde volgens Transfermarkt.'},
    {id: 'mx', label: 'Hoogste', neutraal: true, w: p => p.mx, badge: p => euro(p.mx),
     sub: p => [p.mxd ? datum(p.mxd) : '', !p.mv ? '' : p.mv === p.mx ? 'nu ook' : `nu ${euro(p.mv)}`]
       .filter(Boolean).join(' · '),
     noot: 'Hoogste marktwaarde ooit volgens Transfermarkt, met de datum waarop hij die voor het eerst bereikte.'},
  ]},
  {id: 'overig', label: 'Overig', lijsten: [
    {id: 'teams', label: 'Teams', w: p => p.teams.length, badge: p => meer(p.teams.length, 'team', 'teams'),
     sub: p => p.teams.map(esc).join(' · '),
     noot: 'Teams waarvoor je hem zag, ook jeugd- en nationale elftallen.'},
    {id: 'stad', label: 'Stadions', w: p => p.stad.length, badge: p => meer(p.stad.length, 'stadion', 'stadions'),
     sub: p => p.stad.slice(0, 3).map(k => esc(stadion(k)?.name || k)).join(' · ')
       + (p.stad.length > 3 ? ` +${p.stad.length - 3}` : ''),
     noot: 'In hoeveel verschillende stadions je hem zag.'},
    {id: 'volg', label: 'Gevolgd', w: p => p.dagen, badge: p => duur(p.dagen),
     sub: p => `${kort(p.van)} – ${kort(p.tot)}`,
     noot: 'De tijd tussen de eerste en de laatste keer dat je hem zag.'},
    {id: 'jo', label: 'Jongste', oplopend: true, w: p => p.jo && leeftijdOp(p.jo),
     badge: p => `${p.jo[0]} jaar`, sub: p => opLeeftijd(p.jo),
     noot: 'Zijn leeftijd de eerste keer dat je hem zag spelen; de bank telt niet mee.'},
    {id: 'ou', label: 'Oudste', w: p => p.ou && leeftijdOp(p.ou),
     badge: p => `${p.ou[0]} jaar`, sub: p => opLeeftijd(p.ou),
     noot: 'Zijn leeftijd de laatste keer dat je hem zag spelen; de bank telt niet mee.'},
    {id: 'caps', label: 'Interlands', neutraal: true, w: p => p.caps, badge: p => `${p.caps}×`,
     sub: p => p.capg ? meer(p.capg, 'interlandgoal', 'interlandgoals') : '',
     noot: 'Interlands in zijn hele loopbaan volgens Transfermarkt, niet alleen wat jij zag.'},
    {id: 'cm', label: 'Lengte', neutraal: true, w: p => p.cm, badge: p => `${p.cm} cm`,
     noot: 'Lengte volgens Transfermarkt.'},
  ]},
];

/* Welke tab en welke lijst eronder, ook als je terugkomt van een speler. */
const S = {vraag: '', land: null, tab: 'wedstrijd',
           lijst: Object.fromEntries(TABS_SPELERS.map(t => [t.id, t.lijsten[0].id]))};
try {
  const o = JSON.parse(sessionStorage.getItem('gh-spelers')) || {};
  if (typeof o.tab === 'string') S.tab = o.tab;
  Object.assign(S.lijst, o.lijst);
} catch {}
const gekozenTab = () => TABS_SPELERS.find(t => t.id === S.tab) || TABS_SPELERS[0];
const gekozen = () => { const t = gekozenTab(); return t.lijsten.find(l => l.id === S.lijst[t.id]) || t.lijsten[0]; };
function onthoud(){
  try { sessionStorage.setItem('gh-spelers', JSON.stringify({tab: S.tab, lijst: S.lijst})); } catch {}
}

/* De teams waarvoor je hem zag, het vaakst eerst. */
function teams(p){
  const t = {};
  p.m.forEach(r => { if (r[1]) t[r[1]] = (t[r[1]] || 0) + 1; });
  return Object.entries(t).sort((a, b) => b[1] - a[1]).map(([naam]) => naam);
}
/* Wat de goals zelf vertellen (penalty, eigen goal, minuut). Per speler staat
   alleen het aantal; de wedstrijden hebben elke goal. Sofascore noemt een
   eigen goal 'ownGoal', Transfermarkt 'own'. */
const GOALS = {};
(window.APP?.matches || []).forEach(m => m.goals.forEach(g => {
  if (!g.pid) return;
  const t = GOALS[g.pid] ||= {pen: 0, eg: 0, laat: 0};
  if (g.type === 'own' || g.type === 'ownGoal'){ t.eg++; return; }
  if (g.type === 'penalty') t.pen++;
  if (g.min >= 90) t.laat++;
}));

function verrijk(id, p){
  const duels = p.m.map(r => wedstrijd(r[0])).filter(Boolean);
  const data = duels.map(m => m.date).sort();
  const perStadion = {};
  duels.forEach(m => { if (m.venue) perStadion[m.venue] = (perStadion[m.venue] || 0) + 1; });
  const g = GOALS[id] || {};
  return {id, ...p, zoek: plat(p.n), teams: teams(p),
    pen: g.pen || 0, eg: g.eg || 0, laat: g.laat || 0,
    // Wie niet in de basis begon en toch scoorde, viel in.
    sup: p.m.reduce((n, r) => n + (r[5] ? 0 : r[3] || 0), 0),
    stad: Object.entries(perStadion).sort((a, b) => b[1] - a[1]).map(([k]) => k),
    van: data[0], tot: data[data.length - 1],
    dagen: data.length ? Math.round((new Date(data[data.length - 1]) - new Date(data[0])) / 864e5) : 0};
}
const ALLE = window.SPELERS ? Object.entries(SPELERS).map(([id, p]) => verrijk(id, p)) : [];

function rij(p){
  const l = gekozen();
  const sub = (l.sub && l.sub(p)) || [POSITIE[p.pos], esc(p.teams[0])].filter(Boolean).join(' · ');
  return `
    <a class="lijst-rij speler" href="${spelerHref(p.id)}">
      ${portret(p.img, p.n)}
      <span class="lijst-main">
        <span class="lijst-naam">${esc(p.n)}</span>
        <span class="lijst-sub"><span class="vlag">${vlag(p.c)}</span>
          ${sub}</span>
      </span>
      <span class="badge${l.neutraal ? ' neutraal' : ''}">${l.badge(p)}</span>
      <span class="chev" aria-hidden="true">›</span>
    </a>`;
}

function render(){
  const q = plat(S.vraag), t = gekozenTab(), l = gekozen();
  const lijst = ALLE.filter(p => (!q || p.zoek.includes(q)) && (!S.land || p.c === S.land) && l.w(p))
    .sort((a, b) => (l.oplopend ? l.w(a) - l.w(b) : l.w(b) - l.w(a)) || (b.seen - a.seen));
  const toon = lijst.slice(0, TOON);
  const knoppen = (soort, items, actief, label) => `
    <div class="seg${soort === 'lijst' ? ' klein' : ''}" role="group" aria-label="${label}">
      ${items.map(x => `<button type="button" data-${soort}="${x.id}" aria-pressed="${x.id === actief}">${x.label}</button>`).join('')}
    </div>`;
  const metMx = ALLE.filter(p => p.mx).length, metMv = ALLE.filter(p => p.mv).length;

  app.innerHTML = `
  ${S.land ? `<section class="card"><div class="lijst-rij">
      <span class="vlag" style="font-size:22px">${vlag(S.land)}</span>
      <span class="lijst-main"><span class="lijst-naam">Spelers uit ${esc(landNaam(S.land))}</span></span>
      <a class="back" href="spelers.html" aria-label="Filter wissen">✕</a></div></section>` : ''}
  <section class="card">
    ${knoppen('tab', TABS_SPELERS, t.id, 'Soort lijst')}
    ${knoppen('lijst', t.lijsten, l.id, 'Sorteer op')}
    ${toon.length ? toon.map(rij).join('') : `<div class="leeg">${q
      ? `Geen speler gevonden voor “${esc(S.vraag)}”${ALLE.some(p => p.zoek.includes(q)) ? ' in deze lijst' : ''}.`
      : 'Nog niemand in deze lijst.'}</div>`}
    <div class="note">${lijst.length > TOON
      ? `${TOON} van ${getal(lijst.length)} getoond. Zoek om de rest te vinden.`
      : `${getal(lijst.length)} ${lijst.length === 1 ? 'speler' : 'spelers'}.`}
      ${l.noot || ''}
      ${t.id === 'waarde' && metMx < metMv
        ? `Hoogste waarde bekend bij ${getal(metMx)} van ${getal(metMv)} spelers; de rest vult zich 's nachts aan.` : ''}</div>
  </section>`;
}

app.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t){ S.tab = t.dataset.tab; onthoud(); render(); }
  const l = e.target.closest('[data-lijst]');
  if (l){ S.lijst[S.tab] = l.dataset.lijst; onthoud(); render(); }
});

if (window.APP && window.SPELERS){
  S.land = param('land');
  render();
  window.addEventListener('hashchange', () => { S.land = param('land'); render(); app.scrollTop = 0; });
  koppelZoekveld(v => { S.vraag = v; render(); app.scrollTop = 0; });
} else {
  app.innerHTML = zonderData('spelers.html');
}
</script>
</body>
</html>
