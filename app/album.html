<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#edeff2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="GroundHop">
<title>Album — GroundHop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="groundhop.css">
<script src="overgang.js"></script>
<style>
/* Alleen wat dit scherm zelf nodig heeft; de rest staat in groundhop.css.

   Een album als plakboek: wat je zag staat in kleur, wat nog mist is grijs
   met alleen de naam. Vaste, alfabetische volgorde, zodat de gaten zichtbaar
   blijven waar ze horen. Groen betekent ook hier: van jou. */
.albumkop{padding:18px 16px 16px;}
.albumkop .groep{font-size:12px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
  color:var(--content-2);}
.albumkop h2{font-family:var(--display); font-size:24px; font-weight:700; letter-spacing:-0.02em;
  line-height:1.15; margin:2px 0 12px;}
.albumkop .stand{display:flex; align-items:baseline; gap:8px; margin-bottom:8px;}
.albumkop .stand b{font-family:var(--display); font-size:34px; font-weight:700;
  letter-spacing:-0.02em; color:var(--accent); line-height:1;}
.albumkop .stand > span{font-size:15px; color:var(--content-2);}

.tegels{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:2px; padding:8px 8px 12px;}
.tegels.landen{grid-template-columns:repeat(4,minmax(0,1fr));}
.tegel{display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px 10px;
  border-radius:12px; color:inherit; text-decoration:none; text-align:center; min-width:0;}
a.tegel:active{background:var(--card-sunken);}
.tegel .crest,.tegel .crest-fallback{width:44px; height:44px; font-size:13px;}
.vlag-tegel{width:48px; height:36px; object-fit:cover; border-radius:6px; margin:2px 0;
  box-shadow:0 0 0 0.5px var(--separator);}
.tegel .code{font-family:var(--display); font-weight:700; font-size:14px; color:var(--content-2);
  width:40px; height:40px; border-radius:50%; background:var(--card-sunken);
  display:flex; align-items:center; justify-content:center;}
.tegel-naam{font-size:12px; line-height:1.25; overflow-wrap:anywhere;}
.tegel-tal{font-family:var(--display); font-variant-numeric:tabular-nums; font-size:12px;
  font-weight:600; color:var(--accent);}

/* Wat nog mist: hetzelfde beeld, maar grijs en stil. Zonder logo een
   gestippelde cirkel met de initialen. */
.tegel.mist .crest,.tegel.mist .vlag-tegel{filter:grayscale(1); opacity:.35;}
.tegel.mist .crest-fallback,.tegel.mist .code{background:transparent;
  border:1.5px dashed var(--separator); color:var(--content-2);}
.tegel.mist .tegel-naam{color:var(--content-2);}
.tegel.mist .tegel-tal{visibility:hidden;}


/* Clublogo's bij een stadion: één groot, of twee kleinere naast elkaar als het
   stadion gedeeld wordt. Grijs zolang je er niet was. */
.wapens{display:flex; align-items:center; justify-content:center; height:44px;}
.wapens.twee .crest-mini,.wapens.twee .crest-fallback.mini{width:32px; height:32px; font-size:10px;}
.wapens.twee > :last-child{margin-left:-6px;}
.tegel.mist .wapens{filter:grayscale(1); opacity:.35;}
/* Een vakje dat sinds je vorige bezoek gevuld is, draait om en krijgt een
   glans, zoals een plaatje dat je net hebt ingeplakt. */
.tegel.nieuw{position:relative; overflow:hidden; animation:vakje-draai .75s var(--veer) .25s both;}
.tegel.nieuw::after{content:""; position:absolute; inset:0; pointer-events:none; transform:translateX(-120%);
  background:linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.55) 48%, transparent 66%);
  animation:glans .6s ease .95s both;}
@keyframes vakje-draai{0%{transform:perspective(500px) rotateY(-180deg); opacity:.35;}
  50%{transform:perspective(500px) rotateY(-90deg) scale(1.15);} 100%{transform:none; opacity:1;}}
@keyframes glans{to{transform:translateX(120%);}}
</style>
</head>
<body>

<div class="bar" id="bar"></div>

<main id="app"></main>

<nav class="tabbar" aria-label="Hoofdnavigatie"></nav>

<script src="app-data.js"></script>
<script src="groundhop.js"></script>
<script>
const app = document.getElementById('app');
tabbalk('meer', true);
document.getElementById('bar').innerHTML = terugknop('Collecties', 'collecties.html') + '<h1>Album</h1>';

let FILTER = 'alles';
/* Wat dit apparaat de vorige keer in dit album zag. Wat er sindsdien bij
   kwam, draait om; het getal rolt van de oude naar de nieuwe stand. */
let NIEUW = new Set(), VORIGE_STAND = null;
const sleutel = (a, i) => a.soort === 'landen' ? i.code : a.soort === 'stadions' ? (i.key || i.naam) : (i.club ?? i.naam);
function vergelijk(a){
  const nu = a.items.filter(i => i.gezien).map(i => String(sleutel(a, i)));
  let vorig = null;
  try { vorig = JSON.parse(localStorage.getItem('gh-album-' + a.id) || 'null');
        localStorage.setItem('gh-album-' + a.id, JSON.stringify(nu)); } catch {}
  NIEUW = new Set(vorig ? nu.filter(k => !vorig.includes(k)) : []);
  VORIGE_STAND = NIEUW.size ? a.gezien - NIEUW.size : null;
}

function naamVan(a, i){ return a.soort === 'landen' ? landNaam(i.code) : i.naam; }

function tegel(a, i){
  const naam = naamVan(a, i);
  const klasse = `tegel${i.gezien ? '' : ' mist'}${NIEUW.has(String(sleutel(a, i))) ? ' nieuw' : ''}`;
  if (a.soort === 'landen'){
    const beeld = vlag(i.code, 'vlag-tegel');
    const inhoud = `${beeld}<span class="tegel-naam">${esc(naam)}</span>
      <span class="tegel-tal">${i.n} ${i.n === 1 ? 'speler' : 'spelers'}</span>`;
    return i.gezien ? `<a class="${klasse}" href="spelers.html#land=${i.code}">${inhoud}</a>`
                    : `<div class="${klasse}" aria-label="${esc(naam)}, nog niet gezien">${inhoud}</div>`;
  }
  // clubs
  const beeld = logo(i.crest, naam);
  const inhoud = `${beeld}<span class="tegel-naam">${esc(naam)}</span>
    <span class="tegel-tal">${i.n}×</span>`;
  return i.gezien ? `<a class="${klasse}" href="${clubHref(i.club)}">${inhoud}</a>`
                  : `<div class="${klasse}" aria-label="${esc(naam)}, nog niet gezien">${inhoud}</div>`;
}

/* Een stadion als tegel, net als een club: de clublogo's als beeld (twee
   kleinere bij een gedeeld stadion), de naam eronder. */
function stadionTegel(i, a){
  const clubs = i.clubs || [];
  const inhoud = `
    <span class="wapens${clubs.length > 1 ? ' twee' : ''}" aria-hidden="true">
      ${clubs.map(k => logo(k.crest, k.naam, clubs.length > 1)).join('')}</span>
    <span class="tegel-naam">${esc(i.naam)}</span>
    <span class="tegel-tal">${i.n}×</span>`;
  const label = `${esc(i.naam)} (${esc(i.sub)})${i.gezien ? '' : ', nog niet bezocht'}`;
  return i.gezien ? `<a class="tegel${NIEUW.has(String(sleutel(a, i))) ? ' nieuw' : ''}" href="${stadionHref(i.key)}" aria-label="${label}">${inhoud}</a>`
                  : `<div class="tegel mist" aria-label="${label}">${inhoud}</div>`;
}

function render(){
  const a = album(param('id')) || albums()[0];
  document.title = `${albumNaam(a)} — GroundHop`;
  const items = a.items.slice().sort((x, y) => naamVan(a, x).localeCompare(naamVan(a, y), 'nl'));
  const zichtbaar = items.filter(i => FILTER === 'alles' || (FILTER === 'gezien') === i.gezien);
  const rest = a.totaal - a.gezien;

  let lijst;
  if (!zichtbaar.length) lijst = `<div class="note" style="border-top:0">${FILTER === 'mist'
      ? 'Niets meer te gaan: dit album is vol.' : 'Nog niets in dit album.'}</div>`;
  else lijst = `<div class="tegels${a.soort === 'landen' ? ' landen' : ''}">${zichtbaar.map(i =>
      a.soort === 'stadions' ? stadionTegel(i, a) : tegel(a, i)).join('')}</div>`;

  app.innerHTML = `
  <section class="card">
    <div class="albumkop">
      <div class="groep">${esc(a.groep)}</div>
      <h2>${esc(a.titel)}</h2>
      <div class="stand"><b>${VORIGE_STAND != null ? rol(VORIGE_STAND, a.gezien) : a.gezien}</b><span>van ${a.totaal}${rest ? ` · nog ${rest} te gaan` : ' · vol'}</span></div>
      ${meter(a.gezien, a.totaal)}
    </div>
  </section>

  <section class="card">
    <div class="seg" role="group" aria-label="Toon" style="margin-bottom:4px">
      ${[['alles', 'Alles'], ['gezien', 'Gezien'], ['mist', 'Nog te gaan']].map(([k, l]) =>
        `<button type="button" data-filter="${k}" aria-pressed="${FILTER === k}">${l}</button>`).join('')}
    </div>
    ${lijst}
  </section>
  ${a.soort !== 'landen' ? `<p class="note" style="border-top:0;padding:0 4px">Seizoen ${esc(a.groep.split(' ').pop())}.
    ${a.soort === 'stadions' ? 'Een stadion telt als je er een wedstrijd zag, van welke competitie ook.'
                             : 'Een club telt als je hem zag spelen, in welke competitie ook.'}</p>` : ''}`;
}

app.addEventListener('click', e => {
  const f = e.target.closest('[data-filter]');
  // Een ander filter: de nieuwe vakjes hebben al gedraaid.
  if (f){ FILTER = f.dataset.filter; NIEUW = new Set(); VORIGE_STAND = null; render(); }
});

if (window.APP && APP.albums){
  vergelijk(album(param('id')) || albums()[0]);
  render();
  window.addEventListener('hashchange', () => {
    FILTER = 'alles'; vergelijk(album(param('id')) || albums()[0]); render(); app.scrollTop = 0;
  });
} else {
  app.innerHTML = zonderData('album.html');
}
</script>
</body>
</html>
