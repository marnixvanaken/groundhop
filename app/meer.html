<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#edeff2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<title>Meer — GroundHop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="groundhop.css">
<style>
/* Alleen wat dit scherm zelf nodig heeft; de rest staat in groundhop.css.

   Meer is de plek voor wat geen eigen tab verdient: toevoegen, de lijsten
   van clubs, competities en scheidsrechters, en waar de data vandaan komt. */
.icoon{width:30px; height:30px; border-radius:8px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--accent); color:var(--card);}
.icoon svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.4;
  stroke-linecap:round;}

/* ── Live zetten ─────────────────────────────────────────────────────────
   Alleen zichtbaar als server.py draait. Eén keer een sleutel plakken; daarna
   gaat alles wat je toevoegt vanzelf naar de live site. */
.live{padding:4px 16px 14px; font-size:13px; color:var(--content-2);}
.live ol{margin:6px 0 10px 18px;}
.live li{margin:3px 0;}
.live a{color:var(--accent);}
.live-rij{display:flex; gap:8px; margin-top:8px;}
.live-rij input{flex:1; min-width:0; height:40px; border:0; border-radius:11px; padding:0 12px;
  background:var(--card-sunken); color:var(--content); font:inherit; font-size:16px;}
.knop{height:40px; padding:0 16px; border:0; border-radius:11px; cursor:pointer;
  background:var(--accent); color:var(--card); font:inherit; font-size:15px; font-weight:600;}
.knop.stil{background:var(--card-sunken); color:var(--content);}
.knop:disabled{opacity:.5;}
.live-status{margin-top:8px;}
</style>
</head>
<body>

<div class="bar"><h1 style="padding-left:8px">Meer</h1></div>

<main id="app"></main>

<nav class="tabbar" aria-label="Hoofdnavigatie"></nav>

<script src="app-data.js"></script>
<script src="groundhop.js"></script>
<script>
const app = document.getElementById('app');
tabbalk('meer');

const BRON = {transfermarkt: 'Transfermarkt', sofascore: 'Sofascore'};

async function api(pad, opties){
  try { const r = await fetch(pad, opties); return r.ok ? await r.json() : null; }
  catch { return null; }
}

/* De kaart voor live zetten. Zonder server.py (de live site) antwoordt
   /api/live niet, en dan verschijnt hij ook niet. */
function liveKaart(info){
  if (!info) return '';
  if (!info.lokaal) return `
    <section class="card"><div class="card-head"><h2>Live zetten</h2></div>
      <div class="live">Koppelen kan alleen op de laptop waar server.py draait.</div></section>`;
  const laatst = info.laatst;
  const status = !laatst ? '' : laatst.ok
    ? `Laatst live gezet: ${laatst.tijd}${laatst.status === 'al live' ? ' (er was niets nieuws)' : ''}.`
    : laatst.fout ? `Live zetten mislukte: ${esc(laatst.fout)}` : '';
  if (info.gekoppeld) return `
    <section class="card" id="live">
      <div class="card-head"><h2>Live zetten</h2><span class="kop-tel">gekoppeld</span></div>
      <div class="live">
        Alles wat je toevoegt gaat vanzelf naar de live site (${esc(info.repo)}).
        Vercel is een minuut later bijgewerkt.
        <div class="live-status" id="live-status">${status}</div>
        <div class="live-rij">
          <button class="knop" type="button" id="live-nu">Nu live zetten</button>
          <button class="knop stil" type="button" id="live-los">Ontkoppel</button>
        </div>
      </div>
    </section>`;
  return `
    <section class="card" id="live">
      <div class="card-head"><h2>Live zetten</h2></div>
      <div class="live">
        Koppel GitHub één keer, dan komt alles wat je toevoegt vanzelf op de live site.
        <ol>
          <li><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Maak een sleutel aan</a>
            (fine-grained token).</li>
          <li>Kies bij <i>Repository access</i> alleen <b>${esc(info.repo.split('/')[1])}</b>.</li>
          <li>Zet bij <i>Permissions → Contents</i> <b>Read and write</b>, en klik <i>Generate token</i>.</li>
          <li>Plak de sleutel hieronder.</li>
        </ol>
        <div class="live-rij">
          <input id="live-sleutel" type="password" autocomplete="off" placeholder="github_pat_…" aria-label="GitHub-sleutel">
          <button class="knop" type="button" id="live-koppel">Koppel</button>
        </div>
        <div class="live-status" id="live-status"></div>
      </div>
    </section>`;
}

async function toonLive(){
  const info = await api('/api/live');
  const oud = document.getElementById('live');
  const html = liveKaart(info);
  if (oud) oud.outerHTML = html || '';
  else if (html) app.insertAdjacentHTML('afterbegin', html);
}

app.addEventListener('click', async e => {
  const status = t => { const el = document.getElementById('live-status'); if (el) el.textContent = t; };
  if (e.target.id === 'live-koppel'){
    e.target.disabled = true; status('Controleren…');
    const r = await api('/api/live/koppel', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: document.getElementById('live-sleutel').value})});
    if (r?.ok) toonLive(); else { e.target.disabled = false; status(r?.error || 'Koppelen lukte niet.'); }
  }
  if (e.target.id === 'live-nu'){
    e.target.disabled = true; status('Bezig met live zetten…');
    const r = await api('/api/live/nu', {method: 'POST'});
    status(r?.ok ? (r.status === 'al live' ? 'Er was niets nieuws: de live site is al bij.'
                                           : 'Live gezet. Vercel is over een minuut bijgewerkt.')
                 : (r?.fout || 'Live zetten lukte niet.'));
    e.target.disabled = false;
  }
  if (e.target.id === 'live-los'){
    await api('/api/live/ontkoppel', {method: 'POST'}); toonLive();
  }
});

function scheidsrechters(){
  const t = {};
  APP.matches.forEach(m => { if (m.ref) t[m.ref] = (t[m.ref] || 0) + 1; });
  return Object.entries(t).sort((a, b) => b[1] - a[1]);
}

function render(alleClubs){
  const clubs = alleClubs ? APP.clubs : APP.clubs.slice(0, 10);
  const refs = scheidsrechters();
  app.innerHTML = `
  <section class="card">
    <a class="lijst-rij" href="toevoegen.html">
      <span class="icoon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></span>
      <span class="lijst-main"><span class="lijst-naam">Wedstrijd toevoegen</span>
        <span class="lijst-sub">Zoek een club, kies de duels die je zag</span></span>
      <span class="chev" aria-hidden="true">›</span>
    </a>
  </section>

  <section class="card">
    <a class="lijst-rij" href="/dashboard.html">
      <span class="lijst-main"><span class="lijst-naam">Oud dashboard</span>
        <span class="lijst-sub">De vorige versie van GroundHop</span></span>
      <span class="chev" aria-hidden="true">›</span>
    </a>
  </section>

  <section class="card">
    <div class="card-head"><h2>Competities</h2><h2>${APP.comps.length}</h2></div>
    ${ranglijst(APP.comps.map(c => ({name: esc(comp(c.name)), count: c.count, href: compHref(c.name)})))}
  </section>

  <section class="card" id="clubs">
    <div class="card-head"><h2>Clubs</h2><h2>${APP.clubs.length}</h2></div>
    ${ranglijst(clubs.map(c => ({name: esc(c.name), count: c.count, beeld: logo(c.crest, c.name, true), href: clubHref(c.id)})))}
    ${alleClubs ? '' : `<button class="meer-knop" type="button" id="alle">Alle ${APP.clubs.length} clubs</button>`}
  </section>

  ${refs.length ? `
  <section class="card">
    <div class="card-head"><h2>Scheidsrechters</h2><h2>${refs.length}</h2></div>
    ${ranglijst(refs.slice(0, 5).map(([naam, n]) => ({name: esc(naam), count: n})))}
  </section>` : ''}

  <section class="card">
    <div class="card-head"><h2>Over de data</h2></div>
    <div style="height:6px"></div>
    <div class="row"><div class="row-main"><div class="row-label">Bron</div>
      <div class="row-value">${BRON[APP.source] || esc(APP.source)}</div></div></div>
    ${APP.generated ? `<div class="row"><div class="row-main"><div class="row-label">Bijgewerkt</div>
      <div class="row-value">${datum(APP.generated.slice(0, 10), true)}</div></div></div>` : ''}
    <div class="row"><div class="row-main"><div class="row-label">Periode</div>
      <div class="row-value">${datum(APP.totals.first)} — ${datum(APP.totals.last)}</div></div></div>
    <div class="note">Gebouwd uit je eigen export met <code>app/build_app_data.py</code>.
      Toevoegen werkt op je laptop, met <code>python3 server.py</code> op localhost:4000.</div>
  </section>`;
  const alle = document.getElementById('alle');
  if (alle) alle.addEventListener('click', () => {
    const y = app.scrollTop; render(true); toonLive(); app.scrollTop = y;
  });
}

if (window.APP){ render(false); toonLive(); }
else app.innerHTML = zonderData('meer.html');
</script>
</body>
</html>
