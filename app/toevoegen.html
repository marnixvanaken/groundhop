<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#edeff2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<title>Toevoegen — GroundHop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="groundhop.css">
<style>
/* Alleen wat dit scherm zelf nodig heeft; de rest staat in groundhop.css.

   Eén beslissing draagt dit scherm: het zoekveld blijft altijd staan.
   Het oude paneel liep in drie stappen — zoeken, dan seizoen kiezen, dan de
   lijst — en elke stap verving de vorige. Hier is zoeken de plek zelf, en de
   rest verschijnt eronder. (searching.md › "Make search available where people
   expect it".) Typen zoekt meteen; er is geen knop meer om op te drukken.
   (search-fields.md › "start search immediately when a person types".) */

:root{--on-accent:#ffffff;}
@media (prefers-color-scheme: dark){:root{--on-accent:#0e1013;}}

/* De bovenbalk met zoekveld (.bar.met-zoek) staat in groundhop.css. */

/* ── Club in een lijst ─────────────────────────────────────────────────── */
.club{display:flex; align-items:center; gap:12px; padding:10px 16px; min-height:52px;
      width:100%; border:0; background:none; color:inherit; font:inherit;
      text-align:left; cursor:pointer;}
.club + .club{border-top:0.5px solid var(--separator);}
/* Eén helper tekent alle logo's; hier mogen ze iets groter dan 'mini'. */
.club .crest-mini,.club .crest-fallback.mini{width:30px; height:30px; font-size:11px;}
.club-naam{flex:1; min-width:0; font-size:15px; font-weight:500; overflow-wrap:break-word;}
.club-tal{
  font-family:var(--display); font-variant-numeric:tabular-nums;
  font-size:13px; font-weight:600; color:var(--accent);
  background:var(--accent-soft); border-radius:7px; padding:3px 7px;
}

/* ── Gekozen club ──────────────────────────────────────────────────────── */
.clubkop{display:flex; align-items:center; gap:14px; padding:16px;}
.clubkop-naam{font-family:var(--display); font-size:21px; font-weight:700;
              letter-spacing:-0.01em; line-height:1.15; overflow-wrap:break-word;}
.clubkop-sub{font-size:13px; color:var(--content-2); margin-top:3px;}
.kop-tel{font-size:12px; color:var(--content-2); text-align:right;}

/* Seizoenen als één schuivende rij (.chips in groundhop.css) in plaats van
   25 kaarten onder elkaar. */

/* De duelrij zelf staat in groundhop.css, gelijk aan die op Stadiondetail. */
/* Het bolletje rechts. Groen is al van jou; neutraal is wat je nu aanwijst.
   Daarmee blijft groen één ding betekenen, ook op dit scherm. */
.bol{width:26px; height:26px; border-radius:50%; flex-shrink:0;
     display:flex; align-items:center; justify-content:center;
     font-size:14px; line-height:1;}
.bol.leeg{border:1.5px solid var(--content-2); opacity:0.5;}
.bol.aan{background:var(--content); color:var(--card);}
.bol.mijn{background:var(--accent-soft); color:var(--accent);}

/* ── Demo-schakelaar ───────────────────────────────────────────────────── */
.demo{display:flex; align-items:center; gap:10px; padding:10px 16px 12px;
      border-top:0.5px solid var(--separator);}
.demo span{flex:1; font-size:12px; color:var(--content-2);}
.demo .seg{margin:0; flex:none;}
.demo .seg button{padding:0 10px; font-size:12px; min-height:28px;}

/* ── De knop die iets aan jouw geschiedenis toevoegt ───────────────────── */
.cta{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(var(--tab-h) + 8px); z-index:9;
  min-height:48px; padding:0 22px; border:0; border-radius:24px; cursor:pointer;
  background:var(--accent); color:var(--on-accent);
  font:inherit; font-size:16px; font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,0.22);
}
.cta[hidden]{display:none;}
body.met-cta main{padding-bottom:calc(var(--tab-h) + 80px);}

/* Een melding in plaats van een systeemdialoog: dit is een ontwerp, dus ook
   het bericht dat er niets wordt opgeslagen hoort bij het ontwerp. */
.toast{
  position:fixed; left:50%; bottom:calc(var(--tab-h) + 66px); z-index:12;
  transform:translate(-50%,6px); opacity:0; pointer-events:none;
  max-width:calc(100% - 48px);
  padding:10px 16px; border-radius:20px;
  background:var(--content); color:var(--card);
  font-size:13px; font-weight:500; text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,0.2);
  transition:opacity .2s ease, transform .2s ease;
}
.toast.zien{opacity:1; transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="bar met-zoek">
  <div class="bar-titel">
    <button class="back" id="terug" type="button">
      <svg width="11" height="18" viewBox="0 0 11 18" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9.5 1.5 2 9l7.5 7.5"/></svg>
      <span id="terug-label">Grounds</span>
    </button>
    <h1 id="titel">Toevoegen</h1>
  </div>
  <div class="zoekveld">
    <svg class="loep" viewBox="0 0 18 18" aria-hidden="true">
      <circle cx="8" cy="8" r="5.5"/><path d="M12.2 12.2 16 16"/></svg>
    <input id="zoek" type="search" inputmode="search" autocomplete="off"
           enterkeyhint="search" placeholder="Zoek een club" aria-label="Zoek een club">
    <button class="wis" id="wis" type="button" aria-label="Zoekveld wissen" hidden>✕</button>
  </div>
</div>

<main id="app"></main>

<button class="cta" id="cta" type="button" hidden></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<nav class="tabbar" aria-label="Hoofdnavigatie"></nav>

<script src="app-data.js"></script>
<script src="groundhop.js"></script>
<script>
/* Toevoegen werkt op twee manieren.

   Met server.py (je laptop) is dit het echte paneel: zoeken bij Transfermarkt
   terwijl je typt, het speelschema per seizoen, en opslaan via
   /api/tm/toevoegen. De server haalt daarna uitslag, opstelling en goals op en
   bouwt de app-data opnieuw.

   Zonder server (de live site) kan dat niet: ophalen en opslaan draaien in
   Python op je laptop. Dan blader je door je eigen verzameling, en zegt het
   scherm waar toevoegen wél kan. */

const app   = document.getElementById('app');
const veld  = document.getElementById('zoek');
const wis   = document.getElementById('wis');
const cta   = document.getElementById('cta');
const terug = document.getElementById('terug');
const terugLabel = document.getElementById('terug-label');
const toast = document.getElementById('toast');
tabbalk('meer', true);

// Transfermarkt nummert een seizoen naar het jaar waarin het begint, en het
// seizoen kantelt in juli.
const NU = new Date();
const HUIDIG = NU.getMonth() >= 6 ? NU.getFullYear() : NU.getFullYear() - 1;
const VANDAAG = `${NU.getFullYear()}-${String(NU.getMonth() + 1).padStart(2, '0')}-${String(NU.getDate()).padStart(2, '0')}`;

const EIGEN = (window.APP?.clubs || []).map(c => ({...c, seasons: [...new Set(APP.matches
  .filter(m => m.hid === c.id || m.aid === c.id).map(m => m.season))].sort((a, b) => b - a)}));

const S = {
  server: false,        // draait server.py?
  bron: null,           // 'transfermarkt' of 'sofascore', volgens de server
  vraag: '',
  tm: {vraag: '', clubs: [], laden: false, fout: ''},
  club: null,           // {id, name, crest, count, seasons}
  seizoen: HUIDIG,
  schema: {sleutel: '', laden: false, fout: '', lijst: []},
  selectie: new Set(),  // Transfermarkt-id's die al in je selectie staan
  gekozen: new Set(),
  bezig: false,
  voorbeeld: false,     // zonder server: laat zien hoe een nieuw duel eruitziet
};

const kanOpslaan = () => S.server && S.bron === 'transfermarkt';
const tmLogo = id => `https://tmssl.akamaized.net/images/wappen/normquad/${id}.png`;
const eigenClub = id => EIGEN.find(c => c.id === id);
function crestVan(id){
  const c = eigenClub(id);
  if (c?.crest) return c.crest;
  // Een club die je nog nooit zag heeft geen logo in je export. Op
  // Transfermarkt heeft elke club er een op een vast adres.
  return kanOpslaan() ? tmLogo(id) : null;
}

async function api(pad, opties){
  try {
    const r = await fetch(pad, opties);
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

function melding(tekst, lang){
  toast.textContent = tekst;
  toast.classList.add('zien');
  clearTimeout(melding.t);
  melding.t = setTimeout(() => toast.classList.remove('zien'), lang ? 6000 : 3200);
}

async function laadSelectie(){
  const d = await api('/api/tm/selectie');
  if (d && Array.isArray(d.ids)) S.selectie = new Set(d.ids);
}

// ── Zoeken ─────────────────────────────────────────────────────────────────

function zoekEigen(vraag){
  const q = plat(vraag);
  return EIGEN.filter(c => plat(c.name).includes(q)).sort((a, b) => {
    const va = plat(a.name).startsWith(q), vb = plat(b.name).startsWith(q);
    return va === vb ? b.count - a.count : (va ? -1 : 1);
  }).slice(0, 8);
}

/* Bij Transfermarkt zoeken pas als je even stopt met typen, en een antwoord
   op een oudere vraag negeren: anders springt de lijst heen en weer. */
function zoekTransfermarkt(vraag){
  clearTimeout(zoekTransfermarkt.t);
  if (!kanOpslaan() || vraag.length < 2){ S.tm = {vraag, clubs: [], laden: false, fout: ''}; return; }
  S.tm = {vraag, clubs: [], laden: true, fout: ''};
  zoekTransfermarkt.t = setTimeout(async () => {
    const d = await api(`/tm/zoek/${encodeURIComponent(vraag)}`);
    if (S.tm.vraag !== vraag) return;
    // Onbereikbaar is iets anders dan niets gevonden.
    S.tm = {vraag, laden: false, clubs: d?.clubs || [],
            fout: !d || d.error ? 'Transfermarkt is nu niet bereikbaar. Probeer het zo nog eens.' : ''};
    if (!S.club) render();
  }, 350);
}

function clubRij(c, sub){
  return `
    <button class="club" data-club="${c.id}" data-naam="${esc(c.name)}" type="button">
      ${logo(c.crest ?? crestVan(c.id), c.name, true)}
      <span class="club-naam">${esc(c.name)}${sub ? `<span class="lijst-sub">${sub}</span>` : ''}</span>
      ${c.count ? `<span class="club-tal">${c.count}×</span>` : ''}
      <span class="chev" aria-hidden="true">›</span>
    </button>`;
}

function handmatig(){
  return `
    <section class="card">
      <button class="club" type="button" data-handmatig="1">
        <span class="crest-fallback mini" aria-hidden="true">+</span>
        <span class="club-naam">Zelf invullen</span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
      <div class="note">Voor interlands en toernooiduels die onder geen club vallen —
        Italië–Albanië op het EK 2024 bijvoorbeeld.</div>
    </section>`;
}

/* Waar toevoegen wél kan, als het hier niet kan. */
function uitleg(){
  if (kanOpslaan()) return '';
  const tekst = S.server
    ? `Je dashboard leest nog uit Sofascore. Toevoegen gaat via Transfermarkt; wissel eerst om
       met <code>python3 transfermarkt_vergelijk.py --vervang</code>.`
    : `Toevoegen gebeurt op je laptop: start <code>python3 server.py</code> en open
       <b>localhost:4000</b>. Daar zoekt dit scherm bij Transfermarkt en slaat het op.
       Hier blader je door je eigen verzameling.`;
  return `<section class="card"><div class="note" style="border-top:0">${tekst}</div></section>`;
}

function zoekscherm(){
  if (!S.vraag){
    return uitleg() + `
      <section class="card">
        <div class="card-head"><h2>Vaakst bezocht</h2></div>
        ${EIGEN.slice(0, 8).map(c => clubRij(c)).join('')}
        <div class="note">${EIGEN.length} clubs in je verzameling, ${APP.totals.matches} duels.
          ${kanOpslaan() ? 'Typ om bij Transfermarkt te zoeken, ook naar clubs die je nog nooit zag.' : ''}</div>
      </section>` + handmatig();
  }
  const eigen = zoekEigen(S.vraag);
  const eigenIds = new Set(eigen.map(c => c.id));
  let tm = '';
  if (kanOpslaan()){
    const rest = S.tm.clubs.filter(c => !eigenIds.has(c.id));
    tm = `
      <section class="card">
        <div class="card-head"><h2>Alle clubs</h2><span class="kop-tel">Transfermarkt</span></div>
        ${S.tm.laden ? '<div class="note" style="border-top:0">Zoeken bij Transfermarkt…</div>'
          : S.tm.fout ? `<div class="note" style="border-top:0">${S.tm.fout}</div>`
          : S.vraag.length < 2 ? '<div class="note" style="border-top:0">Typ nog een letter.</div>'
          : rest.length ? '<div style="height:6px"></div>' + rest.map(c => clubRij(c)).join('')
          : `<div class="note" style="border-top:0">${eigen.length ? 'Geen andere clubs gevonden.'
               : `Niets gevonden voor “${esc(S.vraag)}”.`}</div>`}
      </section>`;
  }
  return uitleg() + (eigen.length ? `
    <section class="card">
      <div class="card-head"><h2>In je verzameling</h2>
        <span class="kop-tel">${eigen.length === 1 ? '1 club' : eigen.length + ' clubs'}</span></div>
      ${eigen.map(c => clubRij(c)).join('')}
    </section>` : (kanOpslaan() ? '' : `<section class="card"><div class="note" style="border-top:0">
      Geen club in je verzameling voor “${esc(S.vraag)}”.</div></section>`)) + tm + handmatig();
}

// ── Speelschema ────────────────────────────────────────────────────────────

/* Op de speelschemapagina staat alleen de tegenstander; de kant zegt wie
   thuis speelde. */
function alsRij(w){
  const zelf = S.club, tegen = (w.clubs || [])[0] || {id: null, name: '?'};
  const [h, a] = w.kant === 'uit' ? [tegen, zelf] : [zelf, tegen];
  const gespeeld = !!w.uitslag;
  return {
    id: w.match_id, date: w.date,
    home: h.name, away: a.name,
    home_crest: h.id ? crestVan(h.id) : null, away_crest: a.id ? crestVan(a.id) : null,
    score: gespeeld ? w.uitslag.replace(':', '–') : '',
    tournament: gespeeld ? (w.kant === 'uit' ? 'uit' : 'thuis')
              : (w.date >= VANDAAG ? 'nog te spelen' : 'geen uitslag'),
    label: `${h.name} - ${a.name}`,
  };
}

async function laadSchema(){
  const sleutel = `${S.club.id}/${S.seizoen}`;
  S.schema = {sleutel, laden: true, fout: '', lijst: []};
  render();
  const d = await api(`/tm/club/${sleutel}`);
  if (S.schema.sleutel !== sleutel) return;
  S.schema = {sleutel, laden: false,
    fout: !d || d.error ? 'Transfermarkt is nu niet bereikbaar. Probeer het zo nog eens.' : '',
    lijst: (d?.matches || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(alsRij)};
  render();
}

// Zonder server: de duels uit je eigen export.
function eigenSchema(){
  return APP.matches.filter(m => (m.hid === S.club.id || m.aid === S.club.id) && m.season === S.seizoen)
    .map(m => ({...alsDuel(m), id: m.id, label: ''}));
}

function seizoenen(){
  if (kanOpslaan()) return Array.from({length: 25}, (_, i) => HUIDIG - i);
  return S.club.seasons.length ? S.club.seasons : [HUIDIG];
}

const opgeslagen = r => kanOpslaan() ? S.selectie.has(r.id) : !S.voorbeeld;

function duelRij(r){
  if (opgeslagen(r)) return duel(r, {
    tag: 'div',
    attrs: ` aria-label="${esc(r.home)} tegen ${esc(r.away)}, staat in je verzameling"`,
    eind: '<span class="bol mijn" aria-hidden="true">✓</span>',
  });
  const aan = S.gekozen.has(r.id);
  return duel(r, {
    tag: 'button',
    attrs: ` type="button" aria-pressed="${aan}" data-duel="${r.id}"`,
    eind: `<span class="bol ${aan ? 'aan' : 'leeg'}" aria-hidden="true">${aan ? '✓' : ''}</span>`,
  });
}

function lijst(){ return kanOpslaan() ? S.schema.lijst : eigenSchema(); }

function kopTekst(){
  const l = lijst();
  if (S.gekozen.size) return `${S.gekozen.size} gekozen`;
  const binnen = l.filter(opgeslagen).length;
  return l.length ? `${binnen} van ${l.length} in je verzameling` : '';
}

function clubscherm(){
  const c = S.club;
  const l = lijst();
  let inhoud;
  if (kanOpslaan() && S.schema.laden) inhoud = '<div class="note" style="border-top:0">Speelschema ophalen…</div>';
  else if (kanOpslaan() && S.schema.fout) inhoud = `<div class="note" style="border-top:0">${S.schema.fout}</div>`;
  else if (!l.length) inhoud = `<div class="note" style="border-top:0">${kanOpslaan()
      ? 'Geen wedstrijden gevonden in dit seizoen.' : 'Geen duels van deze club in dit seizoen.'}</div>`;
  else inhoud = l.map(duelRij).join('');

  return uitleg() + `
    <section class="card">
      <div class="clubkop">
        ${logo(c.crest ?? crestVan(c.id), c.name)}
        <div style="min-width:0">
          <div class="clubkop-naam">${esc(c.name)}</div>
          <div class="clubkop-sub">${c.count ? `${c.count} duels bijgewoond` : 'Nog niet in je verzameling'}</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Speelschema</h2>
        <span class="kop-tel">${kopTekst()}</span>
      </div>
      <div class="chips" role="group" aria-label="Seizoen">
        ${seizoenen().map(j => `
          <button type="button" data-seizoen="${j}" aria-pressed="${j === S.seizoen}">
            ${seizoenLabel(j)}</button>`).join('')}
      </div>
      ${inhoud}
      ${kanOpslaan() ? '' : `
      <div class="demo">
        <span>Voorbeeld: zo ziet een duel eruit dat er nog niet in staat</span>
        <div class="seg" role="group" aria-label="Voorbeeldtoestand">
          <button type="button" data-voorbeeld="0" aria-pressed="${!S.voorbeeld}">bijgewoond</button>
          <button type="button" data-voorbeeld="1" aria-pressed="${S.voorbeeld}">nieuw</button>
        </div>
      </div>`}
    </section>`;
}

// ── Scherm ─────────────────────────────────────────────────────────────────

function render(){
  app.innerHTML = S.club ? clubscherm() : zoekscherm();
  wis.hidden = !S.vraag;
  terugLabel.textContent = S.club && !param('club') ? 'Zoeken' : (TITELS[vorigeScherm()] || 'Home');
  document.getElementById('titel').textContent = S.club ? 'Speelschema' : 'Toevoegen';
  bijwerken();
}

function bijwerken(){
  const n = S.gekozen.size;
  cta.hidden = n === 0;
  cta.disabled = S.bezig;
  cta.textContent = S.bezig ? 'Opslaan…' : n === 1 ? '1 duel toevoegen' : `${n} duels toevoegen`;
  document.body.classList.toggle('met-cta', n > 0);
  const tel = document.querySelector('.kop-tel');
  if (tel && S.club) tel.textContent = kopTekst();
}

function kiesClub(c){
  S.club = c;
  S.gekozen.clear();
  S.seizoen = kanOpslaan() ? HUIDIG : (c.seasons?.[0] ?? HUIDIG);
  veld.value = ''; S.vraag = ''; veld.blur();
  if (kanOpslaan()) laadSchema(); else render();
  app.scrollTop = 0;
}

veld.addEventListener('input', () => {
  S.vraag = veld.value.trim();
  if (S.vraag){ S.club = null; S.gekozen.clear(); }
  zoekTransfermarkt(S.vraag);
  render();
  app.scrollTop = 0;
});
veld.addEventListener('keydown', e => { if (e.key === 'Escape') leeg(); });
function leeg(){ veld.value = ''; S.vraag = ''; zoekTransfermarkt(''); veld.focus(); render(); }
wis.addEventListener('click', leeg);

terug.addEventListener('click', () => {
  // Kwam je vanaf een clubpagina, dan gaat terug daarheen en niet naar zoeken.
  if (S.club && !param('club')){ S.club = null; S.gekozen.clear(); render(); }
  else if (vorigeScherm() && history.length > 1) history.back();
  else location.href = 'index.html';
});

app.addEventListener('click', e => {
  const knop = e.target.closest('[data-club]');
  if (knop){
    const id = Number(knop.dataset.club);
    kiesClub(eigenClub(id) || {id, name: knop.dataset.naam, crest: null, count: 0, seasons: []});
    return;
  }
  const jaar = e.target.closest('[data-seizoen]');
  if (jaar){
    S.seizoen = Number(jaar.dataset.seizoen); S.gekozen.clear();
    if (kanOpslaan()) laadSchema(); else render();
    return;
  }
  const rij = e.target.closest('[data-duel]');
  if (rij){
    const id = Number(rij.dataset.duel);
    const aan = !S.gekozen.has(id);
    aan ? S.gekozen.add(id) : S.gekozen.delete(id);
    rij.setAttribute('aria-pressed', String(aan));
    const bol = rij.querySelector('.bol');
    bol.className = 'bol ' + (aan ? 'aan' : 'leeg');
    bol.textContent = aan ? '✓' : '';
    bijwerken();
    return;
  }
  const vb = e.target.closest('[data-voorbeeld]');
  if (vb){ S.voorbeeld = vb.dataset.voorbeeld === '1'; S.gekozen.clear(); render(); return; }

  if (e.target.closest('[data-handmatig]')){
    melding('Zelf invullen kan nog niet in dit scherm.');
  }
});

/* Opslaan stuurt alleen het nummer, de datum en een naam om te herkennen. De
   rest haalt de server zelf uit het wedstrijdrapport. */
cta.addEventListener('click', async () => {
  if (!kanOpslaan()){
    melding('Opslaan kan alleen op je laptop, met python3 server.py.', true);
    return;
  }
  if (S.bezig || !S.gekozen.size) return;
  const keuze = S.schema.lijst.filter(r => S.gekozen.has(r.id));
  S.bezig = true; bijwerken();
  const res = await api('/api/tm/toevoegen', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(keuze.map(r => ({match_id: r.id, date: r.date || '', label: r.label}))),
  });
  S.bezig = false;
  if (!res){ bijwerken(); melding('Opslaan is niet gelukt. Draait server.py nog?', true); return; }
  if (res.error){ bijwerken(); melding(res.error, true); return; }
  await laadSelectie();
  S.gekozen.clear();
  render();
  const nogTeSpelen = keuze.filter(r => !r.score).length;
  melding(res.added
    ? `${res.added} ${res.added === 1 ? 'duel' : 'duels'} toegevoegd. Uitslag en opstelling worden nu opgehaald.`
      + (nogTeSpelen ? ' Een duel dat nog gespeeld moet worden, komt binnen zodra het gespeeld is.' : '')
    : `${res.already === 1 ? 'Dat duel stond' : 'Die duels stonden'} er al in.`, true);
  if (res.fetching) volgOphalen();
});

/* Na het opslaan haalt de server de wedstrijden op en bouwt de app-data
   opnieuw. Zeg het als dat klaar is, zodat je weet wanneer je Home ververst. */
async function volgOphalen(){
  const s = await api('/api/sync-status');
  if (s?.running){ setTimeout(volgOphalen, 3000); return; }
  if (s?.error) melding(`Ophalen stopte: ${s.error}`, true);
  else melding('Klaar: de nieuwe duels staan in je verzameling.', true);
}

async function start(){
  if (!window.APP){ app.innerHTML = zonderData('toevoegen.html'); return; }
  const b = await api('/api/bron');
  S.server = !!b?.bron;
  S.bron = b?.bron || null;
  if (S.server) await laadSelectie();
  const vooraf = eigenClub(Number(param('club')));
  if (vooraf) kiesClub(vooraf); else render();
}
start();
</script>
