  return null;
}

// ─── TAB: WEDSTRIJDEN ──────────────────────────────────────────────────────
const MATCH_SPECIALS=[
  {k:'injury', l:'+90', title:'Blessuretijdgoal', color:'#ff9500'},
  {k:'red',    l:'Rood',title:'Rode kaart',       color:'#ff3b30'},
  {k:'pen',    l:'Pen', title:'Strafschop',        color:'#5856d6'},
  {k:'own',    l:'OD',  title:'Eigen doelpunt',    color:'#34c759'},
];
const mHasInjury=m=>{
  const injGs=(m.goals||[]).filter(g=>g.minute>=90&&(g.added_time||0)>0);
  if(!injGs.length)return false;
  const normGs=(m.goals||[]).filter(g=>!(g.minute>=90&&(g.added_time||0)>0));
  let nh=0,na=0;
  normGs.forEach(g=>{const isHome=g.team===m.home_team?.name;if(g.type==='ownGoal'){if(isHome)na++;else nh++;}else{if(isHome)nh++;else na++;}});
  const cat=d=>d>0?1:d<0?-1:0;
  return cat((m.home_score??0)-(m.away_score??0))!==cat(nh-na);
};
const mHasRed   =m=>(m.cards||[]).some(c=>c.type==='red'||c.type==='yellowRed');
const mHasPen   =m=>(m.goals||[]).some(g=>g.type==='penalty');
const mHasOwn   =m=>(m.goals||[]).some(g=>g.type==='ownGoal');
const mFlags    =m=>{const f=[];if(mHasInjury(m))f.push('injury');if(mHasRed(m))f.push('red');if(mHasPen(m))f.push('pen');if(mHasOwn(m))f.push('own');return f;};

const UEFA_COLORS={
  'UEFA Champions League':{border:'#1A4FBE',tint:'rgba(26,79,190,0.07)',tintDark:'rgba(26,79,190,0.10)',label:'UCL'},
  'UEFA Europa League':   {border:'#F05A28',tint:'rgba(240,90,40,0.07)', tintDark:'rgba(240,90,40,0.10)', label:'UEL'},
  'UEFA Conference League':{border:'#00A94F',tint:'rgba(0,169,79,0.07)',  tintDark:'rgba(0,169,79,0.10)',  label:'UECL'},
};
const uefaColor=m=>UEFA_COLORS[m.tournament]||null;

function TabWedstrijden({data}){
  const [q,setQ]=useState('');
  const [comp,setComp]=useState('all');
  const [specials,setSpecials]=useState([]);

  const matches=useMemo(()=>[...(data.matches||[])].sort((a,b)=>b.startTimestamp-a.startTimestamp),[data]);

  const comps=useMemo(()=>{
    const s=new Set(matches.map(m=>m.tournament).filter(Boolean));
    return[...s].sort();
  },[matches]);

  const toggleSpecial=k=>setSpecials(prev=>prev.includes(k)?prev.filter(x=>x!==k):[...prev,k]);

  const filtered=useMemo(()=>matches.filter(m=>{
    if(comp!=='all'&&m.tournament!==comp)return false;
    if(specials.includes('injury')&&!mHasInjury(m))return false;
    if(specials.includes('red')&&!mHasRed(m))return false;
    if(specials.includes('pen')&&!mHasPen(m))return false;
    if(specials.includes('own')&&!mHasOwn(m))return false;
    if(q){
      const ql=q.toLowerCase();
      if(!(
        m.home_team?.name?.toLowerCase().includes(ql)||
        m.away_team?.name?.toLowerCase().includes(ql)||
        m.tournament?.toLowerCase().includes(ql)||
        m.venue?.name?.toLowerCase().includes(ql)||
        m.venue?.city?.toLowerCase().includes(ql)
      ))return false;
    }
    return true;
  }),[matches,q,comp,specials]);

  // Groepeer op jaar-maand
  const grouped=useMemo(()=>{
    const map=new Map();
    filtered.forEach(m=>{
      const key=m.date?.slice(0,7)||'';
      if(!map.has(key))map.set(key,[]);
      map.get(key).push(m);
    });
    return[...map.entries()];
  },[filtered]);

  const fMonth=key=>{if(!key)return'';const[y,mo]=key.split('-');return`${MND[parseInt(mo)-1]} ${y}`;};

  return html`<div style=${{display:'flex',flexDirection:'column',gap:12}}>
    <${SearchInput} value=${q} onChange=${setQ} placeholder="Zoek wedstrijd, club, stad..." />

    <!-- Competitie dropdown -->
    <div style=${{position:'relative'}}>
      <select value=${comp} onChange=${e=>setComp(e.target.value)} aria-label="Competitie filteren" style=${{
        width:'100%',padding:'9px 12px',borderRadius:12,border:`1px solid ${comp!=='all'?T.blue:T.border}`,
        background:comp!=='all'?isDark?'rgba(10,132,255,0.15)':'#e8f4ff':T.bg2,
        color:comp!=='all'?T.blue:T.text,
        fontSize:13,fontWeight:comp!=='all'?600:400,appearance:'none',cursor:'pointer',outline:'none',
      }}>
        <option value="all">Alle competities</option>
        ${comps.map(c=>html`<option key=${c} value=${c}>${c}</option>`)}
      </select>
      ${comp!=='all'&&html`<button onClick=${()=>setComp('all')} aria-label="Competitiefilter verwijderen" style=${{
        position:'absolute',right:4,top:'50%',transform:'translateY(-50%)',
        background:'none',border:'none',cursor:'pointer',color:T.blue,fontSize:16,
        width:44,height:44,display:'flex',alignItems:'center',justifyContent:'center',
      }}>×</button>`}
    </div>

    <!-- Bijzonderheden chips -->
    <div style=${{display:'flex',gap:6,flexWrap:'wrap'}}>
      ${MATCH_SPECIALS.map(s=>{
        const active=specials.includes(s.k);
        return html`<button key=${s.k} onClick=${()=>toggleSpecial(s.k)} title=${s.title} aria-label=${s.title} style=${{
          background:active?s.color:'transparent',
          color:active?'#fff':T.muted,
          border:`1.5px solid ${active?s.color:T.border}`,
          borderRadius:999,padding:'5px 12px',fontSize:12,fontWeight:700,
          cursor:'pointer',transition:'all 0.15s ease',
        }}>${s.l}</button>`;
      })}
    </div>

    <div style=${{fontSize:12,color:T.muted}}>${filtered.length} wedstrijden</div>

    ${grouped.map(([key,ms])=>html`<div key=${key}>
      <div style=${{fontSize:12,fontWeight:700,color:T.muted,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8,marginTop:4}}>
        ${fMonth(key)}
      </div>
      <${Card}>
        ${ms.map((m,i)=>{
          const htId=m.home_team?.id, atId=m.away_team?.id;
          const flags=mFlags(m);
          const uc=uefaColor(m);
          return html`<div key=${m.id} style=${{
            display:'flex',alignItems:'center',gap:10,
            padding:'10px 0',
            borderBottom:i<ms.length-1?`1px solid ${T.border}`:'none',
            ...(uc?{
              background:isDark?uc.tintDark:uc.tint,
              borderLeft:`3px solid ${uc.border}`,
              paddingLeft:13,
              paddingRight:16,
              marginLeft:-16,
              marginRight:-16,
            }:{}),
          }}>
            <div style=${{fontSize:11,color:T.dim,width:36,flexShrink:0,textAlign:'center'}}>
              ${m.date?.slice(8)}/${m.date?.slice(5,7)}
            </div>
            <div style=${{display:'flex',alignItems:'center',gap:6,flex:1,minWidth:0}}>
              <${TeamBadge} id=${htId} name=${m.home_team?.name} size=${22} />
              <div style=${{flex:1,minWidth:0}}>
                <div style=${{fontSize:13,fontWeight:600,color:T.text,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                  ${m.home_team?.name}
                  <span style=${{color:T.blue,fontWeight:800,margin:'0 4px'}}>${m.home_score??'?'}–${m.away_score??'?'}</span>
                  ${m.away_team?.name}
                </div>
                <div style=${{fontSize:11,color:uc?uc.border:T.dim,marginTop:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',fontWeight:uc?600:400}}>
                  ${m.tournament}${m.venue?.city?` · ${m.venue.city}`:''}
                </div>
                ${flags.length>0&&html`<div style=${{display:'flex',gap:4,flexWrap:'wrap',marginTop:4}}>
                  ${flags.map(fk=>{const sp=MATCH_SPECIALS.find(s=>s.k===fk);return html`<span key=${fk} title=${sp.title} style=${{background:sp.color+'22',color:sp.color,borderRadius:4,padding:'1px 6px',fontSize:10,fontWeight:700}}>${sp.l}</span>`;}) }
                </div>`}
              </div>
              <${TeamBadge} id=${atId} name=${m.away_team?.name} size=${22} />
            </div>
          </div>`;
        })}
      </${Card}>
    </div>`)}
  </div>`;
}

// ─── HOOFD APP ─────────────────────────────────────────────────────────────
const TABS=[
  {id:'spelers',    icon:'person',     label:'Spelers'},
  {id:'clubs',      icon:'building2',  label:'Clubs'},
  {id:'home',       icon:'house',      label:'Home', center:true},
  {id:'wedstrijden',icon:'ball',       label:'Duels'},
  {id:'stadions',   icon:'location',   label:'Stadions'},
  {id:'zoeken',     icon:'searchplus', label:'Zoeken'},
];

function App(){
  const [data,setData]=useState(null);
  const [tab,setTab]=useState('home');
  const [countryFilter,setCountryFilter]=useState('');
  const [detailPlayer,setDetailPlayer]=useState(null);
  const [loading,setLoading]=useState(true);
  const [syncing,setSyncing]=useState(false);
  const [savedIds,setSavedIds]=useState(new Set());
  const fileRef=useRef();

  const scrollPos=useRef({});
  const visitedTabs=useRef(new Set(['home']));
  const navStack=useRef(['home']);
  const backRef=useRef(null);
  const detailFromTab=useRef(null);
  const goBackRef=useRef(null);
  const [swipeDrag,setSwipeDrag]=useState({active:false,x:0,y:0,dx:0,progress:0,completing:false});

  const visibleTabs=TABS.filter(t=>IS_LOCAL||t.id!=='zoeken');

  const goTo=useCallback((id)=>{
    if(id===tab){window.scrollTo({top:0,behavior:'smooth'});return;}
    scrollPos.current[tab]=window.scrollY;
    if(id==='spelers'){setCountryFilter('');setDetailPlayer(null);}
    navStack.current.push(id);
    setTab(id);
  },[tab,visibleTabs]);
  const handlePlayerClick=useCallback((player)=>{
    setDetailPlayer(player);
    scrollPos.current[tab]=window.scrollY;
    visitedTabs.current.delete('spelers');
    detailFromTab.current=tab;
    navStack.current.push('spelers');
    setTab('spelers');
  },[tab]);

  // Laad opgeslagen match-IDs eenmalig en herlaad na elke save
  const reloadSavedIds=useCallback(()=>{
    // Een wedstrijd kan onder twee nummers bekend zijn: het eigen id van de
    // bron waaruit hij komt, en — bij een uit Transfermarkt gehaalde wedstrijd —
    // het Sofascore-id van de koppeling. Het zoektabblad zoekt bij Sofascore,
    // dus zonder dat tweede nummer zou het elke al opgehaalde wedstrijd
    // opnieuw als nieuw aanbieden.
    apiFetch('/data/selected_matches.json').then(ms=>{
      if(ms)setSavedIds(new Set(ms.flatMap(m=>[m.id,m.sofascore_id]).filter(id=>id!=null)));
    });
  },[]);

  const handleCountryClick=useCallback((a2)=>{
    scrollPos.current[tab]=window.scrollY;
    visitedTabs.current.delete('spelers');
    setCountryFilter(a2);
    navStack.current.push('spelers');
    setTab('spelers');
  },[tab]);
  const registerBack=useCallback(fn=>{backRef.current=fn;},[]);
  const clearBack=useCallback(()=>{backRef.current=null;},[]);
  const goBack=useCallback(()=>{
    if(backRef.current){
      const origin=detailFromTab.current;
      backRef.current();
      detailFromTab.current=null;
      if(origin&&origin!==tab){
        if(navStack.current.length>1)navStack.current.pop();
        setDetailPlayer(null);
        setTab(origin);
      }
      return;
    }
    if(navStack.current.length>1){
      navStack.current.pop();
      const prev=navStack.current[navStack.current.length-1];
      setDetailPlayer(null);
      setTab(prev);
    }
  },[tab]);
  goBackRef.current=goBack;

  useEffect(()=>{reloadSavedIds();},[]);

  useEffect(()=>{
    if(visitedTabs.current.has(tab)){
      window.scrollTo({top:scrollPos.current[tab]||0,behavior:'instant'});
    }else{
      window.scrollTo({top:0,behavior:'instant'});
      visitedTabs.current.add(tab);
    }
  },[tab]);

  useEffect(()=>{
    apiFetch('/data/dashboard_data.json').then(d=>{
      if(d&&d.total_matches!=null){setData(d);setLoading(false);}
      else{setLoading(false);}
    }).catch(()=>setLoading(false));
  },[]);

  useEffect(()=>{
    const EDGE=22,THRESHOLD=62;
    let sx=0,sy=0,edge=false;
    function onStart(e){
      const t=e.touches[0];
      if(t.clientX>EDGE){edge=false;return;}
      edge=true;sx=t.clientX;sy=t.clientY;
      setSwipeDrag({active:true,x:t.clientX,y:t.clientY,dx:0,progress:0,completing:false});
    }
    function onMove(e){
      if(!edge)return;
      const t=e.touches[0];
      const dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);
      if(dx<0||dy>dx+20){edge=false;setSwipeDrag({active:false,x:0,y:0,dx:0,progress:0,completing:false});return;}
      const progress=Math.min(dx/THRESHOLD,1.15);
      setSwipeDrag({active:true,x:t.clientX,y:t.clientY,dx,progress,completing:false});
      if(dx>16)e.preventDefault();
    }
    function onEnd(e){
      if(!edge)return;
      edge=false;
      const dx=e.changedTouches[0].clientX-sx;
      if(dx>=THRESHOLD){
        setSwipeDrag(s=>({...s,completing:true,dx:window.innerWidth*1.4}));
        setTimeout(()=>{goBackRef.current&&goBackRef.current();setSwipeDrag({active:false,x:0,y:0,dx:0,progress:0,completing:false});},200);
      }else{
        setSwipeDrag({active:false,x:0,y:0,dx:0,progress:0,completing:false});
      }
    }
    window.addEventListener('touchstart',onStart,{passive:true});
    window.addEventListener('touchmove',onMove,{passive:false});
    window.addEventListener('touchend',onEnd,{passive:true});
    return()=>{window.removeEventListener('touchstart',onStart);window.removeEventListener('touchmove',onMove);window.removeEventListener('touchend',onEnd);};
  },[]);

  function handleFile(file){
    if(!file)return;
    const r=new FileReader();
    r.onload=e=>{try{setData(JSON.parse(e.target.result));}catch{alert('Ongeldig JSON bestand');}};
    r.readAsText(file);
  }

  function handleMatchesAdded(){
    apiFetch('/data/dashboard_data.json').then(d=>{if(d&&d.total_matches!=null)setData(d);});
  }

  async function triggerSync(){
    setSyncing(true);
    await fetch('/api/sync',{method:'POST'}).catch(()=>{});
    setTimeout(()=>setSyncing(false),2000);
  }

  if(loading) return html`<div style=${{minHeight:'100dvh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:20}}>
    <div style=${{position:'relative',width:64,height:64}}>
      <div style=${{
        position:'absolute',inset:0,borderRadius:'50%',
        background:T.bg2,backdropFilter:T.blur,WebkitBackdropFilter:T.blur,
        border:`1px solid ${T.glassBorder}`,boxShadow:T.shadowGlass,
        display:'flex',alignItems:'center',justifyContent:'center',
      }}>
        <${Icon} name="globe" size=${28} color=${T.blue} />
      </div>
      <div style=${{
        position:'absolute',inset:-4,borderRadius:'50%',
        border:'2px solid transparent',
        borderTopColor:T.blue,borderRightColor:'rgba(0,122,255,0.3)',
        animation:'spin 0.9s linear infinite',
      }}></div>
    </div>
    <div style=${{color:T.muted,fontSize:14,fontWeight:500}}>Laden...</div>
  </div>`;

  if(!data) return html`<div style=${{minHeight:'100dvh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24,gap:24}}>
    <div style=${{textAlign:'center'}}>
      <div style=${{
        width:72,height:72,borderRadius:22,margin:'0 auto 16px',
        background:T.bg2,backdropFilter:T.blur,WebkitBackdropFilter:T.blur,
        border:`1px solid ${T.glassBorder}`,boxShadow:T.shadowGlass,
        display:'flex',alignItems:'center',justifyContent:'center',
      }}>
        <${Icon} name="globe" size=${36} color=${T.blue} />
      </div>
      <div style=${{fontSize:30,fontWeight:900,letterSpacing:'-0.02em',color:T.text}}>
        <span style=${{color:T.green}}>Ground</span>Hop
      </div>
      <div style=${{fontSize:14,color:T.muted,marginTop:6}}>Jouw persoonlijke voetbalarchief</div>
    </div>
    <${Card} style=${{width:'100%',maxWidth:400,textAlign:'center',padding:32,border:'1px solid rgba(0,122,255,0.18)'}}>
      <div style=${{marginBottom:16,display:'flex',justifyContent:'center'}}>
        <${Icon} name="folder" size=${44} color=${T.blue} />
      </div>
      <div style=${{fontWeight:700,fontSize:18,marginBottom:8,color:T.text}}>Geen data gevonden</div>
      ${IS_LOCAL
        ?html`<div style=${{color:T.muted,fontSize:13,marginBottom:20}}>
          Klik hieronder om <code>dashboard_data.json</code> te kiezen,<br/>of gebruik <code>example_data/dashboard_data.json</code> om te testen.
        </div>
        <button onClick=${()=>fileRef.current.click()} style=${{
          background:T.blue,color:'#fff',border:'none',borderRadius:14,padding:'14px 28px',
          fontSize:16,fontWeight:700,cursor:'pointer',width:'100%',
          boxShadow:'0 4px 16px rgba(0,122,255,0.35)',
        }}>Bestand kiezen</button>
        <input ref=${fileRef} type="file" accept=".json" onChange=${e=>handleFile(e.target.files[0])} style=${{display:'none'}} />`
        :html`<div style=${{color:T.muted,fontSize:13}}>
          De data is nog niet gesynchroniseerd.<br/>Sync lokaal en push naar git.
        </div>`}
    </${Card}>
    ${IS_LOCAL&&html`<div style=${{color:T.dim,fontSize:12,textAlign:'center',lineHeight:1.6}}>
      Geen data? Gebruik eerst:<br/>
      <code style=${{color:T.blue}}>python3 sofascore_tracker.py</code>
    </div>`}
  </div>`;

  let content;
  if(tab==='home')        content=html`<${TabHome}        data=${data} onCountryClick=${handleCountryClick} onPlayerClick=${handlePlayerClick} />`;
  if(tab==='spelers')     content=html`<${TabSpelers}     data=${data} initCountry=${countryFilter} initPlayer=${detailPlayer} onRegisterBack=${registerBack} onClearBack=${clearBack} />`;
  if(tab==='clubs')       content=html`<${TabClubs}       data=${data} onRegisterBack=${registerBack} onClearBack=${clearBack} />`;
  if(tab==='wedstrijden') content=html`<${TabWedstrijden} data=${data} />`;
  if(tab==='stadions')    content=html`<${TabStadions}    data=${data} />`;
  if(tab==='zoeken')      content=html`<${TabZoeken}      onMatchesAdded=${handleMatchesAdded} savedIds=${savedIds} onSaved=${reloadSavedIds} />`;

  return html`<div style=${{display:'flex',flexDirection:'column',minHeight:'100dvh'}}>
    <!-- Header: Liquid Glass -->
    <div style=${{
      background:T.headerBg,
      backdropFilter:'blur(48px) saturate(220%) brightness(1.10)',
      WebkitBackdropFilter:'blur(48px) saturate(220%) brightness(1.10)',
      padding:'10px 20px',
      borderBottom:`1px solid ${T.glassBorder}`,
      boxShadow:'0 1px 0 rgba(0,0,0,0.04)',
      display:'flex',alignItems:'center',justifyContent:'space-between',
      position:'sticky',top:0,zIndex:10,
    }}>
      <div>
        <div style=${{fontWeight:900,fontSize:20,letterSpacing:'-0.02em',color:T.text,lineHeight:1.1}}>
          <span style=${{color:T.green}}>Ground</span>Hop
        </div>
        ${tab!=='home'&&html`<div style=${{fontSize:11,color:T.muted,marginTop:1,fontWeight:500}}>
          ${TABS.find(t=>t.id===tab)?.label||''}
        </div>`}
      </div>
      <div style=${{display:'flex',gap:8,alignItems:'center'}}>
        <div style=${{
          background:`${T.blue}1a`,
          border:`1px solid ${T.blue}29`,
          borderRadius:999,padding:'4px 12px',fontSize:12,fontWeight:700,color:T.blue,
        }}>
          ${data.total_matches} duels
        </div>
        ${IS_LOCAL&&html`<button onClick=${triggerSync} disabled=${syncing} aria-label="Sync starten" title="Sync starten" style=${{
          background:T.bg3,
          backdropFilter:T.blur,WebkitBackdropFilter:T.blur,
          border:`1px solid ${T.glassBorder}`,
          boxShadow:T.shadowGlass,
          color:syncing?T.blue:T.muted,
          cursor:'pointer',borderRadius:10,padding:'7px 9px',
          display:'flex',alignItems:'center',
          transition:'all 0.2s cubic-bezier(0.4,0,0.2,1)',
          animation:syncing?'spin 1s linear infinite':'none',
        }}>
          <${Icon} name="refresh" size=${17} color=${syncing?T.blue:T.muted} />
        </button>`}
      </div>
    </div>

    <!-- Sync Banner -->
    ${IS_LOCAL&&html`<${SyncBanner} />`}

    <!-- Content -->
    <div style=${{flex:1}}>
      <div key=${tab} style=${{
        padding:'16px 16px calc(130px + env(safe-area-inset-bottom,0px))',
        transform:`translateX(${swipeDrag.completing?42:swipeDrag.active?Math.min(swipeDrag.dx*0.11,16):0}px)`,
        transition:swipeDrag.completing?'transform 0.2s ease-out':swipeDrag.active?'none':'transform 0.38s cubic-bezier(0.25,1,0.5,1)',
      }}>
        ${content}
      </div>
    </div>

    <!-- Floating Liquid Glass nav pill — Fotmob-stijl -->
    <nav aria-label="Hoofdnavigatie" style=${{
      position:'fixed',
      bottom:'calc(8px + env(safe-area-inset-bottom,0px))',
      left:'50%',transform:'translateX(-50%)',
      width:'calc(100% - 28px)',maxWidth:460,
      borderRadius:34,
      background:T.navBg,
      backdropFilter:`blur(60px) saturate(280%) brightness(${isDark?'0.90':'1.18'})`,
      WebkitBackdropFilter:`blur(60px) saturate(280%) brightness(${isDark?'0.90':'1.18'})`,
      border:`1px solid ${T.glassBorder}`,
      boxShadow:[
        `inset 0 1.5px 0 rgba(255,255,255,${isDark?'0.10':'0.90'})`,
        `inset 0 -0.5px 0 rgba(255,255,255,${isDark?'0.05':'0.25'})`,
        `inset 0 0 0 0.5px rgba(255,255,255,${isDark?'0.08':'0.35'})`,
        '0 0 0 0.5px rgba(0,0,0,0.06)',
        '0 4px 16px rgba(0,0,0,0.12)',
        '0 16px 48px rgba(0,0,0,0.18)',
        '0 32px 72px rgba(0,0,0,0.14)',
      ].join(','),
      display:'flex',alignItems:'center',
      padding:'5px 5px',
      zIndex:10,
      overflow:'hidden',
    }}>
      <!-- lens highlight -->
      <div style=${{
        position:'absolute',top:0,left:'5%',right:'5%',height:'45%',
        background:`linear-gradient(180deg,rgba(255,255,255,${isDark?'0.08':'0.55'}) 0%,rgba(255,255,255,${isDark?'0.02':'0.12'}) 60%,rgba(255,255,255,0) 100%)`,
        pointerEvents:'none',borderRadius:'32px 32px 60% 60%',
      }}></div>

      ${visibleTabs.map(t=>html`<button key=${t.id} onClick=${()=>goTo(t.id)} aria-label=${t.label} aria-current=${tab===t.id?'page':undefined} style=${{
        flex:t.center?1.3:1,
        border:tab===t.id?`1px solid rgba(255,255,255,${isDark?'0.18':'0.80'})`:'1px solid transparent',
        background:tab===t.id?T.navActiveBg:'transparent',
        backdropFilter:tab===t.id?'blur(12px)':'none',
        WebkitBackdropFilter:tab===t.id?'blur(12px)':'none',
        boxShadow:tab===t.id?[
          `inset 0 1.5px 0 rgba(255,255,255,${isDark?'0.12':'1'})`,
          `inset 0 0 8px rgba(255,255,255,${isDark?'0.06':'0.50'})`,
          '0 2px 10px rgba(0,0,0,0.12)',
        ].join(','):'none',
        cursor:'pointer',
        padding:t.center?'12px 6px':'10px 4px',
        display:'flex',flexDirection:'column',alignItems:'center',gap:3,
        borderRadius:29,
        position:'relative',zIndex:1,
        transition:'all 0.28s cubic-bezier(0.34,1.56,0.64,1)',
        transform:tab===t.id?'scale(1.06)':'scale(1)',
      }}>
        <${Icon}
          name=${t.icon}
          size=${t.center?27:22}
          color=${tab===t.id?T.blue:T.muted}
          sw=${tab===t.id?2:1.5}
        />
        <span style=${{
          fontSize:t.center?10:10,
          fontWeight:tab===t.id?700:500,
          color:tab===t.id?T.blue:T.muted,
          transition:'color 0.2s ease',
          letterSpacing:'0.02em',
        }}>${t.label}</span>
      </button>`)}
    </nav>

    ${swipeDrag.active&&html`<div style=${{
      position:'fixed',
      left:(swipeDrag.completing?window.innerWidth+30:Math.max(-20,swipeDrag.dx*0.55-24))+'px',
      top:(swipeDrag.y-24)+'px',
      zIndex:9999,
      width:48,height:48,
      borderRadius:'50%',
      background:swipeDrag.progress>=1?'rgba(0,122,255,0.92)':'rgba(18,18,22,0.58)',
      backdropFilter:'blur(28px) saturate(200%)',
      WebkitBackdropFilter:'blur(28px) saturate(200%)',
      border:swipeDrag.progress>=1?'1.5px solid rgba(0,122,255,0.70)':'1.5px solid rgba(255,255,255,0.22)',
      boxShadow:swipeDrag.progress>=1?'0 4px 24px rgba(0,122,255,0.55)':'0 2px 16px rgba(0,0,0,0.40)',
      display:'flex',alignItems:'center',justifyContent:'center',
      opacity:swipeDrag.completing?0:Math.min(swipeDrag.progress*1.8,1),
      transform:`scale(${swipeDrag.completing?1.15:0.35+swipeDrag.progress*0.65})`,
      transition:swipeDrag.completing?'left 0.2s cubic-bezier(0.4,0,1,1),opacity 0.18s,transform 0.18s':'none',
      pointerEvents:'none',
      willChange:'transform,opacity',
    }}>
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <path d="M14 5L8 11L14 17" stroke="white" strokeWidth=${2+swipeDrag.progress*0.6} strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
    </div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
