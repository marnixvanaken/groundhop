<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<title>GroundHop</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="GroundHop">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-family:'Outfit',system-ui,sans-serif;color:#1d1d1f;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-size:16px;}
body{min-height:100dvh;overflow-x:hidden;background:radial-gradient(ellipse 80% 60% at 15% 0%,rgba(0,122,255,0.22) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 85% 100%,rgba(52,199,89,0.18) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 60% 45%,rgba(175,82,222,0.12) 0%,transparent 65%),radial-gradient(ellipse 40% 35% at 90% 20%,rgba(255,159,10,0.10) 0%,transparent 60%),#e8eaf0;}
button,input,select{font-family:inherit;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);}
input::placeholder{color:#aeaeb2;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:2px;}
.scroll-x{overflow-x:auto;scrollbar-width:none;}
.scroll-x::-webkit-scrollbar{display:none;}
img{display:block;}
a,button,div[onclick]{transition:all 0.2s cubic-bezier(0.4,0,0.2,1);}
@keyframes pulse-blue{0%,100%{opacity:1;}50%{opacity:0.6;}}
@keyframes fadeout{0%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
:focus-visible{outline:2px solid #007aff;outline-offset:2px;border-radius:6px;}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #007aff;outline-offset:2px;}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;}}
@media(prefers-color-scheme:dark){
  body{background:radial-gradient(ellipse 80% 60% at 15% 0%,rgba(0,100,255,0.12) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 85% 100%,rgba(48,209,88,0.10) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 60% 45%,rgba(191,90,242,0.08) 0%,transparent 65%),#1c1c1e;}
  html{color:#f5f5f7;}
}
.mobile-only{display:block;}
.desktop-only{display:none;}
@media(min-width:768px){.mobile-only{display:none;}.desktop-only{display:block;}}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.js"></script>
<script>
const {useState,useMemo,useRef,useEffect,useCallback}=React;
const html=htm.bind(React.createElement);
const IS_LOCAL=location.hostname==='localhost'||location.hostname==='127.0.0.1';

// ─── Design tokens ─────────────────────────────────────────────────────────
const isDark=window.matchMedia?.('(prefers-color-scheme: dark)').matches??false;
const T=isDark?{
  bg0:'#1c1c1e',
  bg1:'rgba(58,58,60,0.85)',
  bg2:'rgba(58,58,60,0.70)',
  bg3:'rgba(58,58,60,0.45)',
  bg4:'rgba(58,58,60,0.25)',
  text:'#f5f5f7',
  muted:'#8e8e93',
  dim:'#636366',
  green:'#30d158',
  greenDark:'#1a7a2e',
  greenGlow:'rgba(48,209,88,0.15)',
  yellow:'#ffd60a',
  red:'#ff453a',
  blue:'#0a84ff',
  purple:'#bf5af2',
  orange:'#ff9f0a',
  teal:'#64d2ff',
  pink:'#ff375f',
  border:'rgba(255,255,255,0.10)',
  glassBorder:'rgba(255,255,255,0.18)',
  blur:'blur(28px) saturate(180%) brightness(0.85)',
  blurHeavy:'blur(48px) saturate(200%) brightness(0.80)',
  shadowGlass:'inset 0 1px 0 rgba(255,255,255,0.08),inset 0 0 0 0.5px rgba(255,255,255,0.06),0 4px 20px rgba(0,0,0,0.40),0 1px 4px rgba(0,0,0,0.25)',
  shadowGlassHover:'inset 0 1px 0 rgba(255,255,255,0.10),inset 0 0 0 0.5px rgba(255,255,255,0.08),0 12px 40px rgba(0,0,0,0.50),0 3px 10px rgba(0,0,0,0.30)',
  shadow:'0 4px 20px rgba(0,0,0,0.30),0 1px 3px rgba(0,0,0,0.20)',
  shadowMd:'0 8px 32px rgba(0,0,0,0.40),0 2px 8px rgba(0,0,0,0.25)',
  card:'rgba(44,44,46,0.72)',
  cardHov:'rgba(54,54,56,0.88)',
  cardBorder:'rgba(255,255,255,0.12)',
  headerBg:'rgba(28,28,30,0.82)',
  navBg:'rgba(44,44,46,0.55)',
  navActiveBg:'rgba(64,64,66,0.75)',
}:{
  bg0:'#e8eaf0',
  bg1:'rgba(255,255,255,0.75)',
  bg2:'rgba(255,255,255,0.55)',
  bg3:'rgba(255,255,255,0.30)',
  bg4:'rgba(255,255,255,0.18)',
  text:'#1d1d1f',
  muted:'#6e6e73',
  dim:'#8e8e93',
  green:'#34c759',
  greenDark:'#248a3d',
  greenGlow:'rgba(52,199,89,0.12)',
  yellow:'#ff9f0a',
  red:'#ff3b30',
  blue:'#007aff',
  purple:'#af52de',
  orange:'#ff6b00',
  teal:'#5ac8fa',
  pink:'#ff2d55',
  border:'rgba(0,0,0,0.07)',
  glassBorder:'rgba(255,255,255,0.75)',
  blur:'blur(28px) saturate(200%) brightness(1.08)',
  blurHeavy:'blur(48px) saturate(240%) brightness(1.12)',
  shadowGlass:'inset 0 1.5px 0 rgba(255,255,255,0.95),inset 0 0 0 0.5px rgba(255,255,255,0.5),0 4px 20px rgba(0,0,0,0.10),0 1px 4px rgba(0,0,0,0.06)',
  shadowGlassHover:'inset 0 1.5px 0 rgba(255,255,255,1),inset 0 0 0 0.5px rgba(255,255,255,0.6),0 12px 40px rgba(0,0,0,0.14),0 3px 10px rgba(0,0,0,0.07)',
  shadow:'0 4px 20px rgba(0,0,0,0.07),0 1px 3px rgba(0,0,0,0.04)',
  shadowMd:'0 8px 32px rgba(0,0,0,0.10),0 2px 8px rgba(0,0,0,0.05)',
  card:'rgba(255,255,255,0.52)',
  cardHov:'rgba(255,255,255,0.66)',
  cardBorder:'rgba(255,255,255,0.78)',
  headerBg:'rgba(232,234,240,0.60)',
  navBg:'rgba(255,255,255,0.18)',
  navActiveBg:'rgba(255,255,255,0.58)',
};
const PIE=[T.blue,T.green,T.purple,T.orange,T.teal,T.yellow,T.red,T.pink];

// ─── Helpers ───────────────────────────────────────────────────────────────
const MND=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const fDate=d=>{if(!d)return'';const[y,m,day]=d.split('-');return`${parseInt(day)} ${MND[parseInt(m)-1]} ${y}`;};
const fAge=(y,d)=>`${y}j ${d}d`;
const fNum=n=>n!=null?n.toLocaleString('nl-NL'):'—';
const fMarket=v=>{if(!v)return'—';if(v>=1000000)return`€${(v/1000000).toFixed(1).replace('.0','')}M`;if(v>=1000)return`€${Math.round(v/1000)}K`;return`€${v}`;};
const pImg=id=>`/img/player/${id}`;
const tImg=id=>`/img/team/${id}`;
const FLAG_FIX={'en':'gb-eng','sx':'gb-sct','nx':'gb-nir','wl':'gb-wls','wa':'gb-wls'};
const fFlag=a2=>{if(!a2)return null;const c=FLAG_FIX[a2.toLowerCase()]||a2.toLowerCase();return`https://flagcdn.com/w40/${c}.png`;};
const goalLabel=t=>t==='penalty'?' (pen)':t==='ownGoal'?' (eg)':'';
const posLabel={G:'Keeper',D:'Verdediger',M:'Middenvelder',F:'Aanvaller'};

async function apiFetch(path){
  try{const r=await fetch(path);if(!r.ok)return null;return r.json();}
  catch{return null;}
}

// ─── Icon system (SF Symbols-inspired) ────────────────────────────────────
function Icon({name,size=24,color='currentColor',sw=1.5}){
  const a={width:size,height:size,viewBox:"0 0 24 24",fill:"none",stroke:color,strokeWidth:sw,strokeLinecap:"round",strokeLinejoin:"round"};
  if(name==='person')       return html`<svg ...${a}><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>`;
  if(name==='building2')    return html`<svg ...${a}><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>`;
  if(name==='house')        return html`<svg ...${a}><path d="M3 12l9-9 9 9"/><path d="M5 10.5V21h5v-5.5h4V21h5V10.5"/></svg>`;
  if(name==='location')     return html`<svg ...${a}><path d="M12 22s-7-5.5-7-12a7 7 0 0114 0c0 6.5-7 12-7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>`;
  if(name==='searchplus')   return html`<svg ...${a}><circle cx="10" cy="10" r="7"/><path d="M20 20l-3-3"/><path d="M7 10h6M10 7v6"/></svg>`;
  if(name==='search')       return html`<svg ...${a}><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>`;
  if(name==='refresh')      return html`<svg ...${a}><path d="M21 12a9 9 0 01-9 9 9 9 0 01-6.4-2.6"/><path d="M3 12a9 9 0 019-9 9 9 0 016.4 2.6"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></svg>`;
  if(name==='warning')      return html`<svg ...${a}><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h16.9a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
  if(name==='check')        return html`<svg ...${a}><polyline points="20 6 9 17 4 12"/></svg>`;
  if(name==='checkfilled')  return html`<svg ...${a}><path d="M22 11.1V12a10 10 0 11-5.9-9.1"/><polyline points="22 4 12 14 9 11"/></svg>`;
  if(name==='close')        return html`<svg ...${a}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
  if(name==='arrowleft')    return html`<svg ...${a}><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>`;
  if(name==='chevronright') return html`<svg ...${a}><polyline points="9 18 15 12 9 6"/></svg>`;
  if(name==='trophy')       return html`<svg ...${a}><path d="M6 9H3V4h3"/><path d="M18 9h3V4h-3"/><path d="M6 9c0 4 2 7 6 7s6-3 6-7"/><path d="M9 21h6"/><path d="M12 16v5"/></svg>`;
  if(name==='clock')        return html`<svg ...${a}><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>`;
  if(name==='globe')        return html`<svg ...${a}><circle cx="12" cy="12" r="9"/><path d="M2 12h20"/><path d="M12 2a15.5 15.5 0 010 20M12 2a15.5 15.5 0 000 20"/></svg>`;
  if(name==='calendar')     return html`<svg ...${a}><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
  if(name==='repeat')       return html`<svg ...${a}><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>`;
  if(name==='stadium')      return html`<svg ...${a}><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/><path d="M3 12h18"/></svg>`;
  if(name==='ball')         return html`<svg ...${a}><circle cx="12" cy="12" r="9"/><path d="M12 7.5l-2 3 2 1.5 3-1 .5-3.5"/><path d="M12 16.5l2-3-2-1.5-3 1-.5 3.5"/><path d="M7.5 9.5l1 1.5-.5 2.5"/><path d="M16.5 9.5l-1 1.5.5 2.5"/></svg>`;
  if(name==='ruler')        return html`<svg ...${a}><path d="M21.3 10.3l-8.6 8.6a1 1 0 01-1.4 0L2.7 10.3a1 1 0 010-1.4l8.6-8.6a1 1 0 011.4 0l8.6 8.6a1 1 0 010 1.4z"/><path d="M7.5 13.5l2-2m1 3l2-2m1 3l2-2"/></svg>`;
  if(name==='cake')         return html`<svg ...${a}><path d="M20 21v-8a2 2 0 00-2-2H6a2 2 0 00-2 2v8"/><path d="M4 16s1-1 2-1 2 2 4 2 2-2 4-2 2 2 4 2 2-1 2-1"/><path d="M2 21h20M12 11V7"/><circle cx="12" cy="5.5" r="1.5"/></svg>`;
  if(name==='list')         return html`<svg ...${a}><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1" fill=${color} stroke="none"/><circle cx="4" cy="12" r="1" fill=${color} stroke="none"/><circle cx="4" cy="18" r="1" fill=${color} stroke="none"/></svg>`;
  if(name==='folder')       return html`<svg ...${a}><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>`;
  if(name==='home')         return html`<svg ...${a}><path d="M3 12l9-9 9 9"/><path d="M9 21V12h6v9"/></svg>`;
  if(name==='plane')        return html`<svg ...${a}><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>`;
  if(name==='users')        return html`<svg ...${a}><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>`;
  if(name==='target')       return html`<svg ...${a}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>`;
  if(name==='flag')         return html`<svg ...${a}><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>`;
  return null;
}

// ─── CSS-only charts ───────────────────────────────────────────────────────
function BarChart({data,valueKey='value',labelKey='name',color,height=120,horizontal}){
  const max=Math.max(...data.map(d=>d[valueKey]||0),1);
  if(horizontal) return html`<div style=${{display:'flex',flexDirection:'column',gap:5}}>
    ${data.map((d,i)=>html`<div key=${i} style=${{display:'flex',alignItems:'center',gap:8}}>
      <div style=${{width:110,fontSize:11,color:T.muted,textAlign:'right',flexShrink:0,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>${d[labelKey]}</div>
      <div style=${{flex:1,height:14,background:T.bg3,borderRadius:3,overflow:'hidden'}}>
        <div style=${{width:`${(d[valueKey]||0)/max*100}%`,height:'100%',background:d.color||color||T.blue,borderRadius:3,transition:'width 0.5s ease'}}></div>
      </div>
      <div style=${{width:28,fontSize:11,fontWeight:700,color:d.color||color||T.blue,textAlign:'right'}}>${d[valueKey]}</div>
    </div>`)}
  </div>`;
  const barMax=height-34;
  return html`<div class="scroll-x"><div style=${{display:'flex',alignItems:'flex-end',gap:3,height,padding:'0 4px',minWidth:data.length*32}}>
    ${data.map((d,i)=>html`<div key=${i} style=${{flex:1,minWidth:28,display:'flex',flexDirection:'column',alignItems:'center',gap:3,height:'100%',justifyContent:'flex-end'}}>
      <div style=${{fontSize:9,color:T.dim,fontWeight:600}}>${d[valueKey]||0}</div>
      <div style=${{width:'100%',background:`linear-gradient(180deg,${color||T.blue},${color||T.blue}88)`,borderRadius:'4px 4px 0 0',height:`${Math.max(Math.round((d[valueKey]||0)/max*barMax),3)}px`}}></div>
      <div style=${{fontSize:9,color:T.dim,textAlign:'center',lineHeight:1.2}}>${d[labelKey]}</div>
    </div>`)}
  </div></div>`;
}

function DonutChart({data,size=120}){
  const total=data.reduce((s,d)=>s+(d.value||0),0)||1;
  let deg=0;
  const segs=data.map((d,i)=>{const pct=(d.value||0)/total*360;const s=deg;deg+=pct;return{...d,start:s,end:deg,color:PIE[i%8]};});
  const gradient=segs.map(s=>`${s.color} ${s.start}deg ${s.end}deg`).join(',');
  return html`<div style=${{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
    <div style=${{width:size,height:size,borderRadius:'50%',background:`conic-gradient(${gradient})`,flexShrink:0,position:'relative'}}>
      <div style=${{position:'absolute',inset:size*0.22+'px',borderRadius:'50%',background:T.bg2}}></div>
    </div>
    <div style=${{display:'flex',flexDirection:'column',gap:5}}>
      ${segs.map((s,i)=>html`<div key=${i} style=${{display:'flex',alignItems:'center',gap:8,fontSize:12}}>
        <div style=${{width:10,height:10,borderRadius:2,background:s.color,flexShrink:0}}></div>
        <span style=${{color:T.muted}}>${s.name}</span>
        <strong style=${{color:T.text,marginLeft:'auto',paddingLeft:8}}>${s.value}</strong>
      </div>`)}
    </div>
  </div>`;
}

// ─── Base UI ───────────────────────────────────────────────────────────────
function Card({children,onClick,style,glow}){
  const [hovered,setHovered]=useState(false);
  return html`<div
    onClick=${onClick}
    onMouseEnter=${()=>setHovered(true)}
    onMouseLeave=${()=>setHovered(false)}
    style=${{
      background:hovered&&onClick?T.cardHov:T.card,
      backdropFilter:T.blurHeavy,
      WebkitBackdropFilter:T.blurHeavy,
      borderRadius:20,
      padding:16,
      border:`1px solid ${T.cardBorder}`,
      boxShadow:glow
        ?`inset 0 0 0 1px rgba(52,199,89,0.2),${hovered&&onClick?T.shadowGlassHover:T.shadowGlass}`
        :hovered&&onClick?T.shadowGlassHover:T.shadowGlass,
      cursor:onClick?'pointer':'default',
      transition:'box-shadow 0.25s cubic-bezier(0.4,0,0.2,1),transform 0.25s cubic-bezier(0.34,1.56,0.64,1)',
      transform:hovered&&onClick?'translateY(-1px)':'none',
      ...style
    }}
  >${children}</div>`;
}

function Pill({children,active,color,onClick,size}){
  const fs=size==='sm'?10:12;
  return html`<button onClick=${onClick} style=${{
    background:active?(color||T.blue):'rgba(120,120,128,0.1)',
    backdropFilter:active?'none':T.blur,
    WebkitBackdropFilter:active?'none':T.blur,
    color:active?'#fff':T.text,
    border:active?'none':'1px solid rgba(255,255,255,0.5)',
    borderRadius:999,padding:size==='sm'?'4px 10px':'6px 16px',
    fontSize:fs,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',
    boxShadow:active?'none':'inset 0 1px 0 rgba(255,255,255,0.6)',
    transition:'all 0.2s cubic-bezier(0.4,0,0.2,1)',
  }}>${children}</button>`;
}

function Avatar({player,size=44}){
  const [err,setErr]=useState(false);
  const init=(player.short_name||player.name||'?').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
  const style={width:size,height:size,borderRadius:'50%',objectFit:'cover',background:T.bg4,flexShrink:0};
  if(err) return html`<div style=${{...style,display:'flex',alignItems:'center',justifyContent:'center',fontSize:size*0.33,fontWeight:700,color:T.muted}}>${init}</div>`;
  return html`<img src=${pImg(player.id)} alt=${player.short_name||player.name||''} loading="lazy" onError=${()=>setErr(true)} style=${style} />`;
}

function TeamBadge({id,name,size=32}){
  const [err,setErr]=useState(false);
  if(err) return html`<div style=${{width:size,height:size,display:'flex',alignItems:'center',justifyContent:'center',fontSize:size*0.35,fontWeight:700,color:T.muted}}>${(name||'?').slice(0,3)}</div>`;
  return html`<img src=${tImg(id)} alt="" loading="lazy" onError=${()=>setErr(true)} style=${{width:size,height:size,objectFit:'contain',flexShrink:0}} />`;
}

function Flag({a2,size=18}){
  const url=fFlag(a2);
  if(!url)return null;
  return html`<img src=${url} alt="" loading="lazy" style=${{width:size,height:Math.round(size*0.67),borderRadius:2,objectFit:'cover',flexShrink:0}} />`;
}

// ─── Sync Banner ───────────────────────────────────────────────────────────
function SyncBanner(){
  const [status,setStatus]=useState(null);
  const [progress,setProgress]=useState(null);
  const [visible,setVisible]=useState(true);
  const prevRunning=useRef(false);
  const hideTimer=useRef(null);

  useEffect(()=>{
    const check=async()=>{
      const s=await fetch('/api/sync-status').then(r=>r.json()).catch(()=>null);
      if(!s) return;
      if(prevRunning.current&&!s.running&&s.last){
        setVisible(true);
        clearTimeout(hideTimer.current);
        hideTimer.current=setTimeout(()=>setVisible(false),8000);
      }
      prevRunning.current=!!s.running;
      setStatus(s);
      if(s.running){
        const p=await fetch('/api/progress').then(r=>r.json()).catch(()=>null);
        setProgress(p);
      } else {
        setProgress(null);
      }
    };
    check();
    const iv=setInterval(check,2000);
    return()=>{clearInterval(iv);clearTimeout(hideTimer.current);};
  },[]);

  if(!status||(!status.running&&!status.last&&!status.error))return null;
  if(!status.running&&!status.error&&!visible)return null;

  let bg,color,msg,anim,detail=null;
  if(status.running){
    bg='rgba(0,122,255,0.08)';color=T.blue;
    anim={animation:'pulse-blue 1.5s ease-in-out infinite'};
    if(progress){
      if(progress.phase==='matches'){
        const rem=progress.total-progress.current;
        const estMin=Math.round(rem*4/60);
        const timeStr=estMin>0?` · ~${estMin} min`:'';
        msg=`Wedstrijden — ${progress.current}/${progress.total}${timeStr}`;
        detail=progress.label;
      } else if(progress.phase==='players'){
        msg=`Spelers — ${progress.current}/${progress.total} (${progress.pct}%)`;
        detail=progress.label; // bevat al "~X min resterend"
      } else {
        msg='Exporteren...';
      }
    } else {
      msg='Download wordt gestart...';
    }
  } else if(status.error){
    bg='rgba(255,59,48,0.08)';color=T.red;
    msg=`Fout: ${status.error}`;anim={};
  } else {
    bg='rgba(52,199,89,0.08)';color=T.green;
    if(status.last){const p=status.last.split(' ');const t=(p.length>1?p[1]:p[0]).slice(0,5);msg=`Download klaar${p.length>1?' op '+p[0]:''} om ${t}`;}else{msg='Download klaar';}anim={};
  }

  return html`<div style=${{
    background:bg,
    borderBottom:`1px solid ${color}22`,
    padding:'8px 16px',
    display:'flex',alignItems:'center',gap:8,
    position:'sticky',top:57,zIndex:9,
    backdropFilter:'blur(20px) saturate(160%)',
    WebkitBackdropFilter:'blur(20px) saturate(160%)',
    ...anim,
  }}>
    <div style=${{flexShrink:0,display:'flex',alignItems:'center',animation:status.running?'spin 1s linear infinite':'none'}}>
      ${status.running&&html`<${Icon} name="refresh" size=${16} color=${color} />`}
      ${status.error&&html`<${Icon} name="warning" size=${16} color=${color} />`}
      ${!status.running&&!status.error&&html`<${Icon} name="checkfilled" size=${16} color=${color} />`}
    </div>
    <div style=${{flex:1,minWidth:0}}>
      <div style=${{fontSize:13,fontWeight:600,color}}>${msg}</div>
      ${detail&&html`<div style=${{fontSize:11,color,opacity:0.7,marginTop:1,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>${detail}</div>`}
      ${status.running&&progress?.total>0&&html`<div style=${{marginTop:4,height:3,background:`${color}22`,borderRadius:2,overflow:'hidden'}}>
        <div style=${{height:'100%',width:`${progress.pct}%`,background:color,borderRadius:2,transition:'width 0.5s ease'}}></div>
      </div>`}
    </div>
  </div>`;
}

function normA2(c){if(!c)return null;const l=c.toLowerCase();return SS2ISO[l]||l;}
const FLAG_EMOJI_FIX={en:'🏴󠁧󠁢󠁥󠁮󠁧󠁿',sx:'🏴󠁧󠁢󠁳󠁣󠁴󠁿',wa:'🏴󠁧󠁢󠁷󠁬󠁳󠁿',wl:'🏴󠁧󠁢󠁷󠁬󠁳󠁿',nx:'🇬🇧'};
function flagEmoji(a2){if(!a2||a2.length!==2)return'';const c=a2.toLowerCase();if(FLAG_EMOJI_FIX[c]!==undefined)return FLAG_EMOJI_FIX[c];const o=0x1F1E6;try{return String.fromCodePoint(o+(c.charCodeAt(0)-97),o+(c.charCodeAt(1)-97));}catch(e){return'';}}

function _mp(lon,lat){
  const W=720,H=380;
  lat=Math.max(-79,Math.min(79,lat));
  const x=(lon+180)/360*W;
  const y79=Math.log(Math.tan(Math.PI/4+79*Math.PI/360));
  const yn=Math.log(Math.tan(Math.PI/4+lat*Math.PI/360));
  return[x,H/2-(yn/y79)*(H/2-8)];
}
function _ringD(ring){
  let d='',px=null;
  for(let i=0;i<ring.length;i++){
    const[x,y]=_mp(ring[i][0],ring[i][1]);
    if(i>0&&px!==null&&Math.abs(x-px)>300)d+='M'+x.toFixed(1)+','+y.toFixed(1);
    else d+=(i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
    px=x;
  }
  return d+'Z';
}
function _geoPath(g){
  if(!g)return'';
  const rs=g.type==='Polygon'?g.coordinates:g.type==='MultiPolygon'?g.coordinates.flat():[];
  return rs.map(_ringD).join(' ');
}

function WorldMap({players,onCountryClick}){
  const svgRef=useRef(null);
  const tipRef=useRef(null);
  const dragRef=useRef(null);
  const touchRef=useRef(null);
  const didDragRef=useRef(false);
  const [paths,setPaths]=useState([]);
  const [vb,setVb]=useState([0,0,720,380]);

  const seenMap=useMemo(()=>{
    const m={};
    const UK_NATIONS=new Set(['en','sx','wa','nx']);
    players.forEach(p=>{
      if((p.starter_appearances||0)+(p.sub_appearances||0)===0)return;
      const a2=normA2(p.nationality_alpha2);
      if(!a2)return;
      if(!m[a2])m[a2]={count:0,name:A2_NAMES[a2]||p.nationality||a2.toUpperCase()};
      m[a2].count++;
      // ook gb markeren zodat VK gekleurd blijft op de SVG-kaart
      if(UK_NATIONS.has(a2)){
        if(!m['gb'])m['gb']={count:0,name:'Verenigd Koninkrijk'};
        m['gb'].count++;
      }
    });
    return m;
  },[players]);

  useEffect(()=>{
    function build(topo){
      const features=window.topojson.feature(topo,topo.objects.countries).features;
      setPaths(features.map(f=>({d:_geoPath(f.geometry),a2:NUM2A2[+f.id]})));
    }
    function doFetch(){
      fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
        .then(r=>r.json()).then(build).catch(console.error);
    }
    if(window.topojson){doFetch();}
    else{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js';s.onload=doFetch;document.head.appendChild(s);}
  },[]);

  const zoom=useCallback((factor,cx,cy)=>{
    setVb(([vx,vy,vw,vh])=>{
      const nw=Math.max(80,Math.min(720,vw*factor));
      const nh=nw*(380/720);
      return[cx-(cx-vx)*(nw/vw),cy-(cy-vy)*(nh/vh),nw,nh];
    });
  },[]);

  const handleWheel=useCallback(e=>{
    e.preventDefault();
    const rect=svgRef.current?.getBoundingClientRect();
    if(!rect)return;
    setVb(([vx,vy,vw,vh])=>{
      const f=e.deltaY>0?1.25:0.8;
      const cx=(e.clientX-rect.left)/rect.width*vw+vx;
      const cy=(e.clientY-rect.top)/rect.height*vh+vy;
      const nw=Math.max(80,Math.min(720,vw*f));
      const nh=nw*(380/720);
      return[cx-(cx-vx)*(nw/vw),cy-(cy-vy)*(nh/vh),nw,nh];
    });
  },[]);

  const onDown=useCallback(e=>{dragRef.current={sx:e.clientX,sy:e.clientY,vb};didDragRef.current=false;},[vb]);
  const onMove=useCallback(e=>{
    if(!dragRef.current)return;
    const{sx,sy,vb:dv}=dragRef.current;
    const rect=svgRef.current?.getBoundingClientRect();
    if(!rect)return;
    if(Math.abs(e.clientX-sx)>3||Math.abs(e.clientY-sy)>3)didDragRef.current=true;
    const nv=[dv[0]-(e.clientX-sx)/rect.width*dv[2],dv[1]-(e.clientY-sy)/rect.height*dv[3],dv[2],dv[3]];
    setVb(nv);dragRef.current={sx:e.clientX,sy:e.clientY,vb:nv};
  },[]);
  const onUp=useCallback(()=>{dragRef.current=null;},[]);

  const onTouchStart=useCallback(e=>{
    if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;touchRef.current={dist:Math.hypot(dx,dy),vb};}
    else if(e.touches.length===1){dragRef.current={sx:e.touches[0].clientX,sy:e.touches[0].clientY,vb};}
  },[vb]);
  const onTouchMove=useCallback(e=>{
    e.preventDefault();
    if(e.touches.length===2&&touchRef.current){
      const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
      const d2=Math.hypot(dx,dy);const f=touchRef.current.dist/d2;const tv=touchRef.current.vb;
      const nw=Math.max(80,Math.min(720,tv[2]*f));const nh=nw*(380/720);
      const nv=[tv[0],tv[1],nw,nh];setVb(nv);touchRef.current={dist:d2,vb:nv};
    }else if(e.touches.length===1&&dragRef.current){
      const t=e.touches[0];const rect=svgRef.current?.getBoundingClientRect();if(!rect)return;
      const{sx,sy,vb:dv}=dragRef.current;
      const nv=[dv[0]-(t.clientX-sx)/rect.width*dv[2],dv[1]-(t.clientY-sy)/rect.height*dv[3],dv[2],dv[3]];
      setVb(nv);dragRef.current={sx:t.clientX,sy:t.clientY,vb:nv};
    }
  },[]);
  const onTouchEnd=useCallback(()=>{dragRef.current=null;touchRef.current=null;},[]);

  const showTip=useCallback((e,a2)=>{
    const el=tipRef.current,svg=svgRef.current;if(!el||!svg)return;
    const rect=svg.getBoundingClientRect();
    const x=e.clientX-rect.left,y=e.clientY-rect.top;
    const seen=seenMap[a2];const name=seen?.name||A2_NAMES[a2]||(a2?a2.toUpperCase():'');
    if(!name){el.style.display='none';return;}
    const flagUrl=fFlag(a2);
    const flagHtml=flagUrl?`<img src="${flagUrl}" style="height:14px;border-radius:2px;vertical-align:middle;margin-right:5px;"/>`:'';
    const clickHint=seen?'<div style="font-size:10px;color:#aaa;margin-top:3px;">Tik voor spelers →</div>':'';
    el.style.display='block';
    el.style.left=Math.min(x+12,rect.width-160)+'px';
    el.style.top=Math.max(y-70,4)+'px';
    el.innerHTML=`<div style="display:flex;align-items:center;gap:4px;margin-bottom:2px;">${flagHtml}<b>${name}</b></div><span style="color:${seen?'#90d4ff':'#999'}">${seen?seen.count+'\u00a0speler'+(seen.count!==1?'s':'')+'\u00a0gezien':'Nog niet gezien'}</span>${clickHint}`;
  },[seenMap]);
  const hideTip=useCallback(()=>{if(tipRef.current)tipRef.current.style.display='none';},[]);

  const handleClick=useCallback((a2)=>{
    if(didDragRef.current)return;
    const seen=seenMap[a2];
    if(seen&&onCountryClick)onCountryClick(a2,seen.name);
  },[seenMap,onCountryClick]);

  const resetZoom=useCallback(()=>setVb([0,0,720,380]),[]);

  const seenCount=Object.keys(seenMap).length;

  return html`<div>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
      <span style=${{fontSize:11,color:T.dim}}>Scroll/knijp om in te zoomen · sleep om te verschuiven</span>
      <div style=${{display:'flex',gap:8,alignItems:'center'}}>
        <button onClick=${resetZoom} aria-label="Kaart resetten" style=${{fontSize:11,color:T.blue,background:'none',border:`1px solid ${T.blue}`,borderRadius:6,padding:'5px 10px',cursor:'pointer',minHeight:30}}>Reset</button>
        <span style=${{fontSize:11,fontWeight:700,color:T.blue}}>${seenCount} landen</span>
      </div>
    </div>
    <div style=${{position:'relative',borderRadius:10,overflow:'hidden',border:`1px solid ${T.border}`}}>
      <svg ref=${svgRef}
        viewBox=${vb.join(' ')}
        style=${{width:'100%',minHeight:180,display:'block',background:isDark?'#1a2a38':'#c8dff0',cursor:'grab',touchAction:'none'}}
        onWheel=${handleWheel}
        onMouseDown=${onDown}
        onMouseMove=${onMove}
        onMouseUp=${onUp}
        onMouseLeave=${()=>{onUp();hideTip();}}
        onTouchStart=${onTouchStart}
        onTouchMove=${onTouchMove}
        onTouchEnd=${onTouchEnd}
      >
        ${paths.length===0&&html`<text x="360" y="190" textAnchor="middle" fill="#6b8fa8" fontSize="16">Kaart laden…</text>`}
        ${paths.map((p,i)=>html`<path key=${i} d=${p.d}
          fill=${seenMap[p.a2]?T.blue:'#d4e4ef'}
          stroke="#fff" strokeWidth="0.4"
          style=${{cursor:seenMap[p.a2]?'pointer':'default'}}
          onMouseEnter=${e=>showTip(e,p.a2)}
          onMouseMove=${e=>showTip(e,p.a2)}
          onMouseLeave=${hideTip}
          onClick=${()=>handleClick(p.a2)}
        />`)}
      </svg>
      <div ref=${tipRef} style=${{display:'none',position:'absolute',background:'rgba(0,0,0,0.82)',color:'#fff',padding:'5px 10px',borderRadius:7,fontSize:12,pointerEvents:'none',zIndex:10,lineHeight:1.5}}></div>
    </div>
  </div>`;
}

// ─── CONTINENT VIEW ────────────────────────────────────────────────────────
function ContinentView({players,onCountryClick}){
  const seenSet=useMemo(()=>{
    const s=new Set();
    players.forEach(p=>{
      if((p.starter_appearances||0)+(p.sub_appearances||0)===0)return;
      const a2=normA2(p.nationality_alpha2);
      if(a2)s.add(a2);
    });
    return s;
  },[players]);
  return html`<div style=${{display:'flex',flexDirection:'column',gap:14}}>
    ${CONF_DATA.map(({key,label,color,total,codes})=>{
      const seenCount=codes.filter(c=>seenSet.has(c)).length;
      const pct=seenCount/total*100;
      return html`<div key=${key}>
        <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:5}}>
          <div style=${{display:'flex',alignItems:'center',gap:6}}>
            <div style=${{width:8,height:8,borderRadius:'50%',background:color,flexShrink:0}}></div>
            <span style=${{fontSize:13,fontWeight:700,color:T.text}}>${key}</span>
            <span style=${{fontSize:11,color:T.muted}}>${label}</span>
          </div>
          <span style=${{fontSize:12,fontWeight:700,color}}>${seenCount}<span style=${{fontWeight:400,color:T.dim}}>/${total}</span></span>
        </div>
        <div style=${{height:5,background:T.bg3,borderRadius:3,overflow:'hidden',marginBottom:6}}>
          <div style=${{width:`${pct}%`,height:'100%',background:color,borderRadius:3,transition:'width 0.6s ease'}}></div>
        </div>
        <div style=${{display:'grid',gridTemplateColumns:'repeat(10,1fr)',gap:3,marginTop:2}}>
          ${codes.map(c=>{
            const seen=seenSet.has(c);
            const flag=fFlag(c);
            if(!flag)return null;
            return html`<img
              key=${c}
              src=${flag}
              alt=${A2_NAMES[c]||c}
              title=${A2_NAMES[c]||c}
              onClick=${onCountryClick?()=>onCountryClick(c):null}
              loading="lazy"
              style=${{
                width:'100%',aspectRatio:'4/3',objectFit:'cover',
                borderRadius:2,border:`1px solid ${T.border}`,
                opacity:seen?1:0.18,
                filter:seen?'none':'grayscale(1)',
                cursor:onCountryClick?'pointer':'default',
                transition:'opacity 0.15s',
              }}
            />`;
          })}
        </div>
      </div>`;
    })}
  </div>`;
}

// ─── GEZIEN XI ─────────────────────────────────────────────────────────────
const XI_TYPES=[
  {k:'seen',     l:'Meest gezien',   color:T.blue},
  {k:'minutes',  l:'Meeste minuten', color:T.purple},
  {k:'oldest',   l:'Oudste',         color:T.orange},
  {k:'youngest', l:'Jongste',        color:T.green},
  {k:'market',   l:'Marktwaarde',    color:T.yellow},
];
function xiSort(type,a,b){
  if(type==='oldest')  return((b.oldest_age_seen?.age_years||0)*365+(b.oldest_age_seen?.age_days||0))-((a.oldest_age_seen?.age_years||0)*365+(a.oldest_age_seen?.age_days||0));
  if(type==='youngest'){const av=(a.youngest_age_seen?.age_years??999)*365+(a.youngest_age_seen?.age_days||0),bv=(b.youngest_age_seen?.age_years??999)*365+(b.youngest_age_seen?.age_days||0);return av-bv;}
  if(type==='market')  return(b.market_value||0)-(a.market_value||0);
  if(type==='seen')    return(b.matches_seen||0)-(a.matches_seen||0);
  if(type==='minutes') return(b.minutes_played||0)-(a.minutes_played||0);
  return 0;
}
function xiBadge(type,p){
  if(type==='oldest')  {const s=p.oldest_age_seen;  return s?fAge(s.age_years,s.age_days):'—';}
  if(type==='youngest'){const s=p.youngest_age_seen; return s?fAge(s.age_years,s.age_days):'—';}
  if(type==='market')  return fMarket(p.market_value);
  if(type==='seen')    return`${p.matches_seen}x`;
  if(type==='minutes') return`${p.minutes_played}'`;
  return'—';
}
const POS_COLOR={G:T.teal,D:T.blue,M:T.green,F:T.orange};
function XICard({player,type,color,onPlayerClick}){
  if(!player)return html`<div style=${{width:70}}></div>`;
  const posColor=POS_COLOR[player.position]||T.muted;
  const initials=(player.short_name||player.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('');
  const [imgOk,setImgOk]=useState(true);
  return html`<div
    onClick=${()=>onPlayerClick&&onPlayerClick(player)}
    style=${{display:'flex',flexDirection:'column',alignItems:'center',gap:3,width:70,flexShrink:0,cursor:onPlayerClick?'pointer':'default'}}
  >
    <div style=${{width:46,height:46,borderRadius:'50%',background:posColor+'22',border:`2px solid ${posColor}55`,overflow:'hidden',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
      ${imgOk
        ?html`<img src=${pImg(player.id)} style=${{width:'100%',height:'100%',objectFit:'cover'}} onError=${()=>setImgOk(false)} loading="lazy" />`
        :html`<span style=${{fontSize:14,fontWeight:800,color:posColor}}>${initials}</span>`}
    </div>
    <div style=${{fontSize:9,fontWeight:600,color:T.text,textAlign:'center',lineHeight:1.2,maxWidth:68,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>${player.short_name||player.name}</div>
    <div style=${{fontSize:9,color,fontWeight:700,textAlign:'center'}}>${xiBadge(type,player)}</div>
  </div>`;
}
function GezienXI({players,records,onPlayerClick}){
  const [type,setType]=useState('seen');
  const conf=XI_TYPES.find(t=>t.k===type)||XI_TYPES[0];
  const xi=useMemo(()=>{
    const played=players.filter(p=>(p.starter_appearances||0)+(p.sub_appearances||0)>0);
    const pick=(pos,n)=>[...played.filter(p=>p.position===pos)].sort((a,b)=>xiSort(type,a,b)).slice(0,n);
    return{F:pick('F',3),M:pick('M',3),D:pick('D',4),G:pick('G',1)};
  },[players,type]);
  const ageSpan=useMemo(()=>{
    let best=null,bestDiff=0;
    players.forEach(p=>{
      const y=p.youngest_age_seen,o=p.oldest_age_seen;
      if(!y||!o)return;
      const diff=(o.age_years*365+o.age_days)-(y.age_years*365+y.age_days);
      if(diff>bestDiff){bestDiff=diff;best={name:p.name,years:Math.floor(diff/365),days:diff%365};}
    });
    return best;
  },[players]);
  const row=arr=>html`<div style=${{display:'flex',justifyContent:'center',gap:6}}>${arr.map((p,i)=>html`<${XICard} key=${p?.id??i} player=${p} type=${type} color=${conf.color} onPlayerClick=${onPlayerClick} />`)}</div>`;
  return html`<${Card}>
    <${SectionTitle} icon="users">XI</${SectionTitle}>
    <div style=${{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
      ${records.youngest_player&&html`<div style=${{flex:1,minWidth:100,background:T.bg3,borderRadius:10,padding:'6px 10px'}}>
        <div style=${{fontSize:9,color:T.dim,textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:1}}>Jongste ooit</div>
        <div style=${{fontSize:11,fontWeight:700,color:T.green,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>${records.youngest_player.name}</div>
        <div style=${{fontSize:10,color:T.muted}}>${fAge(records.youngest_player.age_years,records.youngest_player.age_days)}</div>
      </div>`}
      ${records.oldest_player&&html`<div style=${{flex:1,minWidth:100,background:T.bg3,borderRadius:10,padding:'6px 10px'}}>
        <div style=${{fontSize:9,color:T.dim,textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:1}}>Oudste ooit</div>
        <div style=${{fontSize:11,fontWeight:700,color:T.orange,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>${records.oldest_player.name}</div>
        <div style=${{fontSize:10,color:T.muted}}>${fAge(records.oldest_player.age_years,records.oldest_player.age_days)}</div>
      </div>`}
      ${ageSpan&&html`<div style=${{flex:1,minWidth:100,background:T.bg3,borderRadius:10,padding:'6px 10px'}}>
        <div style=${{fontSize:9,color:T.dim,textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:1}}>Langste spanne</div>
        <div style=${{fontSize:11,fontWeight:700,color:T.purple,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>${ageSpan.name}</div>
        <div style=${{fontSize:10,color:T.muted}}>${ageSpan.years}j ${ageSpan.days}d</div>
      </div>`}
    </div>
    <div class="scroll-x" style=${{display:'flex',gap:6,marginBottom:14,paddingBottom:2}}>
      ${XI_TYPES.map(t=>html`<${Pill} key=${t.k} active=${type===t.k} color=${t.color} onClick=${()=>setType(t.k)} size="sm">${t.l}</${Pill}>`)}
    </div>
    <div style=${{display:'flex',flexDirection:'column',gap:10,padding:'4px 0'}}>
      ${row(xi.F)}
      ${row(xi.M)}
      ${row(xi.D)}
      ${row(xi.G)}
    </div>
  </${Card}>`;
}

// ─── TAB: HOME ─────────────────────────────────────────────────────────────
function TabHome({data,onCountryClick,onPlayerClick}){
  const {total_matches=0,total_goals_witnessed=0,players=[],records={},tournaments=[],teams_visited=[],date_range={}}=data;
  const firstYear=date_range.first?date_range.first.slice(0,4):'—';
  const lastYear=date_range.last?date_range.last.slice(0,4):'—';

  const countriesSeen=useMemo(()=>new Set(
    players.filter(p=>(p.starter_appearances||0)+(p.sub_appearances||0)>0).map(p=>normA2(p.nationality_alpha2)).filter(Boolean)
  ).size,[players]);

  const seasonBar=useMemo(()=>{
    const map={};
    (data.matches||[]).forEach(m=>{
      if(!m.date)return;
      const yr=+m.date.slice(0,4),mo=+m.date.slice(5,7);
      const k=mo>=7?`${String(yr).slice(2)}/${String(yr+1).slice(2)}`:`${String(yr-1).slice(2)}/${String(yr).slice(2)}`;
      map[k]=(map[k]||0)+1;
    });
    return Object.entries(map).sort(([a],[b])=>a.localeCompare(b)).map(([name,value])=>({name,value}));
  },[data.matches]);

  const COMP_COLORS={'UEFA Champions League':'#1A4FBE','UEFA Europa League':'#F05A28','UEFA Europa Conference League':'#00A94F'};
  const compBar=tournaments.slice(0,8).map(t=>({name:t.name.replace('VriendenLoterij ','').replace('Eurojackpot ','').replace('UEFA Europa Conference League','UECL').replace('UEFA Champions League','UCL').replace('UEFA Europa League','UEL').replace('Club Friendly Games','Vriendschappelijk'),value:t.matches_count,color:COMP_COLORS[t.name]||T.blue}));
  const recentMatches=(data.matches||[]).slice(0,5);

  return html`<div style=${{display:'flex',flexDirection:'column',gap:16}}>

    <!-- Hero stat band -->
    <${Card} glow=${true} style=${{background:'rgba(0,122,255,0.05)',border:'1px solid rgba(0,122,255,0.18)'}}>
      <div style=${{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:4}}>
        <${StatBox} label="Wedstrijden" value=${total_matches} color=${T.blue} />
        <${StatBox} label="Spelers" value=${players.length} color=${T.green} />
        <${StatBox} label="Goals" value=${total_goals_witnessed} color=${T.yellow} />
        <${StatBox} label="Clubs" value=${teams_visited.length} color=${T.orange} />
        <${StatBox} label="Landen" value=${countriesSeen} color=${T.teal} />
        <${StatBox} label="Seizoenen" value=${seasonBar.length} color=${T.purple} sub=${firstYear!=='—'?`${firstYear}–${lastYear}`:null} />
      </div>
    </${Card}>

    <!-- Gezien XI -->
    <${GezienXI} players=${players} records=${records} onPlayerClick=${onPlayerClick} />

    <!-- Records -->
    <${Card}>
      <${SectionTitle} icon="trophy">Records</${SectionTitle}>
      <div style=${{display:'flex',flexDirection:'column',gap:10}}>
        ${records.most_goals_single_match&&html`<${RecordItem} icon="target" label="Meeste goals in 1 duel" number=${`${records.most_goals_single_match.count} goals`} match=${records.most_goals_single_match.match} date=${records.most_goals_single_match.date} />`}
        ${records.biggest_win&&html`<${RecordItem} icon="trophy" label="Grootste overwinning" number=${`+${records.biggest_win.goal_diff??''}`} match=${records.biggest_win.match} date=${records.biggest_win.date} />`}
        ${records.highest_attendance&&html`<${RecordItem} icon="users" label="Meeste toeschouwers" number=${fNum(records.highest_attendance.count)} match=${`${records.highest_attendance.venue} · ${records.highest_attendance.match}`} date=${records.highest_attendance.date} />`}
      </div>
    </${Card}>

    <!-- Recente wedstrijden -->
    ${recentMatches.length>0&&html`<${Card}>
      <${SectionTitle} icon="clock" right="alle wedstrijden →">Recent</${SectionTitle}>
      <div style=${{display:'flex',flexDirection:'column',gap:8}}>
        ${recentMatches.map(m=>html`<${MiniMatchRow} key=${m.id} match=${m} />`)}
      </div>

    <!-- Competities horizontal bar -->
    ${compBar.length>0&&html`<${Card}>
      <${SectionTitle} icon="trophy">Competities</${SectionTitle}>
      <${BarChart} data=${compBar} color=${T.blue} horizontal=${true} />
    </${Card}>`}

    <!-- Seizoenen bar -->
    ${seasonBar.length>1&&html`<${Card}>
      <${SectionTitle} icon="calendar">Per seizoen</${SectionTitle}>
      <${BarChart} data=${seasonBar} color=${T.blue} height=${110} />
    </${Card}>`}

    <!-- Landen: confederaties (mobile) + kaart (desktop) -->
    <${Card}>
      <${SectionTitle} icon="globe">Landen gezien spelen</${SectionTitle}>
      <div class="mobile-only"><${ContinentView} players=${players} onCountryClick=${onCountryClick} /></div>
      <div class="desktop-only"><${WorldMap} players=${players} onCountryClick=${onCountryClick} /></div>
    </${Card}>

const SORTS=[
  {k:'matches_seen',l:'Gezien'},{k:'goals',l:'Doelpunten'},{k:'assists',l:'Assists'},
  {k:'minutes_played',l:'Minuten'},
  {k:'yellow_cards',l:'Geel'},{k:'red_cards',l:'Rood'},{k:'age_asc',l:'Jongste'},{k:'age_desc',l:'Oudste'},
  {k:'age_span',l:'Spanne'},{k:'clubs',l:'Clubs'},{k:'height_desc',l:'Grootste'},{k:'height_asc',l:'Kleinste'},
  {k:'max_transfer_fee',l:'Transfersom'},{k:'national_team_caps',l:'Interlands'},
];

const ROLE_FILTERS=[
  {k:'all',l:'Alle'},
  {k:'played',l:'Gespeeld'},
  {k:'starter',l:'Basis'},
  {k:'sub',l:'Invaller'},
  {k:'bench',l:'Bank'},
  {k:'international',l:'Interland'},
];

const PAGE=25;
function TabSpelers({data,initCountry,initPlayer,onRegisterBack,onClearBack}){
  const [q,setQ]=useState('');
  const [sort,setSort]=useState('matches_seen');
  const [role,setRole]=useState('played');
  const [country,setCountry]=useState(initCountry||'');
  const [detail,setDetail]=useState(initPlayer||null);
  const [shown,setShown]=useState(PAGE);
  const listScrollY=useRef(0);
  useEffect(()=>{
    if(detail)onRegisterBack&&onRegisterBack(()=>{setDetail(null);window.scrollTo({top:listScrollY.current,behavior:'instant'});});
    else onClearBack&&onClearBack();
  },[detail]);
  useEffect(()=>()=>{onClearBack&&onClearBack();},[]);

  // Sync when initCountry changes (e.g. navigated from map)
  useEffect(()=>{setCountry(initCountry||'');},[initCountry]);
  // Reset paginering bij filter/sort wijziging
  useEffect(()=>{setShown(PAGE);},[q,sort,role,country]);

  const countryOptions=useMemo(()=>{
    return Object.entries(A2_NAMES).sort((a,b)=>a[1].localeCompare(b[1],'nl'));
  },[]);

  const list=useMemo(()=>{
    let ps=[...(data.players||[])];
    if(q)ps=ps.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));
    if(country)ps=ps.filter(p=>normA2(p.nationality_alpha2)===country);
    if(role==='played')        ps=ps.filter(p=>(p.starter_appearances||0)>0||(p.sub_appearances||0)>0);
    if(role==='starter')       ps=ps.filter(p=>(p.starter_appearances||0)>0);
    if(role==='sub')           ps=ps.filter(p=>(p.sub_appearances||0)>0);
    if(role==='bench')         ps=ps.filter(p=>(p.bench_appearances||0)>0 && (p.starter_appearances||0)===0 && (p.sub_appearances||0)===0);
    if(role==='international') ps=ps.filter(p=>(p.national_team_caps||0)>0);
    ps.sort((a,b)=>{
      if(sort==='age_asc'){const ya=a.youngest_age_seen,yb=b.youngest_age_seen;if(!ya&&!yb)return 0;if(!ya)return 1;if(!yb)return-1;return ya.age_years!==yb.age_years?ya.age_years-yb.age_years:ya.age_days-yb.age_days;}
      if(sort==='age_desc'){const oa=a.oldest_age_seen,ob=b.oldest_age_seen;if(!oa&&!ob)return 0;if(!oa)return 1;if(!ob)return-1;return ob.age_years!==oa.age_years?ob.age_years-oa.age_years:ob.age_days-oa.age_days;}
      if(sort==='age_span'){const spanOf=p=>{const y=p.youngest_age_seen,o=p.oldest_age_seen;if(!y||!o)return-1;return(o.age_years*365+o.age_days)-(y.age_years*365+y.age_days);};return spanOf(b)-spanOf(a);}
      if(sort==='clubs')return(b.teams_seen_for||[]).length-(a.teams_seen_for||[]).length;
      if(sort==='height_desc'){const ha=a.height_cm||0,hb=b.height_cm||0;return hb-ha;}
      if(sort==='height_asc'){const ha=a.height_cm||999,hb=b.height_cm||999;return ha-hb;}
      return(b[sort]??-1)-(a[sort]??-1);
    });
    return ps;
  },[data.players,q,sort,role,country]);

  if(detail)return html`<${PlayerDetail} player=${detail} onBack=${()=>{setDetail(null);window.scrollTo({top:listScrollY.current,behavior:'instant'});}} />`;

function PlayerCard({player:p,onClick,rank,sort}){
  const [hovered,setHovered]=useState(false);
  const pos=posLabel[p.position]||p.position||'';
  const lead=(()=>{
    if(sort==='goals') return{val:p.goals||0,lbl:'goals',color:T.green};
    if(sort==='assists') return{val:p.assists||0,lbl:'assists',color:T.blue};
    if(sort==='minutes_played') return{val:fNum(p.minutes_played),lbl:'min',color:T.teal};
    if(sort==='yellow_cards') return{val:p.yellow_cards||0,lbl:'geel',color:T.yellow};
    if(sort==='red_cards') return{val:p.red_cards||0,lbl:'rood',color:T.red};
    if(sort==='age_asc'){const a=p.youngest_age_seen;return{val:a?`${a.age_years}j`:'—',sub:a?`${a.age_days}d`:null,lbl:'jongste',color:T.purple};}
    if(sort==='age_desc'){const a=p.oldest_age_seen;return{val:a?`${a.age_years}j`:'—',sub:a?`${a.age_days}d`:null,lbl:'oudste',color:T.orange};}
    if(sort==='age_span'){const y=p.youngest_age_seen,o=p.oldest_age_seen;if(y&&o){const d=(o.age_years*365+o.age_days)-(y.age_years*365+y.age_days);return{val:`${Math.floor(d/365)}j`,sub:`${d%365}d`,lbl:'spanne',color:T.teal};}return{val:'—',lbl:'spanne',color:T.teal};}
    if(sort==='clubs') return{val:(p.teams_seen_for||[]).length,lbl:'clubs',color:T.purple};
    if(sort==='height_desc'||sort==='height_asc') return{val:p.height_cm||'—',lbl:'cm',color:T.muted};
    if(sort==='max_transfer_fee') return{val:fMarket(p.max_transfer_fee),lbl:'transfer',color:T.green};
    if(sort==='national_team_caps') return{val:p.national_team_caps||0,lbl:'interlands',color:T.orange};
    return{val:p.matches_seen||0,lbl:'gezien',color:T.blue};
  })();
  const apps=[];
  if((p.starter_appearances||0)>0) apps.push(`${p.starter_appearances}× basis`);
  if((p.sub_appearances||0)>0) apps.push(`${p.sub_appearances}× invaller`);
  if((p.bench_appearances||0)>0&&apps.length===0) apps.push('bank');
  return html`<div
    onClick=${onClick}
    onMouseEnter=${()=>setHovered(true)}
    onMouseLeave=${()=>setHovered(false)}
    style=${{
      background:hovered?T.cardHov:T.card,
      backdropFilter:T.blurHeavy,
      WebkitBackdropFilter:T.blurHeavy,
      borderRadius:18,padding:'14px 16px 14px 18px',
      border:`1px solid ${T.cardBorder}`,
      boxShadow:`inset 3px 0 0 ${lead.color},${hovered?T.shadowGlassHover:T.shadowGlass}`,
      cursor:'pointer',display:'flex',alignItems:'center',gap:12,
      transition:'all 0.25s cubic-bezier(0.34,1.56,0.64,1)',
      transform:hovered?'translateY(-1px)':'none',
    }}>
    <!-- Avatar met rank badge -->
    <div style=${{position:'relative',flexShrink:0,width:48,height:48}}>
      <${Avatar} player=${p} size=${48} />
      <div style=${{
        position:'absolute',bottom:-1,left:-1,
        background:lead.color,
        borderRadius:'0 5px 0 9px',
        padding:'2px 5px',
        fontSize:9,fontWeight:900,color:'#fff',lineHeight:1.4,
        letterSpacing:'0.02em',
      }}>#${rank}</div>
    </div>
    <div style=${{flex:1,minWidth:0}}>
      <div style=${{display:'flex',alignItems:'center',gap:5}}>
        ${p.nationality_alpha2&&html`<${Flag} a2=${p.nationality_alpha2} size=${13} />`}
        <span style=${{fontWeight:700,fontSize:14,color:T.text,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>${p.name}</span>
        ${p.gender==='F'&&html`<span style=${{background:'#ff2d5518',color:T.pink,borderRadius:6,padding:'1px 6px',fontSize:9,fontWeight:700,flexShrink:0}}>Vrouwen</span>`}
      </div>
      <div style=${{fontSize:11,color:T.muted,marginTop:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>${(p.teams_seen_for||[]).join(' · ')}${pos?` · ${pos}`:''}</div>
      <div style=${{display:'flex',gap:6,marginTop:5,alignItems:'center',flexWrap:'nowrap',overflow:'hidden'}}>
        ${apps.length>0&&html`<span style=${{fontSize:10,color:T.dim}}>${apps.join(' · ')}</span>`}
        ${(p.goals||0)>0&&sort!=='goals'&&html`<span style=${{fontSize:10,color:T.green,fontWeight:700}}>${p.goals}G</span>`}
        ${(p.assists||0)>0&&sort!=='assists'&&html`<span style=${{fontSize:10,color:T.blue,fontWeight:700}}>${p.assists}A</span>`}
        ${p.height_cm&&(sort==='height_desc'||sort==='height_asc')&&html`<span style=${{fontSize:10,color:T.dim}}>${p.height_cm}cm</span>`}
      </div>
    </div>
    <div style=${{textAlign:'right',flexShrink:0,minWidth:52}}>
      <div style=${{fontSize:22,fontWeight:800,color:lead.color,lineHeight:1}}>${lead.val}</div>
      ${lead.sub&&html`<div style=${{fontSize:12,fontWeight:700,color:lead.color,opacity:0.7,lineHeight:1,marginTop:1}}>${lead.sub}</div>`}
      <div style=${{fontSize:10,color:T.dim,marginTop:2,textTransform:'uppercase',letterSpacing:'0.06em'}}>${lead.lbl}</div>
    </div>
  </div>`;
}

function TabClubs({data,onRegisterBack,onClearBack}){
  const [detail,setDetail]=useState(null);
  const [q,setQ]=useState('');
  const [sort,setSort]=useState('matches_count');
  const [sortDir,setSortDir]=useState(-1);
  const listScrollY=useRef(0);
  useEffect(()=>{
    if(detail)onRegisterBack&&onRegisterBack(()=>{setDetail(null);window.scrollTo({top:listScrollY.current,behavior:'instant'});});
    else onClearBack&&onClearBack();
  },[detail]);
  useEffect(()=>()=>{onClearBack&&onClearBack();},[]);

  const matches=useMemo(()=>data.matches||[],[data]);
  const teams=useMemo(()=>data.teams_visited||[],[data]);

  const teamStats=useMemo(()=>{
    const stats={};
    teams.forEach(t=>{
      const tm=matches.filter(m=>m.home_team?.id===t.id||m.away_team?.id===t.id);
      let w=0,d=0,l=0;
      tm.forEach(m=>{
        const isHome=m.home_team?.id===t.id;
        const ts=isHome?m.home_score:m.away_score;
        const os=isHome?m.away_score:m.home_score;
        if(ts==null||os==null)return;
        if(ts>os)w++;else if(ts===os)d++;else l++;
      });
      const played=w+d+l;
      stats[t.id]={w,d,l,played,winPct:played?w/played:0,ppw:played?(w*3+d)/played:0};
    });
    return stats;
  },[teams,matches]);

  const list=useMemo(()=>{
    let ts=[...teams];
    if(q)ts=ts.filter(t=>t.name.toLowerCase().includes(q.toLowerCase()));
    ts.sort((a,b)=>{
      const sa=teamStats[a.id]||{};const sb=teamStats[b.id]||{};
      const va=sort==='matches_count'?a.matches_count:(sa[sort]??0);
      const vb=sort==='matches_count'?b.matches_count:(sb[sort]??0);
      return sortDir*(va-vb);
    });
    return ts;
  },[teams,teamStats,q,sort,sortDir]);

  function toggleSort(k){if(sort===k)setSortDir(d=>d*-1);else{setSort(k);setSortDir(-1);}}

  if(detail)return html`<${ClubDetail} team=${detail} data=${data} onBack=${()=>{setDetail(null);window.scrollTo({top:listScrollY.current,behavior:'instant'});}} />`;

  const COLS=[
    {k:'matches_count',l:'Dls',w:30},{k:'w',l:'W',w:26},{k:'d',l:'G',w:26},{k:'l',l:'V',w:26},
    {k:'winPct',l:'W%',w:38},{k:'ppw',l:'PPW',w:40},
  ];

  return html`<div style=${{display:'flex',flexDirection:'column',gap:10}}>
    <${SearchInput} value=${q} onChange=${setQ} placeholder="Club zoeken..." />

    <${Card} style=${{padding:0,overflow:'hidden'}}>
      <!-- Header -->
      <div style=${{display:'flex',alignItems:'center',padding:'7px 12px',borderBottom:`1px solid ${T.border}`,background:T.bg3}}>
        <div style=${{flex:1,minWidth:0,fontSize:10,fontWeight:700,color:T.dim,textTransform:'uppercase',letterSpacing:'0.06em'}}>Club</div>
        ${COLS.map(c=>html`<button key=${c.k} onClick=${()=>toggleSort(c.k)} style=${{
          width:c.w,flexShrink:0,background:'none',border:'none',cursor:'pointer',padding:'0 2px',
          fontSize:10,fontWeight:700,color:sort===c.k?T.blue:T.dim,
          textTransform:'uppercase',letterSpacing:'0.05em',
          textAlign:'right',display:'flex',alignItems:'center',justifyContent:'flex-end',gap:1,
        }}>
          ${c.l}${sort===c.k?html`<span style=${{fontSize:8}}>${sortDir===-1?'↓':'↑'}</span>`:''}
        </button>`)}
      </div>

      <!-- Rows -->
      ${list.length===0&&html`<div style=${{textAlign:'center',color:T.muted,padding:24,fontSize:13}}>Geen clubs gevonden</div>`}
      ${list.map((t,i)=>{
        const s=teamStats[t.id]||{};
        const winColor=!s.played?T.muted:s.winPct>=0.6?T.green:s.winPct>=0.4?T.yellow:T.red;
        return html`<div key=${t.id}
          onClick=${()=>{listScrollY.current=window.scrollY;setDetail(t);window.scrollTo({top:0,behavior:'instant'});}}
          style=${{display:'flex',alignItems:'center',padding:'8px 12px',borderBottom:i<list.length-1?`1px solid ${T.border}`:'none',cursor:'pointer'}}
          onTouchStart=${e=>e.currentTarget.style.background=T.bg3}
          onTouchEnd=${e=>e.currentTarget.style.background=''}
        >
          <!-- Badge + naam + vlag -->
          <div style=${{flex:1,minWidth:0,display:'flex',alignItems:'center',gap:8}}>
            <div style=${{width:28,height:28,flexShrink:0,background:T.bg3,borderRadius:6,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <${TeamBadge} id=${t.id} name=${t.name} size=${22} />
            </div>
            <div style=${{minWidth:0,flex:1}}>
              <div style=${{fontWeight:600,fontSize:13,color:T.text,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${t.name}</div>
            </div>
          </div>
          <!-- Stat columns -->
          <div style=${{width:30,flexShrink:0,textAlign:'right',fontSize:13,fontWeight:700,color:T.text}}>${t.matches_count}</div>
          <div style=${{width:26,flexShrink:0,textAlign:'right',fontSize:12,fontWeight:600,color:T.green}}>${s.played?s.w:'—'}</div>
          <div style=${{width:26,flexShrink:0,textAlign:'right',fontSize:12,fontWeight:600,color:T.yellow}}>${s.played?s.d:'—'}</div>
          <div style=${{width:26,flexShrink:0,textAlign:'right',fontSize:12,fontWeight:600,color:T.red}}>${s.played?s.l:'—'}</div>
          <div style=${{width:38,flexShrink:0,textAlign:'right',fontSize:13,fontWeight:700,color:winColor}}>${s.played?Math.round(s.winPct*100)+'%':'—'}</div>
          <div style=${{width:40,flexShrink:0,textAlign:'right',fontSize:12,fontWeight:600,color:T.muted}}>${s.played?s.ppw.toFixed(1):'—'}</div>
        </div>`;
      })}
    </${Card}>
  </div>`;
}

function ClubDetail({team,data,onBack}){
  const matches=(data.matches||[]).filter(m=>m.home_team?.id===team.id||m.away_team?.id===team.id);
  const wins=matches.filter(m=>{const isHome=m.home_team?.id===team.id;const ts=isHome?m.home_score:m.away_score,os=isHome?m.away_score:m.home_score;return ts>os;}).length;
  const draws=matches.filter(m=>m.home_score===m.away_score).length;
  const losses=matches.length-wins-draws;

  const goalPlayers={};
  matches.forEach(m=>(m.goals||[]).filter(g=>g.team===team.name).forEach(g=>{if(g.player_id){goalPlayers[g.player_id]=(goalPlayers[g.player_id]||{name:g.player,count:0});goalPlayers[g.player_id].count++;}}) );
  const topScorers=Object.entries(goalPlayers).sort((a,b)=>b[1].count-a[1].count).slice(0,5);

  return html`<div style=${{display:'flex',flexDirection:'column',gap:12}}>
    <button onClick=${onBack} style=${{background:'none',border:'none',color:T.blue,fontSize:14,cursor:'pointer',textAlign:'left',display:'flex',alignItems:'center',gap:6,padding:'4px 0',fontWeight:600}}>
      <${Icon} name="arrowleft" size=${16} color=${T.blue} /> Terug
    </button>
    <${Card} style=${{background:'rgba(0,122,255,0.05)',border:'1px solid rgba(0,122,255,0.15)'}}>
      <div style=${{display:'flex',gap:16,alignItems:'center'}}>
        <div style=${{width:64,height:64,background:T.bg3,borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center'}}>
          <${TeamBadge} id=${team.id} name=${team.name} size=${56} />
        </div>
        <div>
          <div style=${{fontSize:22,fontWeight:800,color:T.text}}>${team.name}</div>
          <div style=${{fontSize:13,color:T.muted,marginTop:4}}>${matches.length} wedstrijden bezocht</div>
          <div style=${{display:'flex',gap:12,marginTop:6,fontSize:13}}>
            <span style=${{color:T.green,fontWeight:700}}>W ${wins}</span>
            <span style=${{color:T.yellow,fontWeight:700}}>G ${draws}</span>
            <span style=${{color:T.red,fontWeight:700}}>V ${losses}</span>
          </div>
        </div>
      </div>
    </${Card}>
    ${topScorers.length>0&&html`<${Card}>
      <${SectionTitle} icon="ball">Topscorers (in jouw duels)</${SectionTitle}>
      ${topScorers.map(([id,p],i)=>html`<div key=${id} style=${{display:'flex',gap:10,alignItems:'center',padding:'6px 0',borderBottom:i<topScorers.length-1?`1px solid ${T.border}`:'none'}}>
        <span style=${{color:T.dim,width:20,textAlign:'right',fontSize:13}}>${i+1}</span>
        <div style=${{flex:1,fontWeight:600,color:T.text}}>${p.name}</div>
        <span style=${{color:T.green,fontWeight:700,display:'flex',alignItems:'center',gap:3}}><${Icon} name="ball" size=${13} color=${T.green} sw=${2}/>${p.count}</span>
      </div>`)}
    </${Card}>`}
    <${Card}>
      <${SectionTitle} right=${`${matches.length} duels`}>Alle wedstrijden</${SectionTitle}>
      <div style=${{display:'flex',flexDirection:'column',gap:6}}>
        ${matches.map(m=>html`<${MiniMatchRow} key=${m.id} match=${m} />`)}
      </div>
    </${Card}>
  </div>`;
}

// ─── TAB: ZOEKEN (wedstrijden toevoegen) ──────────────────────────────────
function TabZoeken({onMatchesAdded,savedIds=new Set(),onSaved}){
  const [step,setStep]=useState('search');
  const [query,setQuery]=useState('');
  const [results,setResults]=useState([]);
  const [loading,setLoading]=useState(false);
  const [team,setTeam]=useState(null);
  const [seasons,setSeasons]=useState([]);
  const [selSeason,setSelSeason]=useState(null);
  const [events,setEvents]=useState([]);
  const [checked,setChecked]=useState(new Set());
  const [saving,setSaving]=useState(false);
  const [savedMsg,setSavedMsg]=useState('');

  async function searchTeams(){
    if(!query.trim())return;
    setLoading(true);setResults([]);
    const data=await apiFetch(`/sofascore/search/teams/${encodeURIComponent(query.trim())}`);
    setResults(data?.teams||[]);
    setLoading(false);
  }

  async function selectTeam(t){
    setTeam(t);setLoading(true);setStep('seasons');setSeasons([]);
    const data=await apiFetch(`/sofascore/team/${t.id}/unique-tournaments`);
    const tournaments=data?.uniqueTournaments||[];
    const results=await Promise.all(
      tournaments.slice(0,20).map(tn=>apiFetch(`/sofascore/unique-tournament/${tn.id}/seasons`))
    );
    const yearMap={};
    results.forEach(r=>{
      (r?.seasons||[]).forEach(s=>{
        const yr=s.year||'';
        if(!yr.includes('/')) return;
        if(!yearMap[yr]||s.id>yearMap[yr].id) yearMap[yr]={...s};
      });
    });
    const toFullYear=p=>{const n=parseInt(p);if(n>=100)return n;return n<=30?2000+n:1900+n;};
    const sorted=Object.values(yearMap).sort((a,b)=>{
      const ay=toFullYear((a.year||'0').split('/')[0]);
      const by=toFullYear((b.year||'0').split('/')[0]);
      return by-ay;
    });
    setSeasons(sorted);
    setLoading(false);
  }

  async function selectSeason(s){
    setSelSeason(s);setLoading(true);setEvents([]);setChecked(new Set());
    setStep('matches');
    const yr=s.year||'';
    const [startYr,endYr]=yr.split('/').map(p=>parseInt(p.length===2?'20'+p:p));
    const seasonStart=new Date(startYr,6,1).getTime()/1000;
    const seasonEnd=new Date(endYr,5,30,23,59,59).getTime()/1000;
    let allEvents=[], page=0, seenSeason=false, emptyAfterSeason=0;
    while(allEvents.length<400){
      const data=await apiFetch(`/sofascore/team/${team.id}/events/last/${page}`);
      const evs=data?.events||[];
      if(!evs.length) break;
      const filtered=evs.filter(e=>{
        const ts=e.startTimestamp||0;
        return ts>=seasonStart && ts<=seasonEnd;
      });
      if(filtered.length>0){ seenSeason=true; emptyAfterSeason=0; }
      else if(seenSeason){ emptyAfterSeason++; if(emptyAfterSeason>=2) break; }
      const oldest=evs[evs.length-1]?.startTimestamp||0;
      if(oldest>0 && oldest<seasonStart-60*24*3600) break;
      else if(page>14) break;
      allEvents=[...allEvents,...filtered];
      page++;
    }
    allEvents.sort((a,b)=>b.startTimestamp-a.startTimestamp);
    setEvents(allEvents);
    setLoading(false);
  }

  function toggleMatch(id){
    const s=new Set(checked);
    if(s.has(id))s.delete(id);else s.add(id);
    setChecked(s);
  }
  function toggleAll(){
    const nieuweIds=events.filter(e=>!savedIds.has(e.id)).map(e=>e.id);
    if(checked.size===nieuweIds.length) setChecked(new Set());
    else setChecked(new Set(nieuweIds));
  }

  async function saveMatches(){
    if(!checked.size)return;
    setSaving(true);
    const toSave=events.filter(e=>checked.has(e.id)).map(e=>{
      const ht=e.homeTeam||{}, at=e.awayTeam||{};
      const ts=e.startTimestamp;
      const date=ts?new Date(ts*1000).toISOString().slice(0,10):'';
      const tnmt=e.tournament?.uniqueTournament||e.tournament||{};
      return{
        id:e.id, date, startTimestamp:ts,
        home_team:{name:ht.name||'',id:ht.id,slug:ht.slug||''},
        away_team:{name:at.name||'',id:at.id,slug:at.slug||''},
        home_score:(e.homeScore?.current??null),
        away_score:(e.awayScore?.current??null),
        half_time:{home:e.homeScore?.period1??null,away:e.awayScore?.period1??null},
        tournament:tnmt.name||e.tournament?.name||'',
        tournament_id:tnmt.id||e.tournament?.id,
        season:e.season?.name||'',
        season_id:e.season?.id,
        round:e.roundInfo?.round||null,
        venue:{name:e.venue?.name||'',city:e.venue?.city?.name||e.venue?.city||'',id:e.venue?.id||null},
        attendance:e.attendance||null,
        referee:{name:e.referee?.name||'',id:e.referee?.id||null},
        source_team:team.name,
        goals:[], cards:[], substitutions:[], team_stats:{home:{},away:{}},
      };
    });
    const result=await fetch('/api/matches/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(toSave)}).then(r=>r.json()).catch(()=>null);
    setSaving(false);
    if(result){
      setSavedMsg(`${result.added} wedstrijden opgeslagen (totaal: ${result.total})`);
      if(onSaved) onSaved();
      setChecked(new Set());
      if(onMatchesAdded) onMatchesAdded();
    }
  }

  function reset(){setStep('search');setQuery('');setResults([]);setTeam(null);setSeasons([]);setSelSeason(null);setEvents([]);setChecked(new Set());setSavedMsg('');}

  // ── Render ──
  if(step==='search') return html`<div style=${{display:'flex',flexDirection:'column',gap:16}}>
    <${Card} style=${{background:'linear-gradient(135deg,#e8f4ff,#f0f7ff)',border:'1px solid rgba(0,122,255,0.15)'}}>
      <div style=${{fontSize:18,fontWeight:700,marginBottom:4,color:T.text}}>Wedstrijd toevoegen</div>
      <div style=${{fontSize:13,color:T.muted}}>Zoek een club, kies een seizoen en vink de wedstrijden aan die je bezocht hebt.</div>
    </${Card}>
    <div style=${{display:'flex',gap:8}}>
      <${SearchInput} value=${query} onChange=${setQuery} placeholder="Bijv. PSV, Ajax, Bayern..." />
    </div>
    <button onClick=${searchTeams} disabled=${loading||!query.trim()} style=${{
      background:T.blue,color:'#fff',border:'none',borderRadius:12,padding:'14px',
      fontSize:16,fontWeight:700,cursor:'pointer',opacity:loading||!query.trim()?0.4:1,
      boxShadow:'0 2px 8px rgba(0,122,255,0.25)',
    }}>${loading?'Zoeken...':'Zoeken'}</button>
    ${savedMsg&&html`<${Card} style=${{background:'rgba(52,199,89,0.08)',border:'1px solid rgba(52,199,89,0.2)'}}>
      <div style=${{color:T.green,fontWeight:600,fontSize:14}}>${savedMsg}</div>
    </${Card}>`}
    ${results.length>0&&html`<div>
      <div style=${{fontSize:12,color:T.dim,marginBottom:8}}>${results.length} resultaten</div>
      <div style=${{display:'flex',flexDirection:'column',gap:8}}>
        ${results.slice(0,10).map(t=>html`<${Card} key=${t.id} onClick=${()=>selectTeam(t)}>
          <div style=${{display:'flex',gap:12,alignItems:'center'}}>
            <div style=${{width:44,height:44,background:T.bg3,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <${TeamBadge} id=${t.id} name=${t.name} size=${38} />
            </div>
            <div>
              <div style=${{display:'flex',alignItems:'center',gap:6}}>
                <span style=${{fontWeight:700,fontSize:15,color:T.text}}>${t.name}</span>
                ${t.gender==='F'&&html`<span style=${{background:'#ff2d5518',color:'#ff2d55',borderRadius:6,padding:'1px 7px',fontSize:10,fontWeight:700}}>Vrouwen</span>`}
              </div>
              <div style=${{fontSize:12,color:T.muted}}>${t.country?.name||''}</div>
            </div>
            <span style=${{marginLeft:'auto',color:T.blue,fontSize:20}}>›</span>
          </div>
        </${Card}>`)}
      </div>
    </div>`}
  </div>`;

  if(step==='seasons') return html`<div style=${{display:'flex',flexDirection:'column',gap:12}}>
    <button onClick=${reset} style=${{background:'none',border:'none',color:T.blue,fontSize:14,cursor:'pointer',textAlign:'left',display:'flex',alignItems:'center',gap:6,padding:'4px 0',fontWeight:600}}>
      <${Icon} name="arrowleft" size=${16} color=${T.blue} /> Opnieuw zoeken
    </button>
    <${Card} style=${{display:'flex',gap:12,alignItems:'center'}}>
      <div style=${{width:48,height:48,background:T.bg3,borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center'}}>
        <${TeamBadge} id=${team.id} name=${team.name} size=${42} />
      </div>
      <div><div style=${{fontWeight:700,fontSize:18,color:T.text}}>${team.name}</div><div style=${{fontSize:13,color:T.muted}}>Kies een seizoen</div></div>
    </${Card}>
    ${loading&&html`<div style=${{textAlign:'center',color:T.muted,padding:24}}>Seizoenen laden...</div>`}
    ${!loading&&seasons.map(s=>html`<${Card} key=${s.id} onClick=${()=>selectSeason(s)}>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style=${{fontWeight:600,fontSize:16,color:T.text}}>${s.year||s.name}</div>
        <span style=${{color:T.blue,fontSize:20}}>›</span>
      </div>
    </${Card}>`)}
  </div>`;

  if(step==='matches') return html`<div style=${{display:'flex',flexDirection:'column',gap:12,paddingBottom:80}}>
    <button onClick=${()=>setStep('seasons')} style=${{background:'none',border:'none',color:T.blue,fontSize:14,cursor:'pointer',textAlign:'left',display:'flex',alignItems:'center',gap:6,padding:'4px 0',fontWeight:600}}>
      <${Icon} name="arrowleft" size=${16} color=${T.blue} /> Terug naar seizoenen
    </button>
    <${Card} style=${{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
      <div style=${{width:40,height:40,background:T.bg3,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center'}}>
        <${TeamBadge} id=${team.id} name=${team.name} size=${34} />
      </div>
      <div style=${{flex:1}}>
        <div style=${{fontWeight:700,color:T.text}}>${team.name} — ${selSeason?.year||selSeason?.name}</div>
        <div style=${{fontSize:12,color:T.muted}}>Alle competities</div>

    ${loading&&html`<div style=${{textAlign:'center',color:T.muted,padding:32}}>Wedstrijden ophalen... (even geduld)</div>`}
    ${!loading&&events.length>0&&html`<div>

              width:22,height:22,borderRadius:6,

              transition:'all 0.15s',

              ${(alreadySaved||isChecked)&&html`<${Icon} name="check" size=${14} color="#fff" sw=${3}/>`}

          </div>`;
        })}
      </div>
    </div>`}
    ${!loading&&events.length===0&&selSeason&&html`<${Card}>
      <div style=${{textAlign:'center',color:T.muted,padding:16}}>Geen wedstrijden gevonden</div>
    </${Card}>`}
    <!-- Sticky save button -->
    ${checked.size>0&&html`<div style=${{position:'fixed',bottom:'calc(90px + env(safe-area-inset-bottom,0px))',left:0,right:0,padding:'12px 16px',background:'rgba(242,242,247,0.88)',backdropFilter:'blur(20px) saturate(160%)',WebkitBackdropFilter:'blur(20px) saturate(160%)',borderTop:`1px solid rgba(255,255,255,0.5)`,zIndex:20}}>

    </div>`}
